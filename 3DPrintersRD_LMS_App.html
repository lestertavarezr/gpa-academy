const Badge=({text,color='blue'})=>{

const Btn=({children,onClick,color='primary',size='md',disabled=false,style={}})=>{

    <div style={{position:'fixed',bottom:24,right:24,zIndex:2000,background:colors[type]||colors.info,border:`1.5px solid ${type==='success'?'#6EE7B7':type==='error'?'#FCA5A5':'#93C5FD'}`,borderRadius:12,padding:'12px 20px',minWidth:260,boxShadow:'0 8px 24px rgba(0,0,0,0.15)',display:'flex',alignItems:'center',gap:10}}>

const ProgressBar=({value,max,color=COLORS.accent,height=10,showLabel=true})=>{
  const pct=Math.min(100,Math.round((value/max)*100));
  return(
    <div>
      {showLabel&&<div style={{display:'flex',justifyContent:'space-between',fontSize:12,marginBottom:3,color:'#6B7280'}}>
        <span>{value} / {max}</span><span style={{fontWeight:700,color}}>{pct}%</span>
      </div>}
      <div style={{height,background:'#F3F4F6',borderRadius:999}}>
        <div style={{height:'100%',width:`${pct}%`,background:pct>=100?COLORS.success:pct>=70?COLORS.accent:COLORS.warning,borderRadius:999,transition:'width 0.4s'}}/>
      </div>
    </div>
  );
};

            <input type={showPass?'text':'password'} value={password} onChange={e=>setPassword(e.target.value)} onKeyDown={handleKey}
              placeholder="••••••••"

              {showPass?'Ocultar':'Ver'}
            </button>
          </div>
        </div>

        {error&&<div style={{padding:'9px 14px',background:'#FEE2E2',borderRadius:8,fontSize:13,color:'#991B1B',marginBottom:16,fontWeight:500}}>⚠ {error}</div>}

        <button onClick={handle} style={{width:'100%',padding:14,background:COLORS.primary,color:'white',border:'none',borderRadius:10,fontSize:16,fontWeight:700,cursor:'pointer',letterSpacing:0.3}}>
          Iniciar Sesión
        </button>

        <div style={{marginTop:20,padding:'12px 14px',background:'#F8FAFC',borderRadius:10,border:'1px solid #E5E7EB'}}>
          <div style={{fontSize:12,color:'#6B7280',fontWeight:600,marginBottom:6}}>Acceso rápido (demo):</div>
          <div style={{display:'flex',gap:6,flexWrap:'wrap'}}>
            {[['admin','3DP.Admin2026!','🔑 Admin'],['ing.duarte','3DP#2026','🛠️ Instructor'],['camila.reynoso','Est2026!','🎓 Estudiante']].map(([u,p,label])=>(
              <button key={u} onClick={()=>{setUsername(u);setPassword(p);setError('');}}
                style={{padding:'4px 10px',borderRadius:6,border:'1.5px solid #D1D5DB',background:'white',fontSize:11,cursor:'pointer',fontWeight:600,color:'#374151'}}>
                {label}
              </button>
            ))}
          </div>
        </div>
      </div>
    </div>
  );
};

const StudentDashboardPage=({state,toast,user})=>{
  const st=state.students.find(s=>s.id===user.id);
  const prog=state.programs.find(p=>p.id===st?.programId);
  const mySessions=state.sessions.filter(a=>a.studentId===user.id);
  const myChecklists=mySessions.map(a=>state.checklists.find(c=>c.sessionId===a.id)).filter(Boolean);

  const attended=myChecklists.filter(c=>c.attendance==='attended'||c.attendance==='late').length;
  const attendanceRate=myChecklists.length===0?0:Math.round(attended/myChecklists.length*100);
  const hoursFromChecklists=myChecklists.reduce((s,c)=>s+(c.totalHours||0),0);
  const totalHours=st?.completedHoursOverride!=null?st.completedHoursOverride:hoursFromChecklists;
  const requiredHours=st?.requiredHoursOverride||(prog?.requiredHours||30);
  const totalProjects=myChecklists.reduce((s,c)=>s+(c.projects||[]).reduce((ss,p)=>ss+p.count,0),0);

  const skillMatrix={};
  myChecklists.forEach(c=>Object.entries(c.skillLevels||{}).forEach(([sk,lv])=>{skillMatrix[sk]=Math.max(skillMatrix[sk]||0,lv);}));
  const totalSkills=prog?.skills?.length||0;
  const dominatedSkills=Object.values(skillMatrix).filter(v=>v>=3).length;
  const pendingSkills=totalSkills>0?prog.skills.filter(sk=>(skillMatrix[sk]||0)===0).length:0;

  const grades=st?.grades&&st.grades.length>0?st.grades:[];
  const avgGrade=grades.length>0?(grades.reduce((s,g)=>s+Number(g.grade),0)/grades.length).toFixed(1):'—';

  const today='2026-07-20';
  const nextA=mySessions.filter(a=>a.date>=today&&a.status==='scheduled').sort((a,b)=>a.date.localeCompare(b.date))[0];
  const nextDate=st?.nextClassDate||(nextA?.date||null);
  const nextTime=st?.nextClassTime||(nextA?`${nextA.shiftStart}–${nextA.shiftEnd}`:null);
  const nextModule=st?.nextClassModule||(nextA?(prog?.name||'Sesión de práctica'):null);
  const nextLoc=nextA?state.locations.find(h=>h.id===nextA.locationId)?.name:null;
  const nextIns=nextA?state.instructors.find(d=>d.id===nextA.instructorId)?.name:null;

  const totalClasses=st?.totalClasses||(prog?.requiredProjects||10);
  const completedClasses=st?.completedClasses!=null?st.completedClasses:myChecklists.length;
  const progressPct=Math.min(100,Math.round((completedClasses/Math.max(totalClasses,1))*100));
  const hoursPct=Math.min(100,Math.round(totalHours/Math.max(requiredHours,1)*100));

  const material=st?.materialLink||'';
  const video=st?.videoLink||'';
  const qbank=st?.questionBankLink||'';
  const slicer=st?.slicerProfilesLink||'';

  const PHRASES=[
    'Cada capa cuenta: la precisión de hoy es la pieza perfecta de mañana. 🖨️',
    'El mejor maker no es el que nunca falla una impresión, sino el que aprende de cada warping. 🔧',
    'Dominar el slicer es dominar tu creatividad. ¡Sigue imprimiendo! 🧊',
    'Tu calibración, tu paciencia, tu precisión — así se construye un experto en manufactura aditiva. ⚙️',
    'Hoy aprendices, mañana referentes de la impresión 3D en RD. ¡Aprovecha cada sesión! 🚀',
    'La excelencia en impresión 3D se construye pieza a pieza. ¡Sigue sumando! 🌟',
  ];
  const phrase=PHRASES[18%PHRASES.length];
  const projectTypes=prog?.projectTypes?.slice(0,8)||[];

  const ResourceCard=({href,emoji,label,sub,color})=>{
    const hasLink=href&&href.trim()!=='';
    return(
      <a href={hasLink?href:'#'} target={hasLink?'_blank':'_self'}
        onClick={hasLink?undefined:e=>{e.preventDefault();toast('Enlace no configurado aún. El administrador debe agregar el enlace.','info');}}
        style={{display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',gap:10,padding:'22px 16px',
          background:'white',borderRadius:14,textDecoration:'none',transition:'all 0.2s',
          border:`2px solid ${hasLink?color+'35':'#E5E7EB'}`,
          boxShadow:`0 2px 8px rgba(0,0,0,${hasLink?'0.08':'0.04'})`,cursor:'pointer',minHeight:130,
          opacity:hasLink?1:0.7}}>
        <div style={{width:50,height:50,borderRadius:14,background:`${color}15`,display:'flex',alignItems:'center',justifyContent:'center'}}>
          <span style={{fontSize:26}}>{emoji}</span>
        </div>
        <div style={{textAlign:'center'}}>
          <div style={{fontWeight:700,fontSize:13,color:hasLink?'#1F2937':'#9CA3AF',lineHeight:1.3}}>{label}</div>
          <div style={{fontSize:11,color:'#9CA3AF',marginTop:3}}>{sub}</div>
        </div>
        {!hasLink&&<span style={{fontSize:10,color:'#D1D5DB',fontStyle:'italic',marginTop:-4}}>Pendiente de configurar</span>}
        {hasLink&&<span style={{fontSize:11,fontWeight:600,color:color,display:'flex',alignItems:'center',gap:3}}>Acceder →</span>}
      </a>
    );
  };

  const pColor=p=>p>=80?COLORS.success:p>=50?COLORS.accent:COLORS.warning;
  const aColor=r=>r>=80?COLORS.success:r>=60?COLORS.warning:COLORS.danger;

  return(
    <div style={{padding:'20px 24px 32px',boxSizing:'border-box'}}>
      <div style={{marginBottom:22,padding:'22px 28px',background:`linear-gradient(135deg,${COLORS.primary} 0%,#3A3F4B 100%)`,borderRadius:18,color:'white',boxShadow:'0 8px 24px rgba(17,24,39,0.28)',position:'relative',overflow:'hidden'}}>
        <div style={{position:'absolute',right:-20,top:-20,width:120,height:120,borderRadius:'50%',background:'rgba(249,115,22,0.12)'}}></div>
        <div style={{position:'absolute',right:60,bottom:-30,width:80,height:80,borderRadius:'50%',background:'rgba(249,115,22,0.08)'}}></div>
        <div style={{display:'flex',alignItems:'flex-start',justifyContent:'space-between',flexWrap:'wrap',gap:12,position:'relative'}}>
          <div style={{flex:1,minWidth:260}}>
            <div style={{fontSize:11,opacity:0.72,fontWeight:700,letterSpacing:1.5,textTransform:'uppercase',marginBottom:8}}>Centro de Progreso · 3D Printers RD Academia</div>
            <h2 style={{margin:'0 0 8px',fontSize:26,fontWeight:900,letterSpacing:-0.5}}>¡Bienvenido, {(st?.name||user.name).split(' ')[0]}! 👋</h2>
            <p style={{margin:0,fontSize:13.5,opacity:0.88,lineHeight:1.65,maxWidth:560}}>{phrase}</p>
          </div>
          <div style={{background:'rgba(255,255,255,0.14)',borderRadius:12,padding:'14px 20px',textAlign:'center',backdropFilter:'blur(4px)',flexShrink:0}}>
            <div style={{fontSize:10,opacity:0.7,fontWeight:700,textTransform:'uppercase',letterSpacing:1,marginBottom:5}}>Programa Actual</div>
            <div style={{fontSize:14,fontWeight:800,lineHeight:1.3,maxWidth:180}}>{prog?.name||st?.cohort||'Sin programa asignado'}</div>
            <div style={{fontSize:11,opacity:0.65,marginTop:5,fontFamily:'monospace'}}>{st?.code||user.id}</div>
          </div>
        </div>
      </div>

      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr 1fr',gap:14,marginBottom:18}}>
        <div style={{background:'white',borderRadius:14,padding:'18px 20px',boxShadow:'0 2px 10px rgba(17,24,39,0.08)',border:'1px solid #EEF2F7'}}>
          <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:14}}>
            <div style={{width:36,height:36,borderRadius:10,background:COLORS.light,display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}><span style={{fontSize:18}}>📈</span></div>
            <span style={{fontWeight:700,fontSize:13,color:COLORS.primary}}>Progreso General</span>
          </div>
          <div style={{display:'flex',alignItems:'baseline',gap:3,marginBottom:10}}>
            <span style={{fontSize:42,fontWeight:900,color:pColor(progressPct),lineHeight:1}}>{progressPct}</span>
            <span style={{fontSize:20,fontWeight:700,color:'#CBD5E1'}}>%</span>
          </div>
          <div style={{height:8,background:'#F1F5F9',borderRadius:999,marginBottom:8,overflow:'hidden'}}>
            <div style={{height:'100%',width:`${progressPct}%`,background:pColor(progressPct),borderRadius:999,transition:'width 0.7s ease'}}/>
          </div>
          <div style={{fontSize:12,color:'#64748B'}}>{completedClasses} de {totalClasses} sesiones completadas</div>
          {progressPct>=100&&<div style={{marginTop:6,fontSize:11,fontWeight:700,color:COLORS.success}}>🎓 ¡Listo para certificación!</div>}
        </div>

        <div style={{background:'white',borderRadius:14,padding:'18px 20px',boxShadow:'0 2px 10px rgba(17,24,39,0.08)',border:`2px solid ${nextDate?COLORS.accent+'40':'#E5E7EB'}`}}>
          <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:14}}>
            <div style={{width:36,height:36,borderRadius:10,background:'#FFF7ED',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}><span style={{fontSize:18}}>📅</span></div>
            <span style={{fontWeight:700,fontSize:13,color:COLORS.primary}}>Próxima Sesión</span>
          </div>
          {nextDate?(
            <div>
              <div style={{fontSize:17,fontWeight:800,color:COLORS.primary,marginBottom:4}}>{nextDate}</div>
              <div style={{fontSize:12,color:COLORS.accent,fontWeight:700,marginBottom:6,background:COLORS.light,display:'inline-block',padding:'2px 8px',borderRadius:6}}>{nextTime||'—'}</div>
              <div style={{fontSize:12,color:'#374151',marginBottom:6,lineHeight:1.45,fontWeight:500}}>{nextModule}</div>
              {(nextLoc||nextIns)&&<div style={{fontSize:11,color:'#9CA3AF',marginBottom:10}}>🏭 {nextLoc}{nextIns?<span> · {nextIns}</span>:null}</div>}
              <button onClick={()=>toast('📍 Abriendo detalles de tu sesión...','info')} style={{width:'100%',padding:'8px 12px',background:COLORS.accent,color:'white',border:'none',borderRadius:8,fontWeight:700,fontSize:12,cursor:'pointer',marginTop:4}}>
                Ver Detalles →
              </button>
            </div>
          ):(
            <div style={{textAlign:'center',padding:'16px 0',color:'#9CA3AF'}}>
              <div style={{fontSize:28,marginBottom:8}}>📭</div>
              <div style={{fontSize:13,fontWeight:500}}>Sin sesiones programadas</div>
            </div>
          )}
        </div>

        <div style={{background:'white',borderRadius:14,padding:'18px 20px',boxShadow:'0 2px 10px rgba(17,24,39,0.08)',border:'1px solid #EEF2F7'}}>
          <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:14}}>
            <div style={{width:36,height:36,borderRadius:10,background:'#ECFDF5',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}><span style={{fontSize:18}}>✅</span></div>
            <span style={{fontWeight:700,fontSize:13,color:COLORS.primary}}>Asistencia</span>
          </div>
          <div style={{display:'flex',alignItems:'baseline',gap:3,marginBottom:10}}>
            <span style={{fontSize:42,fontWeight:900,color:aColor(attendanceRate),lineHeight:1}}>{attendanceRate}</span>
            <span style={{fontSize:20,fontWeight:700,color:'#CBD5E1'}}>%</span>
          </div>
          <div style={{height:8,background:'#F1F5F9',borderRadius:999,marginBottom:8,overflow:'hidden'}}>
            <div style={{height:'100%',width:`${attendanceRate}%`,background:aColor(attendanceRate),borderRadius:999}}/>

            <span style={{fontWeight:700,fontSize:13,color:COLORS.primary}}>Horas de Taller</span>

const InstructorDashboardPage=({state,toast,user,setView})=>{
  const today='2026-07-20';

  const myAlerts=state.workshopAlerts.filter(a=>a.instructorId===user.id&&a.status==='active');
  const myChecklists=state.checklists.filter(c=>mySessions.some(s=>s.id===c.sessionId));
  const avgPerf=myChecklists.length>0?(myChecklists.reduce((s,c)=>s+(c.performance||0),0)/myChecklists.length).toFixed(1):'—';
  const pendingSigns=mySessions.filter(a=>a.status==='completed'&&!state.checklists.some(c=>c.sessionId===a.id)).length;

  return(
    <div style={{padding:'20px 24px 32px'}}>

        <p style={{margin:0,fontSize:13.5,opacity:0.85}}>Tienes {todaySessions.length} sesión{todaySessions.length!==1?'es':''} programada{todaySessions.length!==1?'s':''} hoy ({today}).</p>
      </div>

      <div style={{display:'flex',gap:14,flexWrap:'wrap',marginBottom:20}}>
        <StatCard label="Sesiones Hoy" value={todaySessions.length} icon="calendar" color={COLORS.accent}/>
        <StatCard label="Desempeño Promedio" value={avgPerf} icon="skills" color={COLORS.success} sub="sobre 10"/>
        <StatCard label="Alertas Activas" value={myAlerts.length} icon="alerts" color={COLORS.danger}/>
        <StatCard label="Checklists Pendientes" value={pendingSigns} icon="checklist" color={COLORS.warning}/>
      </div>

      <div style={{display:'grid',gridTemplateColumns:'1.3fr 1fr',gap:16}}>
        <Card>
          <div style={{fontWeight:700,fontSize:15,color:COLORS.primary,marginBottom:14}}>Sesiones de Hoy</div>

            const st=byId(state.students,a.studentId);const loc=byId(state.locations,a.locationId);
            return(
              <div key={a.id} style={{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'10px 0',borderBottom:'1px solid #F1F5F9'}}>
                <div>
                  <div style={{fontWeight:600,fontSize:13,color:'#1F2937'}}>{st?.name}</div>
                  <div style={{fontSize:11,color:'#9CA3AF'}}>{a.shift} · {a.shiftStart}–{a.shiftEnd} · {loc?.name}</div>
                </div>
                {statusBadge(a.status)}
              </div>
            );
          })}
          <Btn size="sm" style={{marginTop:12}} onClick={()=>setView&&setView('sessions')}>Ver todas las sesiones</Btn>
        </Card>

        <Card>
          <div style={{fontWeight:700,fontSize:15,color:COLORS.primary,marginBottom:14}}>Alertas Activas</div>
          {myAlerts.length===0&&<div style={{color:'#9CA3AF',fontSize:13}}>Sin alertas activas.</div>}
          {myAlerts.map(a=>{
            const st=byId(state.students,a.studentId);
            return(
              <div key={a.id} style={{padding:'8px 0',borderBottom:'1px solid #F1F5F9'}}>
                <div style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
                  <span style={{fontWeight:600,fontSize:13}}>{st?.name}</span>{priorityBadge(a.priority)}
                </div>
                <div style={{fontSize:11,color:'#6B7280',marginTop:2}}>{a.description}</div>
              </div>
            );
          })}
        </Card>
      </div>

      <Card style={{marginTop:16}}>
        <div style={{fontWeight:700,fontSize:15,color:COLORS.primary,marginBottom:14}}>Próximas Sesiones</div>
        <Table headers={['Fecha','Estudiante','Turno','Sede','Estado']} rows={upcoming.map(a=>[a.date,byId(state.students,a.studentId)?.name||'—',`${a.shiftStart}–${a.shiftEnd}`,byId(state.locations,a.locationId)?.name||'—',statusBadge(a.status)])}/>
      </Card>
    </div>
  );
};

const AdminDashboardPage=({state})=>{

  const totalStudents=state.students.length;
  const overduePayments=state.students.filter(s=>s.paymentStatus==='atrasado').length;
  const pendingChanges=state.scheduleChanges.filter(c=>c.status==='pending').length;
  const hotLeads=state.leads.filter(l=>l.temperature==='caliente').length;
  const pipelineValue=state.leads.reduce((s,l)=>s+(l.value||0),0);
  const revenueActive=state.programs.filter(p=>p.status==='activo').reduce((s,p)=>s+p.studentsCount*p.price,0);

  return(
    <div style={{padding:'20px 24px 32px'}}>
      <div style={{marginBottom:22,padding:'22px 28px',background:`linear-gradient(135deg,${COLORS.primary} 0%,#3A3F4B 100%)`,borderRadius:18,color:'white'}}>

        <StatCard label="Estudiantes Totales" value={totalStudents} icon="students" color={COLORS.success}/>
        <StatCard label="Pagos Atrasados" value={overduePayments} icon="alerts" color={COLORS.danger}/>
        <StatCard label="Cambios Pendientes" value={pendingChanges} icon="changes" color={COLORS.warning}/>
        <StatCard label="Leads Calientes" value={hotLeads} icon="bot" color={COLORS.danger} sub={`Pipeline: RD$${pipelineValue.toLocaleString()}`}/>
        <StatCard label="Ingresos (cohortes activas)" value={`RD$${revenueActive.toLocaleString()}`} icon="reports" color={COLORS.success}/>

      <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',gap:10}}>

        </div>
        <div style={{flex:'1 1 100px',background:'#FAFAF9',borderRadius:10,padding:'10px 12px'}}>
          <div style={{fontSize:10,fontWeight:700,color:'#9CA3AF',textTransform:'uppercase',letterSpacing:0.5}}>Proyectos req.</div>

          <div style={{fontSize:10,fontWeight:700,color:'#9CA3AF',textTransform:'uppercase',letterSpacing:0.5}}>Horas req.</div>
          <div style={{fontSize:17,fontWeight:800,color:COLORS.primary,marginTop:2}}>{p.requiredHours}h</div>

      </div>

      <div>

        {expanded?'Ocultar contenido del programa':'Ver contenido del programa'} {expanded?'▲':'▼'}

      {expanded&&(
        <div style={{display:'flex',flexDirection:'column',gap:10,paddingTop:4,borderTop:'1px solid #F1F5F9'}}>

// APP PRINCIPAL
// ══════════════════════════════════════════════════════════════════════════
const reducer=(state,action)=>{
  switch(action.type){
    case 'COMPLETE_SESSION':
      return {...state, sessions: state.sessions.map(a=>a.id===action.payload?{...a,status:'completed'}:a)};
    case 'APPROVE_CHANGE':
      return {...state, scheduleChanges: state.scheduleChanges.map(c=>c.id===action.payload?{...c,status:'approved',reviewedAt:new Date().toISOString()}:c)};
    case 'REJECT_CHANGE':
      return {...state, scheduleChanges: state.scheduleChanges.map(c=>c.id===action.payload?{...c,status:'rejected',reviewedAt:new Date().toISOString()}:c)};
    case 'RESOLVE_ALERT':
      return {...state, workshopAlerts: state.workshopAlerts.map(a=>a.id===action.payload?{...a,status:'resolved'}:a)};
    case 'ADD_COORD_NOTE':
      return {...state, coordinationNotes: [action.payload, ...state.coordinationNotes]};
    default:
      return state;
  }
};
const initialState = { ...SAMPLE_DATA };

function App() {
  const [user, setUser] = React.useState(null);
  const [view, setView] = React.useState('dashboard');
  const [collapsed, setCollapsed] = React.useState(false);
  const [toastMsg, setToastMsg] = React.useState(null);
  const [state, dispatch] = React.useReducer(reducer, initialState);

  const toast = (msg, type = 'success') => setToastMsg({ msg, type: type === true ? 'success' : type, key: Date.now() });
  const handleLogout = () => { setUser(null); setView('dashboard'); };

  if (!user) return <LoginPage onLogin={setUser} users={ADMIN_USERS} />;

  const pageTitle = {
    dashboard: user.role === 'student' ? 'Mi Dashboard' : user.role === 'instructor' ? 'Supervisión de Taller' : 'Dashboard',
    programs: 'Programas Académicos',
    supervision: 'Supervisión de Taller',
    students: 'Gestión de Estudiantes',
    instructors: 'Gestión de Instructores',
    locations: 'Sedes y Talleres',
    sessions: 'Sesiones',
    calendar: 'Calendario',
    changes: 'Cambios de Horario',
    checklist: 'Checklist de Sesión',
    reports: 'Reportes',
    skills: 'Gestión de Destrezas',
    workshop_alerts: 'Alertas de Taller',
    coordinacion: 'Coordinación',
    bot: 'Bot ADI',
    alerts: 'Alertas del Sistema',
    notifications: 'Notificaciones',
  }[view] || '3D Printers RD';

  const pendingChanges = state.scheduleChanges.filter(c => c.status === 'pending').length;

  const renderView = () => {
    if (view === 'dashboard') {
      if (user.role === 'student') return <StudentDashboardPage state={state} dispatch={dispatch} toast={toast} user={user} />;
      if (user.role === 'instructor') return <InstructorDashboardPage state={state} dispatch={dispatch} toast={toast} user={user} setView={setView} />;
      return <AdminDashboardPage state={state} />;
    }
    if (view === 'programs') return <ProgramsPage state={state} />;
    if (view === 'supervision') return <InstructorDashboardPage state={state} dispatch={dispatch} toast={toast} user={user} setView={setView} />;
    if (view === 'students') return <StudentsPage state={state} dispatch={dispatch} toast={toast} />;
    if (view === 'instructors') return <InstructorsPage state={state} dispatch={dispatch} toast={toast} />;
    if (view === 'locations') return <LocationsPage state={state} />;
    if (view === 'sessions') return <SessionsPage state={state} dispatch={dispatch} toast={toast} user={user} />;
    if (view === 'calendar') return <CalendarPage state={state} user={user} />;
    if (view === 'changes') return <ChangesPage state={state} dispatch={dispatch} toast={toast} user={user} />;
    if (view === 'checklist') return <ChecklistPage state={state} />;
    if (view === 'reports') return <ReportsPage state={state} />;
    if (view === 'skills') return <SkillsPage state={state} />;
    if (view === 'workshop_alerts') return <WorkshopAlertsPage state={state} dispatch={dispatch} toast={toast} user={user} />;
    if (view === 'coordinacion') return <CoordinationPage state={state} dispatch={dispatch} toast={toast} user={user} />;
    if (view === 'bot') return <BotPage state={state} />;
    if (view === 'alerts') return <SystemAlertsPage state={state} />;
    if (view === 'notifications') return <NotificationsPage state={state} />;
    return null;
  };

  return (
    <div style={{ display: 'flex', height: '100vh' }}>
      <Sidebar user={user} view={view} setView={setView} collapsed={collapsed} setCollapsed={setCollapsed} />
      <div style={{ flex: 1, display: 'flex', flexDirection: 'column' }}>
        <Header title={pageTitle} user={user} pendingChanges={pendingChanges} onLogout={handleLogout} />
        <div style={{ flex: 1, overflowY: 'auto', background: COLORS.bg }}>
          {renderView()}
        </div>
      </div>
      <div style={{ position: 'fixed', bottom: 0, right: 0, zIndex: 2000 }}>
        {toastMsg && <Toast key={toastMsg.key} msg={toastMsg.msg} type={toastMsg.type} onClose={() => setToastMsg(null)} />}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script></body></html>
