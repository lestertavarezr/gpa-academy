const Badge=({text,color='blue'})=>{
  const map={blue:'#DBEAFE:#1E40AF',green:'#D1FAE5:#065F46',red:'#FEE2E2:#991B1B',yellow:'#FEF3C7:#92400E',gray:'#F3F4F6:#374151',purple:'#EDE9FE:#5B21B6',orange:'#FFEDD5:#9A3412'};
  const [bg,tc]=(map[color]||map.gray).split(':');
  return <span style={{background:bg,color:tc,padding:'2px 10px',borderRadius:999,fontSize:12,fontWeight:600,whiteSpace:'nowrap'}}>{text}</span>;
};

const Btn=({children,onClick,color='primary',size='md',disabled=false,style={}})=>{
  const colors={primary:`background:${COLORS.accent};color:white`,secondary:'background:#F3F4F6;color:#374151',danger:`background:${COLORS.danger};color:white`,success:`background:${COLORS.success};color:white`,ghost:'background:transparent;color:#374151'};
  const sizes={sm:'padding:4px 12px;font-size:13px',md:'padding:8px 18px;font-size:14px',lg:'padding:12px 24px;font-size:16px'};
  const cs=Object.fromEntries([...colors[color].split(';'),...sizes[size].split(';')].map(s=>s.split(':')));
  return <button onClick={onClick} disabled={disabled} style={{...cs,border:'none',borderRadius:8,fontWeight:600,cursor:disabled?'not-allowed':'pointer',opacity:disabled?0.6:1,display:'inline-flex',alignItems:'center',gap:6,...style}}>{children}</button>;
};

const StudentDashboardPage=({state,dispatch,toast,user})=>{
  const st=state.students.find(s=>s.id===user.id);
  const prog=state.programs?.find(p=>p.id===st?.programId);
  const myAssignments=state.assignments.filter(a=>a.studentId===user.id);
  const myChecklists=myAssignments.map(a=>state.checklists.find(c=>c.assignmentId===a.id)).filter(Boolean);

  // ── Computed metrics ──────────────────────────────────────────────────────
  const attended=myChecklists.filter(c=>c.attendance==='attended'||c.attendance==='late').length;
  const attendanceRate=myChecklists.length===0?0:Math.round(attended/myChecklists.length*100);
  const hoursFromChecklists=myChecklists.reduce((s,c)=>s+(c.totalHours||0),0);
  const totalHours=st?.completedHoursOverride!=null?st.completedHoursOverride:hoursFromChecklists;
  const requiredHours=st?.requiredHoursOverride||(prog?.requiredHours||40);
  const totalCases=myChecklists.reduce((s,c)=>s+(c.cases||[]).reduce((ss,ca)=>ss+ca.count,0),0);

  // ── Skills ────────────────────────────────────────────────────────────────
  const skillMatrix={};
  myChecklists.forEach(c=>Object.entries(c.skillLevels||{}).forEach(([sk,lv])=>{skillMatrix[sk]=Math.max(skillMatrix[sk]||0,lv);}));
  const totalSkills=prog?.skills?.length||0;
  const dominatedSkills=Object.values(skillMatrix).filter(v=>v>=3).length;
  const pendingSkills=totalSkills>0?prog.skills.filter(sk=>(skillMatrix[sk]||0)===0).length:0;

  // ── Grades ────────────────────────────────────────────────────────────────
  const grades=st?.grades&&st.grades.length>0
    ?st.grades
    :myChecklists.map((c,i)=>{const a=myAssignments.find(as=>as.id===c.assignmentId);return{subject:`Práctica ${i+1}`,grade:c.performance||0,date:a?.date||''};}).filter(g=>g.grade>0);
  const avgGrade=grades.length>0?(grades.reduce((s,g)=>s+Number(g.grade),0)/grades.length).toFixed(1):'—';

  // ── Next class ────────────────────────────────────────────────────────
  const today=new Date().toISOString().split('T')[0];
  const nextA=myAssignments.filter(a=>a.date>=today&&a.status==='scheduled').sort((a,b)=>a.date.localeCompare(b.date))[0];
  const nextDate=st?.nextClassDate||(nextA?.date||null);
  const nextTime=st?.nextClassTime||(nextA?`${nextA.shiftStart}–${nextA.shiftEnd}`:null);

  // ── Progress ──────────────────────────────────────────────────────────────

  const completedClasses=st?.completedClasses!=null?st.completedClasses:myChecklists.length;
  const progressPct=Math.min(100,Math.round((completedClasses/Math.max(totalClasses,1))*100));
  const hoursPct=Math.min(100,Math.round(totalHours/Math.max(requiredHours,1)*100));

  // ── Resources ─────────────────────────────────────────────────────────────
  const drive=st?.driveLink||'';
  const video=st?.videoLink||'';
  const qbank=st?.questionBankLink||'';
  const vr=st?.vrLink||'';

// ── DOCTOR CLINICAL DASHBOARD ────────────────────────────────────────────────
const DoctorDashboardPage=({state,dispatch,toast,user,setView})=>{
  const [reportModal,setReportModal]=React.useState(false);
  const [attendModal,setAttendModal]=React.useState(null);
  const [attendForm,setAttendForm]=React.useState({clockIn:'',clockOut:'',attendance:'attended',minutesLate:0});
  const [evalModal,setEvalModal]=React.useState(null);
  const [evalForm,setEvalForm]=React.useState({performance:8,comments:'',dresscode:true,handwash:true,areaKnowledge:true,instruments:true,asepsis:true,participation:true,communication:true,hospitalRules:true});

  const today=new Date().toISOString().split('T')[0];
  const nowHour=new Date().getHours();
  const greeting=nowHour<12?'Buenos días':nowHour<18?'Buenas tardes':'Buenas noches';
  const doctorRecord=state.doctors.find(d=>d.id===user.id);

  const myAssignments=state.assignments.filter(a=>a.doctorId===user.id);
  const todayAssignments=myAssignments.filter(a=>a.date===today);
  const upcomingAssignments=myAssignments.filter(a=>a.date>=today&&a.status==='scheduled').sort((a,b)=>a.date.localeCompare(b.date));
  const completedAssignments=myAssignments.filter(a=>a.status==='completed');
  const myChecklists=state.checklists.filter(c=>myAssignments.some(a=>a.id===c.assignmentId));
  const pendingEvals=completedAssignments.filter(a=>!state.checklists.find(c=>c.assignmentId===a.id&&c.signed));
  const myStudentIds=[...new Set(myAssignments.map(a=>a.studentId))];
  const myStudents=state.students.filter(s=>myStudentIds.includes(s.id));
  const totalHoursSupervised=myChecklists.reduce((s,c)=>s+(c.totalHours||0),0);
  const totalCasesSupervised=myChecklists.reduce((s,c)=>s+(c.cases||[]).reduce((ss,ca)=>ss+ca.count,0),0);
  const todayAttended=myChecklists.filter(c=>{const a=myAssignments.find(a=>a.id===c.assignmentId);return a&&a.date===today&&c.attendance==='attended';}).length;

  const lowAttendanceStudents=myStudents.filter(s=>{
    const sA=myAssignments.filter(a=>a.studentId===s.id&&a.status==='completed');
    if(!sA.length) return false;
    const sCl=myChecklists.filter(c=>sA.some(a=>a.id===c.assignmentId));
    if(!sCl.length) return false;
    return sCl.filter(c=>c.attendance==='attended').length/sCl.length<0.75;
  });
  const alertCount=lowAttendanceStudents.length+pendingEvals.length;

  const getStudent=id=>state.students.find(s=>s.id===id);
  const getHospital=id=>state.hospitals.find(h=>h.id===id);
  const getArea=(hId,aId)=>{const h=state.hospitals.find(h=>h.id===hId);return h?.areas?.find(a=>a.id===aId);};
  const getProgram=id=>state.programs?.find(p=>p.id===id);
  const getChecklist=aId=>state.checklists.find(c=>c.assignmentId===aId);
  const studentPerf=sId=>{
    const sA=myAssignments.filter(a=>a.studentId===sId&&a.status==='completed');
    const sCl=myChecklists.filter(c=>sA.some(a=>a.id===c.assignmentId)&&c.performance>0);
    if(!sCl.length) return null;
    return Math.round(sCl.reduce((s,c)=>s+c.performance,0)/sCl.length*10)/10;
  };
  const lastAttendance=sId=>{
    const sA=myAssignments.filter(a=>a.studentId===sId&&a.status==='completed').sort((a,b)=>b.date.localeCompare(a.date));
    return sA[0]?.date||null;
  };

  const submitAttend=()=>{
    dispatch({type:'COMPLETE_ASSIGNMENT',payload:attendModal.id});
    const existing=getChecklist(attendModal.id);
    if(!existing){
      const late=attendForm.attendance==='late'?(parseInt(attendForm.minutesLate)||0):0;
      const [h1,m1]=(attendForm.clockIn||'07:00').split(':').map(Number);
      const [h2,m2]=(attendForm.clockOut||'13:00').split(':').map(Number);
      const hrs=Math.max(0,((h2*60+m2)-(h1*60+m1))/60);
      dispatch({type:'ADD_CHECKLIST',payload:{
        id:'cl'+Date.now(),assignmentId:attendModal.id,
        scheduledStart:attendModal.shiftStart,clockIn:attendForm.clockIn,clockOut:attendForm.clockOut,
        minutesLate:late,totalHours:Math.round(hrs*10)/10,attendance:attendForm.attendance,
        cases:[],skillLevels:{},dresscode:true,handwash:true,areaKnowledge:true,
        instruments:true,asepsis:true,participation:true,communication:true,hospitalRules:true,
        performance:0,comments:'',signed:false
      }});
    }
    toast('✅ Asistencia registrada — '+getStudent(attendModal.studentId)?.name);
    setAttendModal(null);
  };

  const submitEval=()=>{
    const existing=getChecklist(evalModal.id);
    const payload={performance:evalForm.performance,comments:evalForm.comments,
      dresscode:evalForm.dresscode,handwash:evalForm.handwash,areaKnowledge:evalForm.areaKnowledge,
      instruments:evalForm.instruments,asepsis:evalForm.asepsis,participation:evalForm.participation,
      communication:evalForm.communication,hospitalRules:evalForm.hospitalRules,
      signed:true,signedAt:new Date().toISOString()};
    if(existing){
      dispatch({type:'UPDATE_CHECKLIST',payload:{...existing,...payload}});
    } else {
      dispatch({type:'ADD_CHECKLIST',payload:{id:'cl'+Date.now(),assignmentId:evalModal.id,
        scheduledStart:evalModal.shiftStart,clockIn:evalModal.shiftStart,clockOut:evalModal.shiftEnd,
        minutesLate:0,totalHours:6,attendance:'attended',cases:[],skillLevels:{},...payload}});
      dispatch({type:'COMPLETE_ASSIGNMENT',payload:evalModal.id});
    }

const getAuthorName=(state,id)=>{
  const s=state.students.find(x=>x.id===id); if(s) return s.name;
  const d=state.doctors.find(x=>x.id===id); if(d) return d.name;
  const a=ADMIN_USERS.find(x=>x.id===id); if(a) return a.name;
  return 'Usuario';
};

const timeAgo=(iso)=>{
  const diff=Date.now()-new Date(iso).getTime();
  const mins=Math.floor(diff/60000);
  if(mins<1) return 'justo ahora';
  if(mins<60) return `hace ${mins} min`;
  const hrs=Math.floor(mins/60);
  if(hrs<24) return `hace ${hrs} h`;
  const days=Math.floor(hrs/24);
  return `hace ${days} d`;
};

  const threads=state.threads||[];
  const comments=state.comments||[];

  const visibleThreads=threads.filter(t=>isAdmin||!t.oculto);
  const sortedThreads=[...visibleThreads].sort((a,b)=>{
    if(a.fijado!==b.fijado) return a.fijado?-1:1;
    return new Date(b.createdAt)-new Date(a.createdAt);
  });

  const openThread=(id)=>{ setSelectedId(id); setSubView('detalle'); };

    if(!form.titulo.trim()){ toast('El título es obligatorio','error'); return; }
    const id='th'+Date.now();

      id, titulo:form.titulo.trim(), descripcion:form.descripcion.trim(),

              <div key={t.id} onClick={()=>openThread(t.id)} className="hover-card"
                style={{background:'white',borderRadius:12,padding:'16px 20px',boxShadow:'0 2px 8px rgba(26,58,92,0.09)',cursor:'pointer',border:t.oculto?'1.5px dashed #D1D5DB':'1px solid transparent',opacity:t.oculto?0.6:1,transition:'box-shadow 0.2s'}}>
                <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:6,flexWrap:'wrap'}}>
                  {t.fijado&&<Badge text="📌 Fijado" color="yellow"/>}
                  {t.oculto&&<Badge text="Oculto" color="gray"/>}
                  <span style={{fontWeight:700,fontSize:15,color:COLORS.primary}}>{t.titulo}</span>
                </div>
                <p style={{margin:'0 0 8px',fontSize:13,color:'#6B7280',overflow:'hidden',textOverflow:'ellipsis',display:'-webkit-box',WebkitLineClamp:2,WebkitBoxOrient:'vertical'}}>{t.descripcion}</p>
                <div style={{fontSize:12,color:'#9CA3AF',display:'flex',gap:12}}>
                  <span>{getAuthorName(state,t.autorId)}</span>
                  <span>{timeAgo(t.createdAt)}</span>
                  <span>💬 {commentCount}</span>
                </div>
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
};

function App() {
  const [user, setUser] = React.useState(null);
  const [view, setView] = React.useState('dashboard');
  const [collapsed, setCollapsed] = React.useState(false);
  const [toastMsg, setToastMsg] = React.useState(null);
  const [state, dispatch] = React.useReducer(reducer, initialState);

  const toast = (msg, type = 'success') => {
    setToastMsg({ msg, type });
  };

  const handleLogout = () => {
    setUser(null);
    setView('dashboard');
  };

  if (!user) return <LoginPage onLogin={setUser} users={ADMIN_USERS} />;

  const pageTitle = {
    dashboard: user.role === 'student' ? 'Mi Dashboard' : user.role === 'doctor' ? 'Supervisión Clínica' : 'Dashboard',
    comunidad: 'Comunidad',
    supervision: 'Supervisión Clínica',
    students: 'Gestión de Estudiantes',
    doctors: 'Gestión de Doctores',
    hospitals: 'Gestión de Hospitales',
    assignments: 'Asignaciones de Prácticas',
    calendar: 'Calendario',
    changes: 'Cambios de Día',
    checklist: 'Checklist de Prácticas',
    reports: 'Reportes',
    skills: 'Gestión de Destrezas',
    doc_alerts: 'Alertas Clínicas',
    coordinacion: 'Coordinación',
    botluz: 'Bot Luz',
    alerts: 'Alertas del Sistema',
    notifications: 'Notificaciones',
  }[view] || 'GPA Academy';

  const pendingChanges = state.dayChanges?.filter(dc => dc.status === 'pending')?.length || 0;

  return (
    <div style={{ display: 'flex', height: '100vh' }}>
      <Sidebar user={user} view={view} setView={setView} collapsed={collapsed} setCollapsed={setCollapsed} />
      <div style={{ flex: 1, display: 'flex', flexDirection: 'column' }}>
        <Header title={pageTitle} user={user} pendingChanges={pendingChanges} onLogout={handleLogout} />
        <div style={{ flex: 1, overflowY: 'auto', background: COLORS.bg }}>
          {view === 'dashboard' && user.role === 'student' && <StudentDashboardPage state={state} dispatch={dispatch} toast={toast} user={user} />}
          {view === 'dashboard' && user.role === 'doctor' && <DoctorDashboardPage state={state} dispatch={dispatch} toast={toast} user={user} setView={setView} />}
          {view === 'dashboard' && user.role === 'admin' && <div><p style={{padding:20}}>Bienvenido al Dashboard Administrativo</p></div>}
          {view === 'students' && user.role === 'admin' && <StudentsPage state={state} dispatch={dispatch} toast={toast} />}
          {view === 'comunidad' && <ComunidadPage state={state} dispatch={dispatch} toast={toast} user={user} />}
          {view !== 'dashboard' && view !== 'students' && view !== 'comunidad' && <div style={{padding:20,color:'#9CA3AF'}}><p>Sección de {pageTitle} - Próximamente</p></div>}
        </div>
      </div>
      <div style={{ position: 'fixed', bottom: 0, right: 0, zIndex: 1000 }}>
        {toastMsg&&<Toast msg={toastMsg.msg} type={toastMsg.type} onClose={()=>setToastMsg(null)}/>}
      </div>
    </div>
  );
};

const reducer = (state, action) => {
  switch (action.type) {
    case 'COMPLETE_ASSIGNMENT':
      return {
        ...state,
        assignments: state.assignments.map(a => a.id === action.payload ? { ...a, status: 'completed' } : a),
      };
    case 'ADD_CHECKLIST':
      return {
        ...state,
        checklists: [...state.checklists, action.payload],
      };
    case 'UPDATE_CHECKLIST':
      return {
        ...state,
        checklists: state.checklists.map(c => c.id === action.payload.id ? action.payload : c),
      };
    case 'MOVE_STUDENT_PROGRAM':
      return {
        ...state,
        students: state.students.map(s => s.id === action.payload.studentId
          ? { ...s, programId: action.payload.programId, cohort: action.payload.cohort }
          : s),
      };
    case 'ADD_THREAD':
      return {
        ...state,
        threads: [action.payload, ...state.threads],
      };
    case 'TOGGLE_PIN_THREAD':
      return {
        ...state,
        threads: state.threads.map(t => t.id === action.payload ? { ...t, fijado: !t.fijado, updatedAt: new Date().toISOString() } : t),
      };
    case 'TOGGLE_HIDE_THREAD':
      return {
        ...state,
        threads: state.threads.map(t => t.id === action.payload ? { ...t, oculto: !t.oculto, updatedAt: new Date().toISOString() } : t),
      };
    case 'DELETE_THREAD':
      return {
        ...state,
        threads: state.threads.filter(t => t.id !== action.payload),
        comments: state.comments.filter(c => c.hiloId !== action.payload),
      };
    case 'ADD_COMMENT':
      return {
        ...state,
        comments: [...state.comments, action.payload],
      };
    case 'TOGGLE_HIDE_COMMENT':
      return {
        ...state,
        comments: state.comments.map(c => c.id === action.payload ? { ...c, oculto: !c.oculto } : c),
      };
    case 'DELETE_COMMENT':
      return {
        ...state,
        comments: state.comments.filter(c => c.id !== action.payload),
      };
    default:
      return state;
  }
};

const initialState = { ...SAMPLE_DATA };

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script></body></html>
