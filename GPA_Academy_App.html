        <Modal title="Solicitar Cambio de Día" onClose={()=>setModal(false)}>
          {user.role==='admin'&&<Select label="Estudiante" value={form.studentId} onChange={v=>setForm({...form,studentId:v,originalAssignmentId:''})} required options={state.students.map(s=>({value:s.id,label:s.name}))}/>}
          <Select label="Práctica a cambiar" value={form.originalAssignmentId} onChange={v=>setForm({...form,originalAssignmentId:v})} required
            options={myAssignments.filter(a=>user.role==='admin'?!form.studentId||a.studentId===form.studentId:true).map(a=>{
              const ho=state.hospitals.find(h=>h.id===a.hospitalId);const st=state.students.find(s=>s.id===a.studentId);
              return{value:a.id,label:`${user.role==='admin'?st?.name+' – ':''}${a.date} ${a.shift} (${ho?.name})`};
            })}/>
          <Input label="Nueva fecha" value={form.newDate} onChange={v=>setForm({...form,newDate:v})} type="date" required/>
          <Select label="Tanda" value={form.newShift} onChange={v=>setForm({...form,newShift:v})} required options={[{value:'Mañana',label:'Mañana'},{value:'Tarde',label:'Tarde'}]}/>
          <div style={{marginBottom:16}}>
            <label style={{display:'block',fontWeight:600,fontSize:13,color:'#374151',marginBottom:4}}>Motivo</label>
            <textarea value={form.reason} onChange={e=>setForm({...form,reason:e.target.value})} style={{width:'100%',padding:'8px 12px',border:'1.5px solid #D1D5DB',borderRadius:8,fontSize:14,minHeight:70,resize:'vertical',boxSizing:'border-box'}}/>
          </div>
          <div style={{display:'flex',gap:10,justifyContent:'flex-end'}}>
            <Btn color="secondary" onClick={()=>setModal(false)}>Cancelar</Btn>
            <Btn onClick={submit}><Icon name="check" size={15}/>Enviar</Btn>
          </div>
        </Modal>
      )}
    </div>
  );
};


// ── CHECKLIST ─────────────────────────────────────────────────────────────────
const ChecklistPage=({state,dispatch,toast,user})=>{
  const [selected,setSelected]=React.useState(null); // {assignment, student, doctor, hospital, program}
  const [form,setForm]=React.useState({});

  const myAssignments=user.role==='doctor'
    ?state.assignments.filter(a=>a.doctorId===user.id)
    :state.assignments;

  // Group by doctor+date+shift
  const grouped={};
  myAssignments.forEach(a=>{
    const key=`${a.doctorId}_${a.date}_${a.shift}`;
    if(!grouped[key]) grouped[key]={doctorId:a.doctorId,date:a.date,shift:a.shift,students:[]};
    grouped[key].students.push(a);
  });

  const initChecklist=(a,prog)=>{
    const existing=state.checklists.find(c=>c.assignmentId===a.id);
    if(existing) return{...existing};
    const skillLevels={};
    (prog?.skills||[]).forEach(s=>skillLevels[s]=0);
    return{
      assignmentId:a.id,
      scheduledStart:a.shiftStart||'07:00',
      clockIn:a.shiftStart||'07:00',
      clockOut:a.shiftEnd||'13:00',
      minutesLate:0,totalHours:0,
      attendance:'attended',
      cases:[],
      skillLevels,
      dresscode:true,handwash:true,areaKnowledge:true,instruments:true,asepsis:true,participation:true,communication:true,hospitalRules:true,
      performance:8,comments:'',signed:false
    };
  };

  const selectGroup=g=>{
    setSelected(g);
    const init={};
    g.students.forEach(a=>{
      const prog=state.programs?.find(p=>p.id===a.programId);
      init[a.id]=initChecklist(a,prog);
    });
    setForm(init);
  };

  const calcTime=(clockIn,scheduledStart)=>{
    const toMin=t=>{const[h,m]=t.split(':').map(Number);return h*60+m;};
    return Math.max(0,toMin(clockIn)-toMin(scheduledStart));
  };
  const calcHours=(clockIn,clockOut)=>{
    const toMin=t=>{const[h,m]=t.split(':').map(Number);return h*60+m;};
    return Math.max(0,(toMin(clockOut)-toMin(clockIn))/60);
  };

  const updateTime=(aid,field,val)=>{
    const f={...form[aid],[field]:val};
    if(field==='clockIn'||field==='clockOut'||field==='scheduledStart'){
      f.minutesLate=calcTime(f.clockIn||'07:00',f.scheduledStart||'07:00');
      f.totalHours=parseFloat(calcHours(f.clockIn||'07:00',f.clockOut||'13:00').toFixed(2));
    }
    setForm({...form,[aid]:f});
  };

  const addCase=(aid,prog)=>{
    const f=form[aid];
    const cases=[...(f.cases||[]),{type:prog?.caseTypes?.[0]||'',count:1,role:'observó',notes:''}];
    setForm({...form,[aid]:{...f,cases}});
  };
  const removeCase=(aid,idx)=>{
    const f=form[aid];
    const cases=f.cases.filter((_,i)=>i!==idx);
    setForm({...form,[aid]:{...f,cases}});
  };
  const updateCase=(aid,idx,field,val)=>{
    const f=form[aid];
    const cases=f.cases.map((c,i)=>i===idx?{...c,[field]:field==='count'?Math.max(1,parseInt(val)||1):val}:c);
    setForm({...form,[aid]:{...f,cases}});
  };

  const ROLES=['observó','participó','realizó','dominó'];
  const ROLE_COLORS={observó:'#3B82F6',participó:'#F59E0B',realizó:'#F97316',dominó:'#16A34A'};

  const COMP=[
    ['dresscode','👔 Vestimenta'],['handwash','🧼 Lavado de manos'],['areaKnowledge','📍 Conocimiento del área'],
    ['instruments','🔧 Manejo instrumental'],['asepsis','🧤 Asepsia'],['participation','✋ Participación activa'],
    ['communication','💬 Comunicación'],['hospitalRules','📋 Normas hospitalarias'],
  ];

  const saveChecklist=()=>{
    Object.values(form).forEach(cl=>{
      const totalH=parseFloat(calcHours(cl.clockIn||'07:00',cl.clockOut||'13:00').toFixed(2));
      const payload={...cl,totalHours:totalH,signed:true,signedAt:new Date().toISOString()};
      const existing=state.checklists.find(c=>c.assignmentId===cl.assignmentId);
      if(existing) dispatch({type:'UPDATE_CHECKLIST',payload:{...existing,...payload}});
      else dispatch({type:'ADD_CHECKLIST',payload:{...payload,id:'cl'+Date.now()+Math.random()}});
      dispatch({type:'COMPLETE_ASSIGNMENT',payload:cl.assignmentId});
    });
    toast('✅ Checklist guardado y firmado');setSelected(null);
  };

  if(selected){
    const dr=state.doctors.find(d=>d.id===selected.doctorId);
    const ho=state.hospitals.find(h=>h.id===selected.students[0]?.hospitalId);
    return(
      <div style={{padding:28}}>
        <div style={{display:'flex',alignItems:'center',gap:14,marginBottom:20}}>
          <button onClick={()=>setSelected(null)} style={{padding:'6px 14px',border:'1.5px solid #D1D5DB',borderRadius:8,background:'white',cursor:'pointer',fontSize:13}}>← Volver</button>
          <div>
            <h3 style={{margin:0,color:COLORS.primary}}>{dr?.name}</h3>
            <span style={{fontSize:13,color:'#6B7280'}}>{ho?.name} · {selected.date} · Tanda {selected.shift}</span>
          </div>
        </div>

        {selected.students.map(a=>{
          const st=state.students.find(s=>s.id===a.studentId);
          const prog=state.programs?.find(p=>p.id===a.programId);
          const f=form[a.id]||{};
          const lateMin=f.minutesLate||0;
          const hrs=f.totalHours||0;
          const totalCases=(f.cases||[]).reduce((s,c)=>s+c.count,0);

          return(
            <Card key={a.id} style={{marginBottom:20}}>
              {/* Student header */}
              <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:16,paddingBottom:14,borderBottom:'2px solid #F3F4F6'}}>
                <div>
                  <h4 style={{margin:0,color:COLORS.primary,fontSize:17}}>{st?.name}</h4>
                  <div style={{fontSize:12,color:'#9CA3AF',marginTop:2}}>{st?.code} · {prog?.name}</div>
                </div>
                <div style={{display:'flex',gap:8}}>
                  <div style={{textAlign:'center',padding:'6px 14px',background:COLORS.light,borderRadius:8}}>
                    <div style={{fontSize:18,fontWeight:800,color:COLORS.accent}}>{totalCases}</div>
                    <div style={{fontSize:11,color:'#6B7280'}}>casos hoy</div>
                  </div>
                  <div style={{textAlign:'center',padding:'6px 14px',background:lateMin>0?'#FEF3C7':COLORS.light,borderRadius:8}}>
                    <div style={{fontSize:18,fontWeight:800,color:lateMin>0?COLORS.warning:COLORS.success}}>{hrs.toFixed(1)}h</div>
                    <div style={{fontSize:11,color:'#6B7280'}}>horas</div>
                  </div>
                </div>
              </div>

              {/* ASISTENCIA */}
              <div style={{marginBottom:18}}>
                <div style={{fontWeight:700,fontSize:14,color:'#374151',marginBottom:8}}>Asistencia</div>
                <div style={{display:'flex',gap:8,flexWrap:'wrap'}}>
                  {[['attended','✅ Asistió','#1D6B3B'],['late','⏰ Llegó tarde','#D97706'],['absent','❌ No asistió','#DC2626'],['excused','📄 Excusado','#6B7280']].map(([val,label,c])=>(
                    <button key={val} onClick={()=>setForm({...form,[a.id]:{...f,attendance:val}})}
                      style={{padding:'7px 16px',borderRadius:8,border:`2px solid ${f.attendance===val?c:'#D1D5DB'}`,background:f.attendance===val?c:'white',color:f.attendance===val?'white':'#374151',fontWeight:600,fontSize:13,cursor:'pointer'}}>
                      {label}
                    </button>
                  ))}
                </div>
              </div>

              {/* CONTROL DE HORARIO */}
              <div style={{marginBottom:18,padding:'14px 16px',background:'#F8FAFC',borderRadius:10,border:'1.5px solid #E5E7EB'}}>
                <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:12}}>
                  <Icon name="clock" size={17} color={COLORS.accent}/>
                  <span style={{fontWeight:700,fontSize:14,color:COLORS.primary}}>Control de Horario</span>
                  {lateMin>0&&<span style={{background:'#FEF3C7',color:'#92400E',borderRadius:6,padding:'2px 10px',fontSize:12,fontWeight:600}}>⚠ {lateMin} min tarde</span>}
                </div>
                <div style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:12}}>
                  <div>
                    <label style={{display:'block',fontSize:12,fontWeight:600,color:'#6B7280',marginBottom:4}}>Hora programada</label>
                    <input type="time" value={f.scheduledStart||'07:00'} onChange={e=>updateTime(a.id,'scheduledStart',e.target.value)}
                      style={{width:'100%',padding:'7px 10px',border:'1.5px solid #D1D5DB',borderRadius:8,fontSize:14}}/>
                  </div>
                  <div>
                    <label style={{display:'block',fontSize:12,fontWeight:600,color:'#6B7280',marginBottom:4}}>Entrada (clock-in)</label>
                    <input type="time" value={f.clockIn||'07:00'} onChange={e=>updateTime(a.id,'clockIn',e.target.value)}
                      style={{width:'100%',padding:'7px 10px',border:`1.5px solid ${lateMin>0?'#F59E0B':'#D1D5DB'}`,borderRadius:8,fontSize:14,background:lateMin>0?'#FFFBEB':'white'}}/>
                  </div>
                  <div>
                    <label style={{display:'block',fontSize:12,fontWeight:600,color:'#6B7280',marginBottom:4}}>Salida (clock-out)</label>
                    <input type="time" value={f.clockOut||'13:00'} onChange={e=>updateTime(a.id,'clockOut',e.target.value)}
                      style={{width:'100%',padding:'7px 10px',border:'1.5px solid #D1D5DB',borderRadius:8,fontSize:14}}/>
                  </div>
                </div>
                <div style={{marginTop:10,fontSize:12,color:'#6B7280'}}>
                  Total horas: <strong style={{color:COLORS.accent}}>{hrs.toFixed(2)}h</strong>
                  {prog&&<span> · Requeridas: <strong>{prog.requiredHours}h</strong></span>}
                  {f.minutesLate>0&&<span style={{color:COLORS.danger}}> · Tardanza: <strong>{f.minutesLate} min</strong></span>}
                </div>
              </div>

              {/* REGISTRO DE CASOS */}
              <div style={{marginBottom:18}}>
                <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:10}}>
                  <div style={{fontWeight:700,fontSize:14,color:'#374151'}}>
                    Casos Registrados
                    {prog&&<span style={{fontSize:12,color:'#6B7280',fontWeight:400,marginLeft:8}}>· objetivo del programa: {prog.requiredCases} casos</span>}
                  </div>
                  <Btn size="sm" onClick={()=>addCase(a.id,prog)}><Icon name="plus" size={13}/>Agregar caso</Btn>
                </div>
                {(f.cases||[]).length===0&&(
                  <div style={{padding:'14px',background:'#F9FAFB',borderRadius:8,textAlign:'center',color:'#9CA3AF',fontSize:13,border:'1.5px dashed #E5E7EB'}}>
                    Sin casos registrados — haz clic en "Agregar caso"
                  </div>
                )}
                {(f.cases||[]).map((cas,idx)=>(
                  <div key={idx} style={{display:'grid',gridTemplateColumns:'2fr auto 1fr auto',gap:8,alignItems:'center',marginBottom:8,padding:'10px 12px',background:'#F8FAFC',borderRadius:8,border:'1.5px solid #E5E7EB'}}>
                    <select value={cas.type} onChange={e=>updateCase(a.id,idx,'type',e.target.value)}
                      style={{padding:'6px 8px',border:'1.5px solid #D1D5DB',borderRadius:6,fontSize:13,background:'white'}}>
                      {(prog?.caseTypes||['Otro']).map(ct=><option key={ct} value={ct}>{ct}</option>)}
                    </select>
                    <div style={{display:'flex',alignItems:'center',gap:4}}>
                      <label style={{fontSize:11,color:'#6B7280',whiteSpace:'nowrap'}}>x</label>
                      <input type="number" min="1" value={cas.count} onChange={e=>updateCase(a.id,idx,'count',e.target.value)}
                        style={{width:55,padding:'6px 8px',border:'1.5px solid #D1D5DB',borderRadius:6,fontSize:13,textAlign:'center'}}/>
                    </div>
                    <div style={{display:'flex',gap:4}}>
                      {ROLES.map(r=>(
                        <button key={r} onClick={()=>updateCase(a.id,idx,'role',r)}
                          style={{flex:1,padding:'4px 2px',borderRadius:5,border:`1.5px solid ${cas.role===r?ROLE_COLORS[r]:'#D1D5DB'}`,background:cas.role===r?ROLE_COLORS[r]:'white',color:cas.role===r?'white':'#6B7280',fontSize:10,fontWeight:600,cursor:'pointer',textTransform:'capitalize'}}>
                          {r.charAt(0).toUpperCase()+r.slice(1,3)}
                        </button>
                      ))}
                    </div>
                    <button onClick={()=>removeCase(a.id,idx)} style={{background:'none',border:'none',cursor:'pointer',color:'#EF4444',padding:4}}><Icon name="trash" size={15} color="#EF4444"/></button>
                  </div>
                ))}
                {(f.cases||[]).length>0&&(
                  <div style={{fontSize:12,color:'#6B7280',marginTop:6}}>
                    Total: <strong style={{color:COLORS.accent}}>{(f.cases||[]).reduce((s,c)=>s+c.count,0)} casos</strong>
                    {' · '}Por rol: {ROLES.map(r=>{const n=(f.cases||[]).filter(c=>c.role===r).reduce((s,c)=>s+c.count,0);return n>0?<span key={r} style={{color:ROLE_COLORS[r],fontWeight:600,marginRight:8}}>{r}: {n}</span>:null;})}
                  </div>
                )}
              </div>

              {/* NIVELES DE DESTREZA */}
              {prog&&prog.skills&&prog.skills.length>0&&(
                <div style={{marginBottom:18}}>
                  <div style={{fontWeight:700,fontSize:14,color:'#374151',marginBottom:10}}>
                    Evaluación de Destrezas
                    <span style={{fontSize:12,color:'#6B7280',fontWeight:400,marginLeft:8}}>0=No iniciada · 1=Observó · 2=Participó · 3=Realizó · 4=Dominó</span>
                  </div>
                  <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(260px,1fr))',gap:8}}>
                    {prog.skills.map(skill=>{
                      const lvl=(f.skillLevels||{})[skill]||0;
                      return(
                        <div key={skill} style={{padding:'10px 12px',borderRadius:8,border:`1.5px solid ${SKILL_COLORS[lvl]}40`,background:`${SKILL_COLORS[lvl]}08`}}>
                          <div style={{fontSize:12,fontWeight:600,color:'#374151',marginBottom:7,lineHeight:1.3}}>{skill}</div>
                          <div style={{display:'flex',gap:3}}>
                            {[0,1,2,3,4].map(l=>(
                              <button key={l} onClick={()=>{
                                const sl={...(f.skillLevels||{}),[skill]:l};
                                setForm({...form,[a.id]:{...f,skillLevels:sl}});
                              }} style={{flex:1,padding:'4px 2px',borderRadius:5,border:`1.5px solid ${lvl===l?SKILL_COLORS[l]:'#E5E7EB'}`,background:lvl===l?SKILL_COLORS[l]:'white',color:lvl===l?'white':'#9CA3AF',fontSize:11,fontWeight:700,cursor:'pointer'}}>
                                {l}
                              </button>
                            ))}
                          </div>
                          <div style={{fontSize:10,color:SKILL_COLORS[lvl],marginTop:4,fontWeight:600}}>{SKILL_LABELS[lvl]}</div>
                        </div>
                      );
                    })}
                  </div>
                </div>
              )}

              {/* COMPETENCIAS CONDUCTUALES */}
              <div style={{marginBottom:16}}>
                <div style={{fontWeight:700,fontSize:14,color:'#374151',marginBottom:10}}>Competencias Conductuales</div>
                <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(210px,1fr))',gap:8}}>
                  {COMP.map(([key,label])=>(
                    <label key={key} style={{display:'flex',alignItems:'center',gap:8,padding:'8px 12px',borderRadius:8,border:`1.5px solid ${f[key]?'#6EE7B7':'#E5E7EB'}`,background:f[key]?'#F0FDF4':'white',cursor:'pointer'}}>
                      <input type="checkbox" checked={!!f[key]} onChange={e=>setForm({...form,[a.id]:{...f,[key]:e.target.checked}})} style={{width:15,height:15}}/>
                      <span style={{fontSize:13,fontWeight:500,color:f[key]?COLORS.success:'#374151'}}>{label}</span>
                    </label>
                  ))}
                </div>
              </div>

              {/* CALIFICACIÓN + COMENTARIOS */}
              <div style={{display:'grid',gridTemplateColumns:'180px 1fr',gap:16}}>
                <div>
                  <label style={{fontWeight:700,fontSize:13,color:'#374151',display:'block',marginBottom:6}}>Calificación (1-10)</label>
                  <div style={{display:'flex',alignItems:'center',gap:10}}>
                    <input type="range" min={1} max={10} value={f.performance||8} onChange={e=>setForm({...form,[a.id]:{...f,performance:Number(e.target.value)}})} style={{flex:1}}/>
                    <span style={{fontSize:26,fontWeight:800,color:COLORS.accent,minWidth:32}}>{f.performance||8}</span>
                  </div>
                </div>
                <div>
                  <label style={{fontWeight:700,fontSize:13,color:'#374151',display:'block',marginBottom:6}}>Comentarios del Doctor</label>
                  <textarea value={f.comments||''} onChange={e=>setForm({...form,[a.id]:{...f,comments:e.target.value}})} placeholder="Observaciones sobre el desempeño..."
                    style={{width:'100%',padding:'8px 12px',border:'1.5px solid #D1D5DB',borderRadius:8,fontSize:13,minHeight:60,resize:'vertical',boxSizing:'border-box'}}/>
                </div>
              </div>
            </Card>
          );
        })}
        <div style={{display:'flex',justifyContent:'flex-end',gap:12,marginTop:8}}>
          <Btn color="secondary" onClick={()=>setSelected(null)}>Cancelar</Btn>
          <Btn color="success" onClick={saveChecklist} style={{fontSize:15,padding:'10px 28px'}}><Icon name="check" size={16}/>Guardar y Firmar</Btn>
        </div>
      </div>
    );
  }

  return(
    <div style={{padding:28}}>
      <p style={{color:'#6B7280',fontSize:14,marginBottom:20}}>Selecciona un grupo de práctica para registrar asistencia, casos y destrezas.</p>
      <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(320px,1fr))',gap:16}}>
        {Object.values(grouped).sort((a,b)=>b.date.localeCompare(a.date)).map((g,i)=>{
          const dr=state.doctors.find(d=>d.id===g.doctorId);
          const ho=state.hospitals.find(h=>h.id===g.students[0]?.hospitalId);
          const done=g.students.filter(a=>state.checklists.find(c=>c.assignmentId===a.id&&c.signed)).length;
          const totalCases=g.students.reduce((sum,a)=>{const cl=state.checklists.find(c=>c.assignmentId===a.id);return sum+(cl?.cases||[]).reduce((s,c)=>s+c.count,0);},0);
          const prog=state.programs?.find(p=>p.id===g.students[0]?.programId);
          return(
            <div key={i} onClick={()=>selectGroup(g)} style={{cursor:'pointer'}}>
              <Card style={{borderLeft:`4px solid ${done===g.students.length&&done>0?COLORS.success:COLORS.accent}`,transition:'box-shadow 0.2s',':hover':{boxShadow:'0 4px 16px rgba(26,58,92,0.15)'}}}>
                <div style={{fontWeight:700,fontSize:15,color:COLORS.primary,marginBottom:4}}>{dr?.name}</div>
                <div style={{fontSize:13,color:'#6B7280',marginBottom:4}}>{ho?.name} · {g.date} · {g.shift}</div>
                {prog&&<div style={{fontSize:12,color:COLORS.accent,marginBottom:8}}>{prog.name}</div>}
                <div style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
                  <span style={{fontSize:12,color:'#374151'}}>{g.students.length} estudiante(s) · {totalCases} casos</span>
                  <Badge text={done===g.students.length&&done>0?`✓ Completo (${done}/${g.students.length})`:`Pendiente (${done}/${g.students.length})`} color={done===g.students.length&&done>0?'green':'yellow'}/>
                </div>
              </Card>
            </div>
          );
        })}
      </div>
      {Object.keys(grouped).length===0&&<Card><p style={{textAlign:'center',color:'#9CA3AF'}}>No hay grupos de práctica disponibles.</p></Card>}
    </div>
  );
};

// ── REPORTS ───────────────────────────────────────────────────────────────────
const ReportsPage=({state})=>{
  const [selSt,setSelSt]=React.useState('');
  const st=state.students.find(s=>s.id===selSt);
  const prog=st?state.programs?.find(p=>p.id===st.programId):null;
  const stAssign=st?state.assignments.filter(a=>a.studentId===st.id):[];
  const stChecklists=stAssign.map(a=>state.checklists.find(c=>c.assignmentId===a.id)).filter(Boolean);

  // Case totals
  const caseTotals={};
  stChecklists.forEach(cl=>(cl.cases||[]).forEach(c=>{caseTotals[c.type]=(caseTotals[c.type]||0)+c.count;}));
  const totalCases=Object.values(caseTotals).reduce((s,n)=>s+n,0);

  // Hours
  const totalHours=stChecklists.reduce((s,cl)=>s+(cl.totalHours||0),0);

  // Skill matrix — highest level per skill
  const skillMatrix={};
  stChecklists.forEach(cl=>{Object.entries(cl.skillLevels||{}).forEach(([sk,lv])=>{skillMatrix[sk]=Math.max(skillMatrix[sk]||0,lv);});});

  // Attendance
  const attRate=stChecklists.length===0?0:Math.round(stChecklists.filter(c=>c.attendance==='attended').length/stChecklists.length*100);
  const avgScore=stChecklists.length===0?'—':(stChecklists.reduce((s,c)=>s+(c.performance||0),0)/stChecklists.length).toFixed(1);

  // Cert readiness
  const casesOk=prog?totalCases>=prog.requiredCases:false;
  const hoursOk=prog?totalHours>=prog.requiredHours:false;
  const dominated=Object.values(skillMatrix).filter(v=>v>=3).length;
  const totalSkills=prog?.skills?.length||0;
  const skillsOk=totalSkills>0&&dominated/totalSkills>=0.7;
  const certReady=casesOk&&hoursOk&&skillsOk;

  return(
    <div style={{padding:28}}>
      {/* General overview */}
      <div style={{display:'flex',gap:16,flexWrap:'wrap',marginBottom:24}}>
        <StatCard label="Total Estudiantes" value={state.students.length} icon="students" color={COLORS.accent}/>
        <StatCard label="Prácticas Completadas" value={state.assignments.filter(a=>a.status==='completed').length} icon="checklist" color={COLORS.success}/>
        <StatCard label="Total Casos" value={state.checklists.reduce((s,c)=>(c.cases||[]).reduce((ss,ca)=>ss+ca.count,0)+s,0)} icon="reports" color="#059669"/>
        <StatCard label="Horas de Práctica" value={state.checklists.reduce((s,c)=>s+(c.totalHours||0),0).toFixed(1)+'h'} icon="clock" color="#7C3AED"/>
      </div>

      {/* Student selector */}
      <Card style={{marginBottom:20}}>
        <h3 style={{margin:'0 0 16px',color:COLORS.primary,fontSize:16,fontWeight:700}}>Reporte Individual por Estudiante</h3>
        <Select label="Seleccionar Estudiante" value={selSt} onChange={setSelSt} options={state.students.map(s=>({value:s.id,label:`${s.code} - ${s.name}`}))}/>

        {st&&prog&&(
          <>
            {/* Cert readiness banner */}
            <div style={{padding:'12px 16px',borderRadius:10,background:certReady?'#D1FAE5':'#FEF3C7',border:`1.5px solid ${certReady?'#6EE7B7':'#F59E0B'}`,marginBottom:20,display:'flex',alignItems:'center',gap:12}}>
              <span style={{fontSize:22}}>{certReady?'🎓':'📊'}</span>
              <div>
                <div style={{fontWeight:700,color:certReady?COLORS.success:COLORS.warning,fontSize:15}}>
                  {certReady?'✅ Listo para certificación':'En progreso hacia certificación'}
                </div>
                <div style={{fontSize:12,color:'#6B7280',marginTop:2}}>
                  Casos {casesOk?'✓':'✗'} · Horas {hoursOk?'✓':'✗'} · Destrezas {skillsOk?'✓':'✗'} (70% en nivel Realizó o superior)
                </div>
              </div>
            </div>

            {/* KPIs */}
            <div style={{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:12,marginBottom:20}}>
              {[['Asistencia',`${attRate}%`,attRate>=80?COLORS.success:COLORS.warning],['Promedio',avgScore,COLORS.accent],['Prácticas',stAssign.length,'#7C3AED'],['Tardanzas',stChecklists.filter(c=>c.minutesLate>0).length,COLORS.warning]].map(([l,v,c])=>(
                <div key={l} style={{textAlign:'center',padding:'12px 8px',background:COLORS.light,borderRadius:10}}>
                  <div style={{fontSize:26,fontWeight:800,color:c}}>{v}</div>
                  <div style={{fontSize:12,color:'#6B7280',marginTop:2}}>{l}</div>
                </div>
              ))}
            </div>

            {/* Progress bars */}
            <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:16,marginBottom:20}}>
              <div style={{padding:'14px 16px',background:'#F8FAFC',borderRadius:10,border:'1.5px solid #E5E7EB'}}>
                <div style={{fontWeight:700,fontSize:14,color:COLORS.primary,marginBottom:10}}>📋 Casos: {totalCases} / {prog.requiredCases}</div>
                <ProgressBar value={totalCases} max={prog.requiredCases}/>
                <div style={{marginTop:10}}>
                  {Object.entries(caseTotals).map(([tipo,n])=>(
                    <div key={tipo} style={{display:'flex',justifyContent:'space-between',fontSize:12,padding:'3px 0',color:'#374151'}}>
                      <span>{tipo}</span><span style={{fontWeight:600,color:COLORS.accent}}>{n}</span>
                    </div>
                  ))}
                </div>
              </div>
              <div style={{padding:'14px 16px',background:'#F8FAFC',borderRadius:10,border:'1.5px solid #E5E7EB'}}>
                <div style={{fontWeight:700,fontSize:14,color:COLORS.primary,marginBottom:10}}>⏱ Horas: {totalHours.toFixed(1)}h / {prog.requiredHours}h</div>
                <ProgressBar value={totalHours} max={prog.requiredHours}/>
                <div style={{marginTop:10}}>
                  {stChecklists.filter(c=>c.totalHours).map((c,i)=>{
                    const a=stAssign.find(as=>as.id===c.assignmentId);
                    return<div key={i} style={{display:'flex',justifyContent:'space-between',fontSize:12,padding:'3px 0',color:'#374151'}}>
                      <span>{a?.date||'—'}</span>
                      <span style={{fontWeight:600,color:c.minutesLate>0?COLORS.warning:COLORS.accent}}>{c.totalHours}h{c.minutesLate>0?` (${c.minutesLate}min tarde)`:''}</span>
                    </div>;
                  })}
                </div>
              </div>
            </div>

            {/* Skill matrix */}
            {prog.skills&&prog.skills.length>0&&(
              <div>
                <div style={{fontWeight:700,fontSize:14,color:COLORS.primary,marginBottom:12}}>🧠 Mapa de Destrezas Adquiridas</div>
                <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(220px,1fr))',gap:8}}>
                  {prog.skills.map(skill=>{
                    const lvl=skillMatrix[skill]||0;
                    const history=stChecklists.map(c=>(c.skillLevels||{})[skill]||0);
                    return(
                      <div key={skill} style={{padding:'10px 14px',borderRadius:8,border:`1.5px solid ${SKILL_COLORS[lvl]}60`,background:`${SKILL_COLORS[lvl]}10`}}>
                        <div style={{fontWeight:600,fontSize:12,marginBottom:6,color:'#1F2937'}}>{skill}</div>
                        <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:4}}>
                          <div style={{height:8,flex:1,background:'#E5E7EB',borderRadius:999}}>
                            <div style={{height:'100%',width:`${lvl*25}%`,background:SKILL_COLORS[lvl],borderRadius:999}}/>
                          </div>
                          <span style={{fontSize:12,fontWeight:700,color:SKILL_COLORS[lvl],minWidth:24}}>{lvl}/4</span>
                        </div>
                        <div style={{fontSize:11,color:SKILL_COLORS[lvl],fontWeight:600}}>{SKILL_LABELS[lvl]}</div>
                        {history.length>1&&<div style={{fontSize:10,color:'#9CA3AF',marginTop:4}}>Progresión: {history.join(' → ')}</div>}
                      </div>
                    );
                  })}
                </div>
              </div>
            )}
          </>
        )}
      </Card>
    </div>
  );
};

// ── SKILLS PAGE ───────────────────────────────────────────────────────────────
const SkillsPage=({state})=>{
  const [selSt,setSelSt]=React.useState('');
  const [selProg,setSelProg]=React.useState('');

  const studentsInProg=selProg?state.students.filter(s=>s.programId===selProg):state.students;
  const prog=state.programs?.find(p=>p.id===selProg)||(selSt?state.programs?.find(p=>p.id===state.students.find(s=>s.id===selSt)?.programId):null);

  const getSkillMatrix=(studentId)=>{
    const assigns=state.assignments.filter(a=>a.studentId===studentId);
    const matrix={};
    assigns.forEach(a=>{
      const cl=state.checklists.find(c=>c.assignmentId===a.id);
      if(cl) Object.entries(cl.skillLevels||{}).forEach(([sk,lv])=>{matrix[sk]=Math.max(matrix[sk]||0,lv);});
    });
    return matrix;
  };

  const getSkillHistory=(studentId,skill)=>{
    return state.assignments
      .filter(a=>a.studentId===studentId)
      .sort((a,b)=>a.date.localeCompare(b.date))
      .map(a=>{const cl=state.checklists.find(c=>c.assignmentId===a.id);return cl?(cl.skillLevels||{})[skill]||0:null;})
      .filter(v=>v!==null);
  };

  const displayStudents=selSt?state.students.filter(s=>s.id===selSt):studentsInProg;

  return(
    <div style={{padding:28}}>
      <div style={{display:'flex',gap:12,marginBottom:24,flexWrap:'wrap'}}>
        <div style={{flex:1,minWidth:200}}>
          <Select label="Filtrar por Programa" value={selProg} onChange={v=>{setSelProg(v);setSelSt('');}} options={(state.programs||[]).map(p=>({value:p.id,label:p.name}))}/>
        </div>
        <div style={{flex:1,minWidth:200}}>
          <Select label="Ver Estudiante Específico" value={selSt} onChange={setSelSt} options={studentsInProg.map(s=>({value:s.id,label:`${s.code} - ${s.name}`}))}/>
        </div>
      </div>

      {/* Summary across all students */}
      {!selSt&&(
        <Card style={{marginBottom:20}}>
          <h3 style={{margin:'0 0 16px',color:COLORS.primary,fontSize:16,fontWeight:700}}>Resumen de Destrezas del Grupo</h3>
          {prog?.skills&&(
            <div style={{overflowX:'auto'}}>
              <table style={{width:'100%',borderCollapse:'collapse',fontSize:13}}>
                <thead>
                  <tr style={{background:COLORS.primary}}>
                    <th style={{padding:'10px 12px',color:'white',textAlign:'left',minWidth:180}}>Destreza</th>
                    {displayStudents.map(s=><th key={s.id} style={{padding:'10px 8px',color:'white',textAlign:'center',minWidth:80,fontSize:11}}>{s.name.split(' ')[0]}</th>)}
                    <th style={{padding:'10px 8px',color:'white',textAlign:'center',minWidth:60}}>Prom.</th>
                  </tr>
                </thead>
                <tbody>
                  {prog.skills.map((skill,si)=>(
                    <tr key={skill} style={{background:si%2===0?'white':'#F8FAFC',borderBottom:'1px solid #E5E7EB'}}>
                      <td style={{padding:'8px 12px',fontWeight:600,fontSize:12}}>{skill}</td>
                      {displayStudents.map(s=>{
                        const matrix=getSkillMatrix(s.id);
                        const lvl=matrix[skill]||0;
                        return<td key={s.id} style={{padding:'8px 6px',textAlign:'center'}}>
                          <span style={{display:'inline-block',width:28,height:28,borderRadius:'50%',background:SKILL_COLORS[lvl],color:'white',fontSize:12,fontWeight:700,lineHeight:'28px'}}>{lvl}</span>
                        </td>;
                      })}
                      <td style={{padding:'8px 6px',textAlign:'center'}}>
                        {(()=>{const avg=displayStudents.reduce((s,st)=>{const m=getSkillMatrix(st.id);return s+(m[skill]||0);},0)/Math.max(displayStudents.length,1);const avgR=Math.round(avg*10)/10;return<span style={{fontWeight:700,color:SKILL_COLORS[Math.round(avg)]||'#9CA3AF'}}>{avgR}</span>;})()}
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>
              <div style={{display:'flex',gap:12,marginTop:12,flexWrap:'wrap'}}>
                {SKILL_LABELS.map((l,i)=><span key={i} style={{display:'flex',alignItems:'center',gap:5,fontSize:12}}><span style={{width:16,height:16,borderRadius:'50%',background:SKILL_COLORS[i],display:'inline-block'}}/>{i}: {l}</span>)}
              </div>
            </div>
          )}
          {!prog&&<p style={{color:'#9CA3AF',fontSize:14}}>Selecciona un programa para ver el mapa de destrezas.</p>}
        </Card>
      )}

      {/* Per-student detail */}
      {displayStudents.map(st=>{
        const stProg=state.programs?.find(p=>p.id===st.programId);
        if(!stProg) return null;
        const matrix=getSkillMatrix(st.id);
        const dominated=Object.values(matrix).filter(v=>v>=4).length;
        const realized=Object.values(matrix).filter(v=>v===3).length;
        const inProgress=Object.values(matrix).filter(v=>v>=1&&v<=2).length;
        const none=stProg.skills.filter(sk=>!matrix[sk]||matrix[sk]===0).length;
        return(
          <Card key={st.id} style={{marginBottom:16}}>
            <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:16}}>
              <div>
                <h4 style={{margin:0,color:COLORS.primary,fontSize:16}}>{st.name} <span style={{fontWeight:400,color:'#9CA3AF',fontSize:13}}>({st.code})</span></h4>
                <div style={{fontSize:13,color:COLORS.accent,marginTop:2}}>{stProg.name}</div>
              </div>
              <div style={{display:'flex',gap:8}}>
                {dominated>0&&<Badge text={`${dominated} Dominadas`} color="green"/>}
                {realized>0&&<Badge text={`${realized} Realizadas`} color="orange"/>}
                {inProgress>0&&<Badge text={`${inProgress} En progreso`} color="yellow"/>}
                {none>0&&<Badge text={`${none} Sin iniciar`} color="gray"/>}
              </div>
            </div>
            <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(200px,1fr))',gap:6}}>
              {stProg.skills.map(skill=>{
                const lvl=matrix[skill]||0;
                const hist=getSkillHistory(st.id,skill);
                const trend=hist.length>=2?(hist[hist.length-1]>hist[hist.length-2]?'↑':hist[hist.length-1]<hist[hist.length-2]?'↓':'→'):'—';
                return(
                  <div key={skill} style={{padding:'8px 12px',borderRadius:8,border:`1.5px solid ${SKILL_COLORS[lvl]}50`,background:`${SKILL_COLORS[lvl]}0A`,display:'flex',alignItems:'center',gap:10}}>
                    <div style={{width:34,height:34,borderRadius:'50%',background:SKILL_COLORS[lvl],display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}>
                      <span style={{color:'white',fontWeight:800,fontSize:15}}>{lvl}</span>
                    </div>
                    <div style={{flex:1,minWidth:0}}>
                      <div style={{fontSize:11,fontWeight:600,color:'#1F2937',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{skill}</div>
                      <div style={{fontSize:10,color:SKILL_COLORS[lvl],fontWeight:600}}>{SKILL_LABELS[lvl]} {hist.length>=2&&<span style={{color:'#9CA3AF'}}>{trend}</span>}</div>
                    </div>
                  </div>
                );
              })}
            </div>
          </Card>
        );
      })}

      {displayStudents.length===0&&(
        <Card><p style={{textAlign:'center',color:'#9CA3AF',padding:20}}>Selecciona un programa o estudiante para ver las destrezas.</p></Card>
      )}
    </div>
  );
};

// ── ALERTS ────────────────────────────────────────────────────────────────────
const AlertsPage=({state})=>{
  const alerts=[
    ...state.assignments.filter(a=>a.status==='scheduled'&&!a.notified).map(a=>{
      const st=state.students.find(s=>s.id===a.studentId);const ho=state.hospitals.find(h=>h.id===a.hospitalId);
      return{type:'warning',msg:`Notificación pendiente: ${st?.name} – ${a.date} en ${ho?.name}`,icon:'bell'};
    }),
    ...state.assignments.filter(a=>a.status==='completed'&&!state.checklists.find(c=>c.assignmentId===a.id)).map(a=>{
      const st=state.students.find(s=>s.id===a.studentId);
      return{type:'danger',msg:`Práctica completada sin checklist: ${st?.name} – ${a.date}`,icon:'checklist'};
    }),
    ...state.dayChanges.filter(d=>d.status==='pending').map(d=>{
      const st=state.students.find(s=>s.id===d.studentId);
      return{type:'warning',msg:`Cambio de día pendiente: ${st?.name} → ${d.newDate}`,icon:'changes'};
    }),
    ...state.checklists.filter(c=>c.attendance==='absent').map(c=>{
      const a=state.assignments.find(as=>as.id===c.assignmentId);const st=a?state.students.find(s=>s.id===a.studentId):null;
      return{type:'danger',msg:`Ausencia registrada: ${st?.name} – ${a?.date}`,icon:'alerts'};
    }),
    ...state.students.filter(s=>s.paymentStatus==='atrasado').map(s=>(
      {type:'danger',msg:`Pago atrasado: ${s.name} (${s.code})`,icon:'students'}
    )),
  ];
  const BG={warning:'#FEF3C7',danger:'#FEE2E2',info:'#DBEAFE'};
  const TC={warning:'#92400E',danger:'#991B1B',info:'#1E40AF'};
  return(
    <div style={{padding:28}}>
      <div style={{marginBottom:16,color:'#6B7280',fontSize:14}}>{alerts.length} alerta(s) activa(s)</div>
      {alerts.length===0&&<Card><p style={{textAlign:'center',color:'#9CA3AF',padding:20}}>✅ Sin alertas pendientes. Todo en orden.</p></Card>}
      {alerts.map((a,i)=>(
        <div key={i} style={{display:'flex',alignItems:'flex-start',gap:12,padding:'14px 18px',background:BG[a.type],borderRadius:12,marginBottom:10}}>
          <Icon name={a.icon} size={20} color={TC[a.type]}/><span style={{fontSize:14,color:TC[a.type],fontWeight:500}}>{a.msg}</span>
        </div>
      ))}
    </div>
  );
};

// ── NOTIFICATIONS ─────────────────────────────────────────────────────────────
const NotificationsPage=({state})=>{

// ── SUPERVISION CLÍNICA (Doctor) ──────────────────────────────────────────────
const SupervisionPage=({state,dispatch,toast,user,setView})=>{
  const [search,setSearch]=React.useState('');
  const [filterStatus,setFilterStatus]=React.useState('');
  const [filterHospital,setFilterHospital]=React.useState('');
  const [filterDate,setFilterDate]=React.useState('');
  const [evalModal,setEvalModal]=React.useState(null);
  const [evalForm,setEvalForm]=React.useState({});
  const [newModal,setNewModal]=React.useState(false);
  const [pForm,setPForm]=React.useState({studentId:'',hospitalId:'',areaId:'',date:'',shiftStart:'07:00',shiftEnd:'13:00',shift:'Mañana',programId:'',notes:''});

  const myA=state.assignments.filter(a=>a.doctorId===user.id);
  let disp=myA;
  if(search){const q=search.toLowerCase();disp=disp.filter(a=>{const s=state.students.find(s=>s.id===a.studentId);return s?.name.toLowerCase().includes(q);});}
  if(filterStatus) disp=disp.filter(a=>a.status===filterStatus);
  if(filterHospital) disp=disp.filter(a=>a.hospitalId===filterHospital);
  if(filterDate) disp=disp.filter(a=>a.date===filterDate);
  disp=disp.sort((a,b)=>b.date.localeCompare(a.date));

  const gSt=id=>state.students.find(s=>s.id===id);
  const gHo=id=>state.hospitals.find(h=>h.id===id);
  const gArea=(hId,aId)=>{const h=state.hospitals.find(h=>h.id===hId);return h?.areas?.find(a=>a.id===aId);};
  const gCl=aId=>state.checklists.find(c=>c.assignmentId===aId);

  const calcFinal=f=>{
    const vals=[f.punctuality,f.presentation,f.areaKnowledge,f.instrumentHandling,f.teamCommunication,f.professionalAttitude,f.caseParticipation,f.biosafety].filter(v=>v!==undefined);
    return vals.length?Math.round(vals.reduce((s,v)=>s+parseFloat(v||0),0)/vals.length*10)/10:0;
  };

  const openEval=a=>{
    const ec=gCl(a.id);
    setEvalModal(a);
    setEvalForm({
      punctuality:ec?.evalCriteria?.punctuality??7,presentation:ec?.evalCriteria?.presentation??7,
      areaKnowledge:ec?.evalCriteria?.areaKnowledge??7,instrumentHandling:ec?.evalCriteria?.instrumentHandling??7,
      teamCommunication:ec?.evalCriteria?.teamCommunication??7,professionalAttitude:ec?.evalCriteria?.professionalAttitude??7,
      caseParticipation:ec?.evalCriteria?.caseParticipation??7,biosafety:ec?.evalCriteria?.biosafety??7,
      comments:ec?.comments||'',autoCalc:true,performance:ec?.performance||0,
    });
  };

  const submitEval=()=>{
    const existing=gCl(evalModal.id);
    const final=evalForm.autoCalc?calcFinal(evalForm):evalForm.performance;
    const ec={punctuality:evalForm.punctuality,presentation:evalForm.presentation,areaKnowledge:evalForm.areaKnowledge,instrumentHandling:evalForm.instrumentHandling,teamCommunication:evalForm.teamCommunication,professionalAttitude:evalForm.professionalAttitude,caseParticipation:evalForm.caseParticipation,biosafety:evalForm.biosafety};
    if(existing){
      dispatch({type:'UPDATE_CHECKLIST',payload:{...existing,evalCriteria:ec,performance:final,comments:evalForm.comments,signed:true,signedAt:new Date().toISOString()}});
    } else {
      dispatch({type:'ADD_CHECKLIST',payload:{id:'cl'+Date.now(),assignmentId:evalModal.id,scheduledStart:evalModal.shiftStart,clockIn:evalModal.shiftStart,clockOut:evalModal.shiftEnd,minutesLate:0,totalHours:6,attendance:'attended',cases:[],skillLevels:{},dresscode:true,handwash:true,areaKnowledge:true,instruments:true,asepsis:true,participation:true,communication:true,hospitalRules:true,evalCriteria:ec,performance:final,comments:evalForm.comments,signed:true,signedAt:new Date().toISOString()}});
      dispatch({type:'COMPLETE_ASSIGNMENT',payload:evalModal.id});
    }
    toast('✅ Evaluación registrada y firmada');setEvalModal(null);
  };

  const addPractice=()=>{
    if(!pForm.studentId||!pForm.hospitalId||!pForm.date){toast('Estudiante, hospital y fecha son obligatorios','error');return;}
    dispatch({type:'ADD_ASSIGNMENT',payload:{id:'as'+Date.now(),doctorId:user.id,...pForm,status:'scheduled',token:'tok'+Date.now(),notified:false}});
    toast('✅ Práctica programada');setNewModal(false);setPForm({studentId:'',hospitalId:'',areaId:'',date:'',shiftStart:'07:00',shiftEnd:'13:00',shift:'Mañana',programId:'',notes:''});
  };

  const quickAttend=(a)=>{
    const [h1,m1]=a.shiftStart.split(':').map(Number);
    const [h2,m2]=a.shiftEnd.split(':').map(Number);
    const hrs=Math.max(0,((h2*60+m2)-(h1*60+m1))/60);
    dispatch({type:'COMPLETE_ASSIGNMENT',payload:a.id});
    if(!gCl(a.id)) dispatch({type:'ADD_CHECKLIST',payload:{id:'cl'+Date.now(),assignmentId:a.id,scheduledStart:a.shiftStart,clockIn:a.shiftStart,clockOut:a.shiftEnd,minutesLate:0,totalHours:Math.round(hrs*10)/10,attendance:'attended',cases:[],skillLevels:{},dresscode:true,handwash:true,areaKnowledge:true,instruments:true,asepsis:true,participation:true,communication:true,hospitalRules:true,performance:0,comments:'',signed:false}});
    toast('✅ Asistencia registrada — '+gSt(a.studentId)?.name);
  };

  const EVAL_CRITERIA=[['punctuality','⏰ Puntualidad'],['presentation','👔 Presentación personal'],['areaKnowledge','🏥 Conocimiento del área quirúrgica'],['instrumentHandling','🔧 Manejo del instrumental'],['teamCommunication','💬 Comunicación con el equipo'],['professionalAttitude','🤝 Actitud profesional'],['caseParticipation','🔬 Participación en casos'],['biosafety','🧪 Normas de bioseguridad']];
  const sL={scheduled:'Programada',completed:'Completada',cancelled:'Cancelada'};
  const sC={scheduled:'blue',completed:'green',cancelled:'red'};
  const aL={attended:'✅ Asistió',late:'⏰ Tardanza',absent:'❌ Ausente',justified:'📄 Justificado'};

  return(
    <div style={{padding:28}}>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:20,flexWrap:'wrap',gap:12}}>
        <h2 style={{margin:0,color:COLORS.primary,fontSize:20,fontWeight:700}}>🏥 Supervisión Clínica</h2>
        <Btn onClick={()=>setNewModal(true)}><Icon name="plus" size={16}/>Nueva Práctica</Btn>
      </div>

      {/* Filtros */}
      <Card style={{marginBottom:20,padding:'14px 18px'}}>
        <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(160px,1fr))',gap:10,alignItems:'center'}}>
          <div style={{position:'relative'}}>
            <div style={{position:'absolute',left:9,top:'50%',transform:'translateY(-50%)'}}><Icon name="search" size={13} color="#9CA3AF"/></div>
            <input placeholder="Buscar estudiante..." value={search} onChange={e=>setSearch(e.target.value)}
              style={{paddingLeft:30,padding:'8px 10px 8px 30px',border:'1.5px solid #D1D5DB',borderRadius:8,fontSize:12,width:'100%',boxSizing:'border-box'}}/>
          </div>
          <select value={filterStatus} onChange={e=>setFilterStatus(e.target.value)} style={{padding:'8px 10px',border:'1.5px solid #D1D5DB',borderRadius:8,fontSize:12,background:'white'}}>
            <option value="">Todos los estados</option>
            <option value="scheduled">Programadas</option>
            <option value="completed">Completadas</option>
            <option value="cancelled">Canceladas</option>
          </select>
          <select value={filterHospital} onChange={e=>setFilterHospital(e.target.value)} style={{padding:'8px 10px',border:'1.5px solid #D1D5DB',borderRadius:8,fontSize:12,background:'white'}}>
            <option value="">Todos los hospitales</option>
            {state.hospitals.map(h=><option key={h.id} value={h.id}>{h.name}</option>)}
          </select>
          <input type="date" value={filterDate} onChange={e=>setFilterDate(e.target.value)} style={{padding:'8px 10px',border:'1.5px solid #D1D5DB',borderRadius:8,fontSize:12}}/>
          {(search||filterStatus||filterHospital||filterDate)&&(
            <button onClick={()=>{setSearch('');setFilterStatus('');setFilterHospital('');setFilterDate('');}}
              style={{padding:'8px 10px',background:'#FEF2F2',color:'#DC2626',border:'1.5px solid #FECACA',borderRadius:8,fontSize:11,fontWeight:600,cursor:'pointer'}}>✕ Limpiar</button>
          )}
        </div>
        <div style={{marginTop:8,fontSize:12,color:'#9CA3AF'}}>{disp.length} práctica(s) encontrada(s)</div>
      </Card>

      {/* Lista */}
      {disp.length===0?(
        <Card><div style={{textAlign:'center',padding:'40px 0',color:'#9CA3AF'}}>
          <div style={{fontSize:44,marginBottom:10}}>📋</div>
          <div style={{fontWeight:500,fontSize:14}}>No hay prácticas que coincidan.</div>
          <button onClick={()=>setNewModal(true)} style={{marginTop:10,padding:'8px 16px',background:COLORS.accent,color:'white',border:'none',borderRadius:8,fontSize:12,fontWeight:600,cursor:'pointer'}}>+ Programar práctica</button>
        </div></Card>
      ):(
        <div style={{display:'flex',flexDirection:'column',gap:12}}>
          {disp.map(a=>{
            const st=gSt(a.studentId);const ho=gHo(a.hospitalId);const area=gArea(a.hospitalId,a.areaId);const cl=gCl(a.id);
            const initials=(st?.name||'?').split(' ').slice(0,2).map(n=>n[0]).join('').toUpperCase();
            const perfColor=cl?.performance>0?(cl.performance>=9?'#059669':cl.performance>=7?COLORS.accent:'#D97706'):'#9CA3AF';
            return(
              <Card key={a.id} className="hover-card" style={{padding:'16px 20px'}}>
                <div style={{display:'flex',alignItems:'flex-start',gap:16,flexWrap:'wrap'}}>
                  <div style={{width:48,height:48,borderRadius:12,background:COLORS.light,display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}>
                    <span style={{fontWeight:800,fontSize:16,color:COLORS.accent}}>{initials}</span>
                  </div>
                  <div style={{flex:1,minWidth:180}}>
                    <div style={{display:'flex',alignItems:'center',gap:8,flexWrap:'wrap',marginBottom:4}}>
                      <span style={{fontWeight:700,fontSize:14,color:'#1F2937'}}>{st?.name||'—'}</span>
                      <Badge text={sL[a.status]||a.status} color={sC[a.status]||'gray'}/>
                      {cl&&<Badge text={aL[cl.attendance]||cl.attendance} color={cl.attendance==='attended'?'green':cl.attendance==='late'?'yellow':'red'}/>}
                      {cl?.signed&&<Badge text="✓ Evaluado" color="purple"/>}
                    </div>
                    <div style={{fontSize:12,color:'#6B7280'}}>📍 {ho?.name||'—'}{area?' · '+area.name:''}</div>
                    <div style={{fontSize:12,color:'#6B7280',marginTop:1}}>📅 {a.date} · 🕐 {a.shiftStart}–{a.shiftEnd}</div>
                    {cl&&(
                      <div style={{display:'flex',gap:12,marginTop:6,flexWrap:'wrap'}}>
                        <span style={{fontSize:11,color:'#9CA3AF'}}>⏱ {cl.totalHours||0}h clínicas</span>
                        {cl.performance>0&&<span style={{fontSize:11,fontWeight:700,color:perfColor}}>Nota: {cl.performance}/10</span>}
                        {cl.minutesLate>0&&<span style={{fontSize:11,color:COLORS.warning,fontWeight:600}}>{cl.minutesLate} min tarde</span>}
                      </div>
                    )}
                    {cl?.comments&&<div style={{fontSize:11,color:'#64748B',marginTop:4,fontStyle:'italic',maxWidth:400}}>"{cl.comments}"</div>}
                    {(cl?.cases||[]).length>0&&(
                      <div style={{marginTop:6,display:'flex',gap:5,flexWrap:'wrap'}}>
                        {cl.cases.map((c,i)=><span key={i} style={{fontSize:10,padding:'2px 8px',background:'#F0F9FF',color:'#0369A1',border:'1px solid #BAE6FD',borderRadius:999,fontWeight:600}}>{c.type} ×{c.count}</span>)}
                      </div>
                    )}
                  </div>
                  <div style={{display:'flex',gap:6,flexWrap:'wrap',flexShrink:0,alignItems:'flex-start'}}>
                    {a.status==='scheduled'&&!cl&&(
                      <Btn size="sm" color="success" onClick={()=>quickAttend(a)}>✅ Asistencia</Btn>
                    )}
                    <Btn size="sm" color="secondary" onClick={()=>openEval(a)}>{cl?.signed?'✎ Editar eval.':'📋 Evaluar'}</Btn>
                    {a.status==='scheduled'&&(
                      <Btn size="sm" color="danger" onClick={()=>{if(confirm('¿Cancelar esta práctica?')){dispatch({type:'CANCEL_ASSIGNMENT',payload:a.id});toast('Práctica cancelada','info');}}}><Icon name="x" size={13}/></Btn>
                    )}
                  </div>
                </div>
              </Card>
            );
          })}
        </div>
      )}

      {/* Modal: Nueva Práctica */}
      {newModal&&(
        <Modal title="📅 Programar Nueva Práctica" onClose={()=>setNewModal(false)} width={520}>
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:12}}>
            <div style={{gridColumn:'span 2'}}>
              <Select label="Estudiante *" value={pForm.studentId} onChange={v=>setPForm({...pForm,studentId:v})} required
                options={state.students.filter(s=>s.status==='active').map(s=>({value:s.id,label:s.name+' ('+s.code+')'}))}/>
            </div>
            <Input label="Fecha *" value={pForm.date} onChange={v=>setPForm({...pForm,date:v})} type="date" required/>
            <Select label="Turno" value={pForm.shift} onChange={v=>setPForm({...pForm,shift:v})} options={[{value:'Mañana',label:'Mañana'},{value:'Tarde',label:'Tarde'},{value:'Noche',label:'Noche'}]}/>
            <Input label="Hora inicio" value={pForm.shiftStart} onChange={v=>setPForm({...pForm,shiftStart:v})} type="time"/>
            <Input label="Hora fin" value={pForm.shiftEnd} onChange={v=>setPForm({...pForm,shiftEnd:v})} type="time"/>
            <div style={{gridColumn:'span 2'}}>
              <Select label="Hospital *" value={pForm.hospitalId} onChange={v=>setPForm({...pForm,hospitalId:v,areaId:''})} required options={state.hospitals.map(h=>({value:h.id,label:h.name}))}/>
            </div>
            {pForm.hospitalId&&(
              <div style={{gridColumn:'span 2'}}>
                <Select label="Área quirúrgica" value={pForm.areaId} onChange={v=>setPForm({...pForm,areaId:v})}
                  options={(state.hospitals.find(h=>h.id===pForm.hospitalId)?.areas||[]).map(a=>({value:a.id,label:a.name}))}/>
              </div>
            )}
            <div style={{gridColumn:'span 2'}}>
              <Select label="Programa" value={pForm.programId} onChange={v=>setPForm({...pForm,programId:v})}
                options={(state.programs||[]).map(p=>({value:p.id,label:p.name}))}/>
            </div>
          </div>
          <div style={{display:'flex',gap:10,marginTop:8}}>
            <Btn color="secondary" onClick={()=>setNewModal(false)} style={{flex:1}}>Cancelar</Btn>
            <Btn color="primary" onClick={addPractice} style={{flex:1}}>Programar Práctica</Btn>
          </div>
        </Modal>
      )}

      {/* Modal: Evaluación Completa */}
      {evalModal&&(
        <Modal title={'📋 Evaluación — '+gSt(evalModal.studentId)?.name} onClose={()=>setEvalModal(null)} width={580}>
          <div style={{padding:'10px 14px',background:'#F8FAFC',borderRadius:10,marginBottom:16,fontSize:12,color:'#64748B'}}>
            📍 {gHo(evalModal.hospitalId)?.name} · 📅 {evalModal.date} · 🕐 {evalModal.shiftStart}–{evalModal.shiftEnd}
          </div>
          <div style={{marginBottom:16}}>
            <div style={{fontWeight:700,fontSize:13,color:'#374151',marginBottom:10}}>Criterios de Evaluación (0–10)</div>
            <div style={{display:'flex',flexDirection:'column',gap:8}}>
              {EVAL_CRITERIA.map(([key,label])=>(
                <div key={key} style={{display:'flex',alignItems:'center',gap:12,padding:'8px 12px',background:'#F8FAFC',borderRadius:8}}>
                  <span style={{fontSize:12,color:'#374151',flex:1}}>{label}</span>
                  <input type="range" min="0" max="10" step="0.5" value={evalForm[key]??7}
                    onChange={e=>{const v=parseFloat(e.target.value);const nf={...evalForm,[key]:v};if(nf.autoCalc)nf.performance=calcFinal(nf);setEvalForm(nf);}}
                    style={{width:110,accentColor:COLORS.accent}}/>
                  <span style={{fontWeight:800,fontSize:14,color:COLORS.accent,minWidth:28,textAlign:'right'}}>{evalForm[key]??7}</span>
                </div>
              ))}
            </div>
          </div>
          <div style={{padding:'12px 16px',background:'#F0F9FF',borderRadius:12,border:'1.5px solid #BAE6FD',marginBottom:16,display:'flex',alignItems:'center',gap:16}}>
            <div style={{flex:1}}>
              <div style={{fontWeight:700,fontSize:13,color:COLORS.primary,marginBottom:6}}>Calificación Final</div>
              {!evalForm.autoCalc&&<input type="range" min="0" max="10" step="0.5" value={evalForm.performance} onChange={e=>setEvalForm({...evalForm,performance:parseFloat(e.target.value)})} style={{width:'100%',accentColor:COLORS.accent}}/>}
              <label style={{display:'flex',alignItems:'center',gap:6,marginTop:6,fontSize:12,color:'#64748B',cursor:'pointer'}}>
                <input type="checkbox" checked={!!evalForm.autoCalc} onChange={e=>{const ac=e.target.checked;setEvalForm({...evalForm,autoCalc:ac,performance:ac?calcFinal(evalForm):evalForm.performance});}}/>
                Calcular automáticamente desde criterios
              </label>
            </div>
            <div style={{fontWeight:900,fontSize:38,color:(evalForm.autoCalc?calcFinal(evalForm):evalForm.performance)>=9?'#059669':(evalForm.autoCalc?calcFinal(evalForm):evalForm.performance)>=7?COLORS.accent:'#D97706',lineHeight:1,minWidth:56,textAlign:'center'}}>
              {evalForm.autoCalc?calcFinal(evalForm):evalForm.performance}
            </div>
          </div>
          <div style={{marginBottom:16}}>
            <label style={{display:'block',fontWeight:700,fontSize:13,color:'#374151',marginBottom:6}}>Observaciones Clínicas</label>
            <textarea value={evalForm.comments||''} onChange={e=>setEvalForm({...evalForm,comments:e.target.value})}
              placeholder="Describe el desempeño clínico, fortalezas y áreas de mejora..."
              style={{width:'100%',padding:'10px 12px',border:'1.5px solid #D1D5DB',borderRadius:8,fontSize:13,outline:'none',boxSizing:'border-box',minHeight:80,resize:'vertical',fontFamily:'inherit'}}/>
          </div>
          <div style={{display:'flex',gap:10}}>
            <Btn color="secondary" onClick={()=>setEvalModal(null)} style={{flex:1}}>Cancelar</Btn>
            <Btn color="success" onClick={submitEval} style={{flex:2}}>✅ Firmar y Guardar Evaluación</Btn>
          </div>
        </Modal>
      )}
    </div>
  );
};

// ── COORDINACIÓN (Doctor) ──────────────────────────────────────────────────────

    toast('✅ Nota guardada');setShowForm(false);setForm({title:'',content:'',type:'nota',priority:'normal'});
  };
  const del=n=>{if(confirm(`¿Eliminar "${n.title}"?`)){dispatch({type:'DEL_NOTE',payload:n.id});toast('Nota eliminada','info');}};
  const tC={nota:'blue',observacion:'purple',alerta:'red',solicitud:'yellow'};
  const pC={normal:'gray',alta:'orange',urgente:'red'};
  return(
    <div style={{padding:28}}>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:20}}>

        <Btn onClick={()=>setShowForm(!showForm)}><Icon name="plus" size={16}/>Nueva Nota</Btn>
      </div>

  const [filterType,setFilterType]=React.useState('');

  const del=a=>{if(confirm('¿Eliminar esta alerta?')){dispatch({type:'DEL_ALERT',payload:a.id});toast('Eliminada','info');}};

        <Card style={{marginBottom:20,border:'2px solid #FDE68A'}}>
          <h3 style={{margin:'0 0 16px',color:COLORS.primary,fontSize:15,fontWeight:700}}>⚠️ Registrar Nueva Alerta</h3>

            <div style={{gridColumn:'span 2'}}>
              <Select label="Estudiante *" value={form.studentId} onChange={v=>setForm({...form,studentId:v})} required options={myStudents.map(s=>({value:s.id,label:s.name}))}/>
            </div>
            <Select label="Tipo de alerta" value={form.alertType} onChange={v=>setForm({...form,alertType:v})} options={ALERT_TYPES}/>
            <Select label="Prioridad" value={form.priority} onChange={v=>setForm({...form,priority:v})} options={[{value:'baja',label:'🟢 Baja'},{value:'media',label:'🟡 Media'},{value:'alta',label:'🔴 Alta'}]}/>

            <div style={{gridColumn:'span 2'}}>
              <label style={{display:'block',fontWeight:600,fontSize:13,color:'#374151',marginBottom:6}}>Descripción *</label>
              <textarea value={form.description} onChange={e=>setForm({...form,description:e.target.value})} placeholder="Describe el incidente o situación..."

            <div style={{fontSize:22,flexShrink:0,marginTop:2}}>{ALT_LABEL[a.alertType]?.split(' ')[0]||'⚠️'}</div>
            <div style={{flex:1,minWidth:0}}>
              <div style={{display:'flex',gap:8,flexWrap:'wrap',marginBottom:4,alignItems:'center'}}>
                <span style={{fontWeight:700,fontSize:13,color:res?'#9CA3AF':'#1F2937'}}>{st?.name||'—'}</span>
                <Badge text={ALT_LABEL[a.alertType]?.split(' ').slice(1).join(' ')||a.alertType} color={res?'gray':'yellow'}/>
                <Badge text={p.label} color={p.color}/>{res&&<Badge text="✓ Resuelta" color="green"/>}
              </div>
              <div style={{fontSize:12,color:res?'#9CA3AF':'#4B5563',marginBottom:2}}>{a.description}</div>
              <div style={{fontSize:11,color:'#9CA3AF'}}>📅 {a.date}</div>
            </div>
            <div style={{display:'flex',gap:6,flexShrink:0}}>
              {!res&&<button onClick={()=>resolve(a)} style={{padding:'5px 10px',background:'#ECFDF5',color:'#059669',border:'1.5px solid #6EE7B7',borderRadius:7,fontSize:11,fontWeight:700,cursor:'pointer'}}>✓ Resolver</button>}
              <button onClick={()=>del(a)} style={{padding:'5px 8px',background:'#FEF2F2',color:'#DC2626',border:'1.5px solid #FECACA',borderRadius:7,fontSize:11,cursor:'pointer'}}><Icon name="trash" size={13} color="#DC2626"/></button>
            </div>
          </div>
        );
      })}
    </div>
  );
};

const reducer=(state,action)=>{
  switch(action.type){
    case 'ADD_STUDENT':    return{...state,students:[...state.students,action.payload]};
    case 'EDIT_STUDENT':   return{...state,students:state.students.map(s=>s.id===action.payload.id?action.payload:s)};
    case 'DEL_STUDENT':    return{...state,students:state.students.filter(s=>s.id!==action.payload)};
    case 'ADD_DOCTOR':     return{...state,doctors:[...state.doctors,action.payload]};
    case 'EDIT_DOCTOR':    return{...state,doctors:state.doctors.map(d=>d.id===action.payload.id?action.payload:d)};
    case 'DEL_DOCTOR':     return{...state,doctors:state.doctors.filter(d=>d.id!==action.payload)};
    case 'ADD_HOSPITAL':   return{...state,hospitals:[...state.hospitals,action.payload]};
    case 'EDIT_HOSPITAL':  return{...state,hospitals:state.hospitals.map(h=>h.id===action.payload.id?action.payload:h)};
    case 'DEL_HOSPITAL':   return{...state,hospitals:state.hospitals.filter(h=>h.id!==action.payload)};
    case 'ADD_ASSIGNMENT': return{...state,assignments:[...state.assignments,action.payload]};
    case 'CANCEL_ASSIGNMENT':return{...state,assignments:state.assignments.map(a=>a.id===action.payload?{...a,status:'cancelled'}:a)};
    case 'COMPLETE_ASSIGNMENT':return{...state,assignments:state.assignments.map(a=>a.id===action.payload?{...a,status:'completed'}:a)};
    case 'NOTIFY_ASSIGNMENT':return{...state,assignments:state.assignments.map(a=>a.id===action.payload?{...a,notified:true}:a)};
    case 'ADD_CHECKLIST':  return{...state,checklists:[...state.checklists,action.payload]};
    case 'UPDATE_CHECKLIST':return{...state,checklists:state.checklists.map(c=>c.id===action.payload.id?action.payload:c)};
    case 'ADD_DAY_CHANGE': return{...state,dayChanges:[...state.dayChanges,action.payload]};
    case 'APPROVE_CHANGE': return{...state,dayChanges:state.dayChanges.map(d=>d.id===action.payload?{...d,status:'approved',reviewedAt:new Date().toISOString()}:d)};
    case 'REJECT_CHANGE':  return{...state,dayChanges:state.dayChanges.map(d=>d.id===action.payload.id?{...d,status:'rejected',reviewedAt:new Date().toISOString(),rejectionReason:action.payload.reason}:d)};
    case 'ADD_NOTIFICATION':return{...state,notifications:[...state.notifications,action.payload]};
    case 'ADD_LEAD':    return{...state,leads:[...(state.leads||[]),action.payload]};
    case 'EDIT_LEAD':   return{...state,leads:(state.leads||[]).map(l=>l.id===action.payload.id?action.payload:l)};
    case 'DEL_LEAD':    return{...state,leads:(state.leads||[]).filter(l=>l.id!==action.payload)};
    case 'ADD_ALERT':    return{...state,clinicalAlerts:[...(state.clinicalAlerts||[]),action.payload]};
    case 'RESOLVE_ALERT':return{...state,clinicalAlerts:(state.clinicalAlerts||[]).map(a=>a.id===action.payload?{...a,status:'resolved',resolvedAt:new Date().toISOString()}:a)};
    case 'DEL_ALERT':    return{...state,clinicalAlerts:(state.clinicalAlerts||[]).filter(a=>a.id!==action.payload)};
    case 'ADD_NOTE':     return{...state,coordinationNotes:[...(state.coordinationNotes||[]),action.payload]};
    case 'DEL_NOTE':     return{...state,coordinationNotes:(state.coordinationNotes||[]).filter(n=>n.id!==action.payload)};
    case 'LOAD_STATE':   return action.payload;
    case 'RESET_STATE':  return action.payload;
    default: return state;
  }
};

const PAGE_TITLES={
  dashboard:'Dashboard',supervision:'Supervisión Clínica',
  students:'Gestión de Estudiantes',doctors:'Cirujanos Supervisores',
  hospitals:'Hospitales y Quirófanos',assignments:'Asignaciones Quirúrgicas',calendar:'Calendario Quirúrgico',
  changes:'Cambios de Turno',checklist:'Checklist Quirúrgico',reports:'Reportes Académicos',
  skills:'Destrezas Adquiridas',doc_alerts:'Alertas Clínicas',coordinacion:'Notas de Coordinación',
  alerts:'Alertas del Sistema',notifications:'Centro de Notificaciones',
};

const LS_KEY='gpa_academy_state_v2';

const App=()=>{
  const [user,setUser]=React.useState(null);
  const [view,setView]=React.useState('dashboard');
  const [collapsed,setCollapsed]=React.useState(false);
  const [toastMsg,setToastMsg]=React.useState(null);
  const toast=(msg,type='success')=>setToastMsg({msg,type});

  // Load initial state from localStorage or use SAMPLE_DATA
  const initState=()=>{
    try{
      const s=localStorage.getItem(LS_KEY);
      if(!s)return SAMPLE_DATA;
      const parsed=JSON.parse(s);
      // Validate that the parsed data has the expected structure
      if(!parsed||typeof parsed!=='object'||!Array.isArray(parsed.students))return SAMPLE_DATA;
      // Merge: ensure new keys from SAMPLE_DATA exist (forward compatibility)
      return{...SAMPLE_DATA,...parsed};
    }catch(e){
      console.warn('Error cargando estado guardado, usando datos por defecto:',e);
      return SAMPLE_DATA;
    }
  };

  const [state,dispatch]=React.useReducer(reducer,null,initState);

  const [savedIndicator,setSavedIndicator]=React.useState(false);

  // Persist to localStorage on every state change
  React.useEffect(()=>{
    try{
      const serialized=JSON.stringify(state);
      localStorage.setItem(LS_KEY,serialized);
      setSavedIndicator(true);
      setTimeout(()=>setSavedIndicator(false),1800);
    }catch(e){console.warn('localStorage no disponible:',e);}
  },[state]);

  // Safety net: synchronous save before page close/refresh
  React.useEffect(()=>{
    const saveBeforeUnload=()=>{
      try{localStorage.setItem(LS_KEY,JSON.stringify(state));}catch{}
    };
    window.addEventListener('beforeunload',saveBeforeUnload);
    return()=>window.removeEventListener('beforeunload',saveBeforeUnload);
  },[state]);

  const pendingChanges=state.dayChanges.filter(d=>d.status==='pending').length;

  // Dynamic user list
  const allUsers=React.useMemo(()=>[
    ...ADMIN_USERS,
    ...state.doctors.filter(d=>d.username&&d.password).map(d=>({id:d.id,username:d.username,password:d.password,name:d.name,role:'doctor'})),
    ...state.students.filter(s=>s.username&&s.password).map(s=>({id:s.id,username:s.username,password:s.password,name:s.name,role:'student'})),
  ],[state.doctors,state.students]);

  if(!user) return <LoginPage onLogin={u=>{setUser(u);setView('dashboard');}} users={allUsers}/>;

  const props={state,dispatch,toast,user,setView};

  const renderPage=()=>{
    switch(view){
      case 'dashboard':    return <DashboardPage {...props}/>;
      case 'supervision':  return <SupervisionPage {...props}/>;
      case 'coordinacion': return <CoordinacionPage {...props}/>;
      case 'doc_alerts':   return <DoctorAlertsPage {...props}/>;
      case 'students':     return <StudentsPage {...props}/>;
      case 'doctors':      return <DoctorsPage {...props}/>;
      case 'hospitals':    return <HospitalsPage {...props}/>;
      case 'assignments':  return <AssignmentsPage {...props}/>;
      case 'calendar':     return <CalendarPage {...props}/>;
      case 'changes':      return <ChangesPage {...props}/>;
      case 'checklist':    return <ChecklistPage {...props}/>;
      case 'reports':      return <ReportsPage {...props}/>;
      case 'skills':       return <SkillsPage {...props}/>;
      case 'alerts':       return <AlertsPage {...props}/>;
      case 'notifications':return <NotificationsPage {...props}/>;
      default: return <div style={{padding:28}}><Card><p style={{textAlign:'center',color:'#9CA3AF'}}>Sección en construcción.</p></Card></div>;
    }
  };

  const handleLoadDemo=()=>{
    if(confirm('¿Cargar datos de ejemplo? Esto reemplazará los datos actuales.')){
      dispatch({type:'RESET_STATE',payload:SAMPLE_DATA});
      toast('✅ Datos de ejemplo cargados');
    }
  };
  const handleClearData=()=>{
    if(confirm('⚠️ ¿Limpiar TODOS los datos? Esta acción no se puede deshacer.')){
      const blank={...SAMPLE_DATA,students:[],assignments:[],checklists:[],clinicalAlerts:[],coordinationNotes:[],dayChanges:[],notifications:[],leads:[]};
      dispatch({type:'RESET_STATE',payload:blank});
      toast('🗑 Datos limpiados','info');
    }
  };

  const handleExportJSON=()=>{
    try{
      const data=JSON.stringify(state,null,2);
      const blob=new Blob([data],{type:'application/json'});
      const url=URL.createObjectURL(blob);
      const a=document.createElement('a');a.href=url;
      a.download='gpa_academy_datos_'+new Date().toISOString().slice(0,10)+'.json';
      a.click();URL.revokeObjectURL(url);
      toast('📦 Datos exportados — comparte el archivo .json con los profesores');
    }catch(e){toast('❌ Error al exportar','error');}
  };
  const handleImportJSON=()=>{
    const input=document.createElement('input');
    input.type='file';input.accept='.json,application/json';
    input.onchange=e=>{
      const file=e.target.files[0];if(!file)return;
      const reader=new FileReader();
      reader.onload=ev=>{
        try{
          const data=JSON.parse(ev.target.result);
          if(typeof data!=='object'||!data.students)throw new Error('Archivo JSON inválido o incompleto');
          if(confirm(\`¿Importar datos?
• \${data.students?.length||0} estudiantes
• \${data.assignments?.length||0} asignaciones

Esto reemplazará los datos actuales.\`)){
            dispatch({type:'LOAD_STATE',payload:data});
            toast('✅ Datos importados correctamente');
          }
        }catch(err){toast('❌ Error al importar: '+err.message,'error');}
      };
      reader.readAsText(file);
    };
    input.click();
  };

  const exportCSV=()=>{
    const myA=state.assignments.filter(a=>a.doctorId===user.id);
    const myStudentIds=[...new Set(myA.map(a=>a.studentId))];
    const rows=[['Estudiante','Código','Fecha','Hospital','Estado','Asistencia','Horas','Nota','Observaciones']];
    myA.forEach(a=>{
      const st=state.students.find(s=>s.id===a.studentId);
      const ho=state.hospitals.find(h=>h.id===a.hospitalId);
      const cl=state.checklists.find(c=>c.assignmentId===a.id);
      rows.push([st?.name||'',st?.code||'',a.date,ho?.name||'',a.status,cl?.attendance||'',cl?.totalHours||'',cl?.performance||'',cl?.comments||'']);
    });
    const csv=rows.map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n');
    const blob=new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8;'});
    const url=URL.createObjectURL(blob);
    const link=document.createElement('a');link.href=url;link.download='reporte_gpa_academy.csv';link.click();URL.revokeObjectURL(url);
    toast('📥 Reporte CSV descargado');
  };

  return(
    <div style={{display:'flex',minHeight:'100vh',background:'#F0F5FB',fontFamily:'Inter,-apple-system,BlinkMacSystemFont,sans-serif'}}>
      <Sidebar user={user} view={view} setView={v=>setView(v)} collapsed={collapsed} setCollapsed={setCollapsed}/>
      <div style={{flex:1,display:'flex',flexDirection:'column',minWidth:0,overflow:'hidden'}}>
        <Header title={PAGE_TITLES[view]||view} user={user} pendingChanges={pendingChanges} onLogout={()=>{setUser(null);setView('dashboard');}}/>
        {/* Barra de utilidades para admin/doctor */}
        {user.role!=='student'&&(
          <div style={{display:'flex',gap:8,padding:'6px 20px',background:'#F8FAFC',borderBottom:'1px solid #E5E7EB',justifyContent:'flex-end',flexWrap:'wrap',alignItems:'center'}}>
            {savedIndicator&&<span style={{fontSize:10,color:'#10B981',fontWeight:600,marginRight:4}}>✓ Guardado</span>}
            <button onClick={exportCSV} style={{padding:'4px 10px',background:'white',border:'1px solid #D1D5DB',borderRadius:6,fontSize:11,cursor:'pointer',color:'#374151',fontWeight:500}}>📥 CSV</button>
            <button onClick={handleExportJSON} title="Exporta todos los datos como JSON para compartir con profesores" style={{padding:'4px 10px',background:'#EFF6FF',border:'1px solid #BFDBFE',borderRadius:6,fontSize:11,cursor:'pointer',color:'#2563EB',fontWeight:600}}>📤 Exportar datos</button>
            <button onClick={handleImportJSON} title="Importa datos desde un archivo JSON exportado previamente" style={{padding:'4px 10px',background:'#F0FDF4',border:'1px solid #BBF7D0',borderRadius:6,fontSize:11,cursor:'pointer',color:'#16A34A',fontWeight:600}}>📥 Importar datos</button>
            <button onClick={handleLoadDemo} style={{padding:'4px 10px',background:'white',border:'1px solid #D1D5DB',borderRadius:6,fontSize:11,cursor:'pointer',color:'#374151',fontWeight:500}}>🔄 Demo</button>
            <button onClick={handleClearData} style={{padding:'4px 10px',background:'white',border:'1px solid #FECACA',borderRadius:6,fontSize:11,cursor:'pointer',color:'#DC2626',fontWeight:500}}>🗑 Limpiar</button>
          </div>
        )}
        <div style={{flex:1,overflowY:'auto'}}>{renderPage()}</div>
      </div>
      {toastMsg&&<Toast msg={toastMsg.msg} type={toastMsg.type} onClose={()=>setToastMsg(null)}/>}
    </div>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script></body></html>
