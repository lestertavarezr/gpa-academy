const Badge=({text,color='blue'})=>{
  const map={blue:'#DBEAFE:#1E40AF',green:'#D1FAE5:#065F46',red:'#FEE2E2:#991B1B',yellow:'#FEF3C7:#92400E',gray:'#F3F4F6:#374151',purple:'#EDE9FE:#5B21B6',orange:'#FFEDD5:#9A3412'};

const Btn=({children,onClick,color='primary',size='md',disabled=false,style={}})=>{
  const colors={primary:`background:${COLORS.accent};color:white`,secondary:'background:#F3F4F6;color:#374151',danger:`background:${COLORS.danger};color:white`,success:`background:${COLORS.success};color:white`,ghost:'background:transparent;color:#374151'};
  const sizes={sm:'padding:4px 12px;font-size:13px',md:'padding:8px 18px;font-size:14px',lg:'padding:12px 24px;font-size:16px'};
  const cs=Object.fromEntries([...colors[color].split(';'),...sizes[size].split(';')].map(s=>s.split(':')));
  return <button onClick={onClick} disabled={disabled} style={{...cs,border:'none',borderRadius:8,fontWeight:600,cursor:disabled?'not-allowed':'pointer',opacity:disabled?0.6:1,display:'inline-flex',alignItems:'center',gap:6,...style}}>{children}</button>;
};

const Toast=({msg,type='success',onClose})=>{
  const colors={success:'#D1FAE5',error:'#FEE2E2',info:'#DBEAFE',warning:'#FEF3C7'};
  React.useEffect(()=>{const t=setTimeout(onClose,3500);return()=>clearTimeout(t);},[]);
  return(
    <div style={{position:'fixed',bottom:24,right:24,zIndex:2000,background:colors[type]||colors.info,border:`1.5px solid ${type==='success'?'#6EE7B7':type==='error'?'#FCA5A5':'#93C5FD'}`,borderRadius:12,padding:'12px 20px',minWidth:260,boxShadow:'0 8px 24px rgba(0,0,0,0.15)',display:'flex',alignItems:'center',gap:10}}>

      <button onClick={onClose} style={{background:'none',border:'none',cursor:'pointer'}}><Icon name="x" size={16} color="#6B7280"/></button>
    </div>
  );
};

const ProgressBar=({value,max,color='#2E75B6',height=10,showLabel=true})=>{
  const pct=Math.min(100,Math.round((value/max)*100));
  return(
    <div>
      {showLabel&&<div style={{display:'flex',justifyContent:'space-between',fontSize:12,marginBottom:3,color:'#6B7280'}}>
        <span>{value} / {max}</span><span style={{fontWeight:700,color}}>{pct}%</span>

const StudentDashboardPage=({state,dispatch,toast,user})=>{
  const st=state.students.find(s=>s.id===user.id);
  const prog=state.programs?.find(p=>p.id===st?.programId);
  const myAssignments=state.assignments.filter(a=>a.studentId===user.id);
  const myChecklists=myAssignments.map(a=>state.checklists.find(c=>c.assignmentId===a.id)).filter(Boolean);

  // ── Computed metrics ──────────────────────────────────────────────────────
  const attended=myChecklists.filter(c=>c.attendance==='attended'||c.attendance==='late').length;
  const attendanceRate=myChecklists.length===0?0:Math.round(attended/myChecklists.length*100);
  const hoursFromChecklists=myChecklists.reduce((s,c)=>s+(c.totalHours||0),0);
  const totalHours=st?.completedHoursOverride!=null?st.completedHoursOverride:hoursFromChecklists;
  const requiredHours=st?.requiredHoursOverride||(prog?.requiredHours||40);
  const totalCases=myChecklists.reduce((s,c)=>s+(c.cases||[]).reduce((ss,ca)=>ss+ca.count,0),0);

  // ── Skills ────────────────────────────────────────────────────────────────
  const skillMatrix={};
  myChecklists.forEach(c=>Object.entries(c.skillLevels||{}).forEach(([sk,lv])=>{skillMatrix[sk]=Math.max(skillMatrix[sk]||0,lv);}));
  const totalSkills=prog?.skills?.length||0;
  const dominatedSkills=Object.values(skillMatrix).filter(v=>v>=3).length;
  const pendingSkills=totalSkills>0?prog.skills.filter(sk=>(skillMatrix[sk]||0)===0).length:0;

  // ── Grades ────────────────────────────────────────────────────────────────
  const grades=st?.grades&&st.grades.length>0
    ?st.grades
    :myChecklists.map((c,i)=>{const a=myAssignments.find(as=>as.id===c.assignmentId);return{subject:`Práctica ${i+1}`,grade:c.performance||0,date:a?.date||''};}).filter(g=>g.grade>0);
  const avgGrade=grades.length>0?(grades.reduce((s,g)=>s+Number(g.grade),0)/grades.length).toFixed(1):'—';

  // ── Next class ────────────────────────────────────────────────────────────
  const today=new Date().toISOString().split('T')[0];
  const nextA=myAssignments.filter(a=>a.date>=today&&a.status==='scheduled').sort((a,b)=>a.date.localeCompare(b.date))[0];
  const nextDate=st?.nextClassDate||(nextA?.date||null);
  const nextTime=st?.nextClassTime||(nextA?`${nextA.shiftStart}–${nextA.shiftEnd}`:null);
  const nextModule=st?.nextClassModule||(nextA?(prog?.name||'Práctica clínica'):null);
  const nextHosp=nextA?state.hospitals.find(h=>h.id===nextA.hospitalId)?.name:null;
  const nextDr=nextA?state.doctors.find(d=>d.id===nextA.doctorId)?.name:null;

  // ── Progress ──────────────────────────────────────────────────────────────
  const totalClasses=st?.totalClasses||(prog?.requiredCases||20);
  const completedClasses=st?.completedClasses!=null?st.completedClasses:myChecklists.length;
  const progressPct=Math.min(100,Math.round((completedClasses/Math.max(totalClasses,1))*100));
  const hoursPct=Math.min(100,Math.round(totalHours/Math.max(requiredHours,1)*100));

  // ── Resources ─────────────────────────────────────────────────────────────
  const drive=st?.driveLink||'';
  const video=st?.videoLink||'';
  const qbank=st?.questionBankLink||'';
  const vr=st?.vrLink||'';

  // ── Motivational phrase ───────────────────────────────────────────────────
  const PHRASES=[

    'El asistente quirúrgico excelente se forma un pase de instrumental a la vez. ¡Sigue! ⚕️',
    'Dominar el campo estéril es dominar la seguridad del paciente. ¡Tú lo logras! 💪',

        <div style={{background:'white',borderRadius:14,padding:'18px 20px',boxShadow:'0 2px 10px rgba(26,58,92,0.08)',border:`2px solid ${nextDate?COLORS.accent+'40':'#E5E7EB'}`}}>
          <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:14}}>
            <div style={{width:36,height:36,borderRadius:10,background:'#EEF6FF',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}>
              <span style={{fontSize:18}}>📅</span>
            </div>
            <span style={{fontWeight:700,fontSize:13,color:COLORS.primary}}>Próxima Clase</span>
          </div>
          {nextDate?(
            <div>
              <div style={{fontSize:17,fontWeight:800,color:COLORS.primary,marginBottom:4}}>{nextDate}</div>

              <div style={{fontSize:12,color:'#374151',marginBottom:6,lineHeight:1.45,fontWeight:500}}>{nextModule}</div>

            <div style={{textAlign:'center',padding:'16px 0',color:'#9CA3AF'}}>
              <div style={{fontSize:28,marginBottom:8}}>📭</div>
              <div style={{fontSize:13,fontWeight:500}}>Sin clases programadas</div>
              <div style={{fontSize:11,marginTop:4}}>El administrador puede agregar tu próxima sesión</div>

        </div>

        {/* Asistencia */}
        <div style={{background:'white',borderRadius:14,padding:'18px 20px',boxShadow:'0 2px 10px rgba(26,58,92,0.08)',border:'1px solid #EEF2F7'}}>
          <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:14}}>
            <div style={{width:36,height:36,borderRadius:10,background:'#ECFDF5',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}>
              <span style={{fontSize:18}}>✅</span>
            </div>
            <span style={{fontWeight:700,fontSize:13,color:COLORS.primary}}>Asistencia</span>
          </div>
          <div style={{display:'flex',alignItems:'baseline',gap:3,marginBottom:10}}>
            <span style={{fontSize:42,fontWeight:900,color:aColor(attendanceRate),lineHeight:1}}>{attendanceRate}</span>
            <span style={{fontSize:20,fontWeight:700,color:'#CBD5E1'}}>%</span>
          </div>
          <div style={{height:8,background:'#F1F5F9',borderRadius:999,marginBottom:8,overflow:'hidden'}}>
            <div style={{height:'100%',width:`${attendanceRate}%`,background:aColor(attendanceRate),borderRadius:999}}/>
          </div>
          <div style={{fontSize:12,color:'#64748B'}}>{attended} de {myChecklists.length} sesiones</div>
          {attendanceRate<80&&myChecklists.length>0&&<div style={{marginTop:8,padding:'4px 10px',background:'#FEF3C7',borderRadius:8,fontSize:11,color:'#92400E',fontWeight:600}}>⚠ Mínimo requerido: 80%</div>}
          {attendanceRate>=80&&myChecklists.length>0&&<div style={{marginTop:8,fontSize:11,fontWeight:600,color:COLORS.success}}>✓ Asistencia en regla</div>}

        {/* Horas Clínicas */}
        <div style={{background:'white',borderRadius:14,padding:'18px 20px',boxShadow:'0 2px 10px rgba(26,58,92,0.08)',border:'1px solid #EEF2F7'}}>
          <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:14}}>
            <div style={{width:36,height:36,borderRadius:10,background:'#F5F3FF',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}>
              <span style={{fontSize:18}}>⏱</span>
            </div>
            <span style={{fontWeight:700,fontSize:13,color:COLORS.primary}}>Horas Clínicas</span>

      {/* ════ FILA 2: CASOS, EVALUACIONES, TIMELINE ════ */}

              <span style={{fontSize:18}}>🔬</span>
            </div>
            <span style={{fontWeight:700,fontSize:13,color:COLORS.primary}}>Casos Registrados</span>
          </div>
          <div style={{fontSize:48,fontWeight:900,color:COLORS.success,lineHeight:1,marginBottom:4}}>{totalCases}</div>
          <div style={{fontSize:12,color:'#64748B',marginBottom:14}}>casos clínicos / quirúrgicos</div>
          <div style={{borderTop:'1px solid #F1F5F9',paddingTop:12}}>
            <div style={{fontSize:11,fontWeight:700,color:'#9CA3AF',marginBottom:6,textTransform:'uppercase',letterSpacing:0.5}}>Últimas sesiones</div>
            {myChecklists.length===0&&<div style={{fontSize:12,color:'#9CA3AF',textAlign:'center',padding:'8px 0'}}>Sin casos registrados aún</div>}
            {myChecklists.slice(-3).reverse().map((cl,i)=>{
              const a=myAssignments.find(as=>as.id===cl.assignmentId);
              const n=(cl.cases||[]).reduce((s,c)=>s+c.count,0);
              return(
                <div key={i} style={{display:'flex',justifyContent:'space-between',alignItems:'center',fontSize:12,padding:'4px 0',borderBottom:'1px solid #F9FAFB'}}>
                  <span style={{color:'#64748B'}}>{a?.date||'—'}</span>
                  <span style={{fontWeight:700,color:COLORS.success,background:'#D1FAE5',padding:'1px 8px',borderRadius:5,fontSize:11}}>+{n} caso{n!==1?'s':''}</span>
                </div>
              );
            })}
          </div>
        </div>

        {/* Evaluaciones */}
        <div style={{background:'white',borderRadius:14,padding:'18px 20px',boxShadow:'0 2px 10px rgba(26,58,92,0.08)',border:'1px solid #EEF2F7'}}>
          <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:16}}>
            <div style={{width:36,height:36,borderRadius:10,background:'#FFF7ED',display:'flex',alignItems:'center',justifyContent:'center'}}>
              <span style={{fontSize:18}}>📝</span>
            </div>
            <span style={{fontWeight:700,fontSize:13,color:COLORS.primary}}>Evaluaciones</span>
          </div>
          <div style={{display:'flex',gap:16,marginBottom:14}}>
            <div style={{flex:1,textAlign:'center',padding:'10px 8px',background:'#EEF6FF',borderRadius:10}}>
              <div style={{fontSize:32,fontWeight:900,color:COLORS.accent,lineHeight:1}}>{avgGrade}</div>
              <div style={{fontSize:11,color:'#64748B',marginTop:3}}>Promedio</div>
            </div>
            <div style={{flex:1,textAlign:'center',padding:'10px 8px',background:pendingSkills>0?'#FEF3C7':'#F0FDF4',borderRadius:10}}>
              <div style={{fontSize:32,fontWeight:900,color:pendingSkills>0?COLORS.warning:COLORS.success,lineHeight:1}}>{pendingSkills}</div>
              <div style={{fontSize:11,color:'#64748B',marginTop:3}}>Pendientes</div>
            </div>
          </div>
          <div style={{borderTop:'1px solid #F1F5F9',paddingTop:12,maxHeight:120,overflowY:'auto'}}>
            {grades.length===0&&<div style={{fontSize:12,color:'#9CA3AF',textAlign:'center',padding:'8px 0'}}>Sin evaluaciones aún</div>}
            {grades.slice(-4).reverse().map((g,i)=>{
              const gc=Number(g.grade);const gcol=gc>=8?COLORS.success:gc>=6?COLORS.warning:COLORS.danger;
              return(
                <div key={i} style={{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'5px 0',fontSize:12,borderBottom:'1px solid #F9FAFB'}}>
                  <span style={{color:'#374151',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap',flex:1,marginRight:8,fontWeight:500}}>{g.subject}</span>
                  <span style={{fontWeight:700,color:gcol,background:`${gcol}18`,padding:'2px 8px',borderRadius:6,fontSize:11,flexShrink:0}}>{gc}/10</span>
                </div>
              );
            })}
          </div>
        </div>

        {/* Timeline de Progreso */}
        <div style={{background:'white',borderRadius:14,padding:'18px 20px',boxShadow:'0 2px 10px rgba(26,58,92,0.08)',border:'1px solid #EEF2F7'}}>
          <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:16}}>
            <div style={{width:36,height:36,borderRadius:10,background:'#EEF6FF',display:'flex',alignItems:'center',justifyContent:'center'}}>
              <span style={{fontSize:18}}>🗺️</span>
            </div>
            <span style={{fontWeight:700,fontSize:13,color:COLORS.primary}}>Timeline de Progreso</span>
          </div>
          <div style={{maxHeight:200,overflowY:'auto',paddingRight:4}}>
            {(caseTypes.length>0?caseTypes:['Módulo 1 — Inducción clínica','Módulo 2 — Práctica supervisada','Módulo 3 — Participación activa','Módulo 4 — Práctica independiente','Módulo 5 — Evaluación final']).map((ct,i)=>{
              const done=i<completedClasses;
              const current=i===completedClasses;
              const pending=i>completedClasses;
              return(
                <div key={i} style={{display:'flex',alignItems:'flex-start',gap:12,marginBottom:10,position:'relative'}}>
                  <div style={{display:'flex',flexDirection:'column',alignItems:'center',flexShrink:0}}>
                    <div style={{width:28,height:28,borderRadius:'50%',display:'flex',alignItems:'center',justifyContent:'center',fontWeight:800,fontSize:11,
                      background:done?COLORS.success:current?COLORS.accent:'#F1F5F9',
                      color:done||current?'white':'#94A3B8',
                      border:`2.5px solid ${done?COLORS.success:current?COLORS.accent:'#E2E8F0'}`,
                      boxShadow:current?`0 0 0 3px ${COLORS.accent}30`:'none',
                      transition:'all 0.3s'}}>
                      {done?'✓':i+1}
                    </div>
                    {i<(caseTypes.length>0?caseTypes.length:5)-1&&<div style={{width:2,height:16,background:done?COLORS.success:'#E2E8F0',margin:'3px 0'}}/>}
                  </div>
                  <div style={{flex:1,paddingTop:4}}>
                    <div style={{fontSize:12,fontWeight:current?700:done?600:400,color:done?'#374151':current?COLORS.primary:'#9CA3AF',lineHeight:1.4}}>{ct}</div>
                    {done&&<div style={{fontSize:10,color:COLORS.success,fontWeight:700,marginTop:2}}>✓ Completado</div>}
                    {current&&<div style={{fontSize:10,color:COLORS.accent,fontWeight:700,marginTop:2,display:'flex',alignItems:'center',gap:4}}><span style={{width:6,height:6,borderRadius:'50%',background:COLORS.accent,display:'inline-block',animation:'pulse 1s infinite'}}/>EN PROGRESO</div>}
                  </div>
                </div>
              );
            })}
          </div>
          <div style={{marginTop:10,padding:'8px 12px',background:COLORS.light,borderRadius:8,display:'flex',justifyContent:'space-between',alignItems:'center'}}>
            <span style={{fontSize:12,fontWeight:600,color:COLORS.primary}}>Destrezas dominadas</span>
            <span style={{fontSize:13,fontWeight:800,color:dominatedSkills===totalSkills&&totalSkills>0?COLORS.success:COLORS.accent}}>{dominatedSkills}<span style={{color:'#9CA3AF',fontWeight:400}}>/{totalSkills}</span></span>
          </div>
        </div>
      </div>

      {/* ════ FILA 3: ACCESO RÁPIDO ════ */}
      <div>
        <div style={{fontWeight:700,fontSize:15,color:COLORS.primary,marginBottom:12,display:'flex',alignItems:'center',gap:8}}>
          <span>⚡</span> Acceso Rápido al Material Académico
        </div>
        <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(160px,1fr))',gap:12}}>
          <ResourceCard href={drive} emoji="📂" label="Material de Estudio" sub="Google Drive" color={COLORS.accent}/>
          <ResourceCard href={video} emoji="🎬" label="Videos del Programa" sub="Biblioteca de videos" color="#DC2626"/>
          <ResourceCard href={qbank} emoji="❓" label="Banco de Preguntas" sub="Cuestionarios y exámenes" color="#D97706"/>
          <ResourceCard href={vr} emoji="🥽" label="VR Anatomy" sub="Anatomía en realidad virtual" color="#7C3AED"/>
        </div>
        {(!drive&&!video&&!qbank&&!vr)&&(
          <div style={{marginTop:10,padding:'10px 14px',background:'#F8FAFC',border:'1px solid #E2E8F0',borderRadius:10,fontSize:12,color:'#64748B',display:'flex',alignItems:'center',gap:8}}>
            <span>ℹ️</span> <span>El administrador puede configurar los enlaces de recursos desde el panel de <strong>Gestión de Estudiantes → Editar Estudiante → Recursos del Dashboard</strong>.</span>
          </div>
        )}
      </div>
    </div>
  );
};

// ── DOCTOR CLINICAL DASHBOARD ────────────────────────────────────────────────
const DoctorDashboardPage=({state,dispatch,toast,user,setView})=>{
  const [reportModal,setReportModal]=React.useState(false);
  const [attendModal,setAttendModal]=React.useState(null);
  const [attendForm,setAttendForm]=React.useState({clockIn:'',clockOut:'',attendance:'attended',minutesLate:0});
  const [evalModal,setEvalModal]=React.useState(null);
  const [evalForm,setEvalForm]=React.useState({performance:8,comments:'',dresscode:true,handwash:true,areaKnowledge:true,instruments:true,asepsis:true,participation:true,communication:true,hospitalRules:true});

  const today=new Date().toISOString().split('T')[0];
  const nowHour=new Date().getHours();
  const greeting=nowHour<12?'Buenos días':nowHour<18?'Buenas tardes':'Buenas noches';
  const doctorRecord=state.doctors.find(d=>d.id===user.id);

  const myAssignments=state.assignments.filter(a=>a.doctorId===user.id);
  const todayAssignments=myAssignments.filter(a=>a.date===today);
  const upcomingAssignments=myAssignments.filter(a=>a.date>=today&&a.status==='scheduled').sort((a,b)=>a.date.localeCompare(b.date));
  const completedAssignments=myAssignments.filter(a=>a.status==='completed');
  const myChecklists=state.checklists.filter(c=>myAssignments.some(a=>a.id===c.assignmentId));
  const pendingEvals=completedAssignments.filter(a=>!state.checklists.find(c=>c.assignmentId===a.id&&c.signed));
  const myStudentIds=[...new Set(myAssignments.map(a=>a.studentId))];
  const myStudents=state.students.filter(s=>myStudentIds.includes(s.id));
  const totalHoursSupervised=myChecklists.reduce((s,c)=>s+(c.totalHours||0),0);
  const totalCasesSupervised=myChecklists.reduce((s,c)=>s+(c.cases||[]).reduce((ss,ca)=>ss+ca.count,0),0);
  const todayAttended=myChecklists.filter(c=>{const a=myAssignments.find(a=>a.id===c.assignmentId);return a&&a.date===today&&c.attendance==='attended';}).length;

  const lowAttendanceStudents=myStudents.filter(s=>{
    const sA=myAssignments.filter(a=>a.studentId===s.id&&a.status==='completed');
    if(!sA.length) return false;
    const sCl=myChecklists.filter(c=>sA.some(a=>a.id===c.assignmentId));
    if(!sCl.length) return false;
    return sCl.filter(c=>c.attendance==='attended').length/sCl.length<0.75;
  });
  const alertCount=lowAttendanceStudents.length+pendingEvals.length;

  const getStudent=id=>state.students.find(s=>s.id===id);
  const getHospital=id=>state.hospitals.find(h=>h.id===id);
  const getArea=(hId,aId)=>{const h=state.hospitals.find(h=>h.id===hId);return h?.areas?.find(a=>a.id===aId);};
  const getProgram=id=>state.programs?.find(p=>p.id===id);
  const getChecklist=aId=>state.checklists.find(c=>c.assignmentId===aId);
  const studentPerf=sId=>{
    const sA=myAssignments.filter(a=>a.studentId===sId&&a.status==='completed');
    const sCl=myChecklists.filter(c=>sA.some(a=>a.id===c.assignmentId)&&c.performance>0);
    if(!sCl.length) return null;
    return Math.round(sCl.reduce((s,c)=>s+c.performance,0)/sCl.length*10)/10;
  };
  const lastAttendance=sId=>{
    const sA=myAssignments.filter(a=>a.studentId===sId&&a.status==='completed').sort((a,b)=>b.date.localeCompare(a.date));
    return sA[0]?.date||null;
  };

  const submitAttend=()=>{
    dispatch({type:'COMPLETE_ASSIGNMENT',payload:attendModal.id});
    const existing=getChecklist(attendModal.id);
    if(!existing){
      const late=attendForm.attendance==='late'?(parseInt(attendForm.minutesLate)||0):0;
      const [h1,m1]=(attendForm.clockIn||'07:00').split(':').map(Number);
      const [h2,m2]=(attendForm.clockOut||'13:00').split(':').map(Number);
      const hrs=Math.max(0,((h2*60+m2)-(h1*60+m1))/60);
      dispatch({type:'ADD_CHECKLIST',payload:{
        id:'cl'+Date.now(),assignmentId:attendModal.id,
        scheduledStart:attendModal.shiftStart,clockIn:attendForm.clockIn,clockOut:attendForm.clockOut,
        minutesLate:late,totalHours:Math.round(hrs*10)/10,attendance:attendForm.attendance,
        cases:[],skillLevels:{},dresscode:true,handwash:true,areaKnowledge:true,
        instruments:true,asepsis:true,participation:true,communication:true,hospitalRules:true,
        performance:0,comments:'',signed:false
      }});
    }
    toast('✅ Asistencia registrada — '+getStudent(attendModal.studentId)?.name);
    setAttendModal(null);
  };

  const submitEval=()=>{
    const existing=getChecklist(evalModal.id);
    const payload={performance:evalForm.performance,comments:evalForm.comments,
      dresscode:evalForm.dresscode,handwash:evalForm.handwash,areaKnowledge:evalForm.areaKnowledge,
      instruments:evalForm.instruments,asepsis:evalForm.asepsis,participation:evalForm.participation,
      communication:evalForm.communication,hospitalRules:evalForm.hospitalRules,
      signed:true,signedAt:new Date().toISOString()};
    if(existing){
      dispatch({type:'UPDATE_CHECKLIST',payload:{...existing,...payload}});
    } else {
      dispatch({type:'ADD_CHECKLIST',payload:{id:'cl'+Date.now(),assignmentId:evalModal.id,
        scheduledStart:evalModal.shiftStart,clockIn:evalModal.shiftStart,clockOut:evalModal.shiftEnd,
        minutesLate:0,totalHours:6,attendance:'attended',cases:[],skillLevels:{},...payload}});
      dispatch({type:'COMPLETE_ASSIGNMENT',payload:evalModal.id});
    }
    toast('✅ Evaluación registrada y firmada');setEvalModal(null);
  };

  const openEval=a=>{
    const ec=getChecklist(a.id);
    setEvalModal(a);
    setEvalForm({performance:ec?.performance||8,comments:ec?.comments||'',
      dresscode:ec?.dresscode??true,handwash:ec?.handwash??true,areaKnowledge:ec?.areaKnowledge??true,
      instruments:ec?.instruments??true,asepsis:ec?.asepsis??true,participation:ec?.participation??true,
      communication:ec?.communication??true,hospitalRules:ec?.hospitalRules??true});
  };

  const avgPerf=()=>{
    const cl=myChecklists.filter(c=>c.performance>0);
    if(!cl.length) return '—';
    return (cl.reduce((s,c)=>s+c.performance,0)/cl.length).toFixed(1);
  };
  const attendRate=myChecklists.length===0?0:Math.round(myChecklists.filter(c=>c.attendance==='attended').length/myChecklists.length*100);

  return(
    <div style={{padding:28,maxWidth:1400}}>

      {/* ── BANNER DEL DOCTOR ─────────────────────────────────────────────── */}
      <div style={{background:`linear-gradient(135deg,${COLORS.primary} 0%,${COLORS.accent} 100%)`,borderRadius:16,padding:'22px 28px',marginBottom:24,display:'flex',alignItems:'center',justifyContent:'space-between',flexWrap:'wrap',gap:16}}>
        <div style={{display:'flex',alignItems:'center',gap:18}}>
          <div style={{width:60,height:60,borderRadius:16,background:'rgba(255,255,255,0.18)',border:'2px solid rgba(255,255,255,0.3)',display:'flex',alignItems:'center',justifyContent:'center',fontSize:28,flexShrink:0}}>🩺</div>
          <div>
            <div style={{color:'rgba(255,255,255,0.7)',fontSize:12,fontWeight:500,marginBottom:2}}>{greeting}, doctor</div>
            <div style={{color:'white',fontSize:21,fontWeight:800,lineHeight:1.2}}>{user.name}</div>
            <div style={{color:'rgba(255,255,255,0.6)',fontSize:12,marginTop:3}}>{doctorRecord?.specialty||'Cirugía General'}{doctorRecord?.license?' · Lic. '+doctorRecord.license:''}</div>
          </div>
        </div>
        <div style={{display:'flex',gap:8,flexWrap:'wrap'}}>
          {[['📅','Calendario',()=>setView('calendar')],['📊','Reporte',()=>setReportModal(true)],['📞','Coordinación',()=>setView('coordinacion')]].map(([ico,lbl,action])=>(
            <button key={lbl} onClick={action}
              style={{padding:'8px 14px',background:'rgba(255,255,255,0.12)',color:'white',border:'1.5px solid rgba(255,255,255,0.25)',borderRadius:9,fontSize:12,fontWeight:600,cursor:'pointer',display:'flex',alignItems:'center',gap:6}}>
              {ico} {lbl}
            </button>
          ))}
        </div>
      </div>

      {/* ── MÉTRICAS PRINCIPALES ──────────────────────────────────────────── */}
      <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(175px,1fr))',gap:14,marginBottom:24}}>
        {[
          {label:'Estudiantes Asignados',value:myStudentIds.length,icon:'🎓',color:'#2E75B6',bg:'#EFF6FF',sub:'bajo tu supervisión'},

            <Btn color="primary" onClick={submitAttend} style={{flex:1}}>Registrar Asistencia</Btn>
          </div>
        </Modal>
      )}

      {/* ── MODAL: EVALUACIÓN RÁPIDA ──────────────────────────────────────── */}
      {evalModal&&(
        <Modal title={'📋 Evaluar — '+getStudent(evalModal.studentId)?.name} onClose={()=>setEvalModal(null)} width={540}>
          <div style={{padding:'10px 14px',background:'#F8FAFC',borderRadius:10,marginBottom:18,fontSize:12,color:'#64748B',lineHeight:1.6}}>
            <strong>📍</strong> {getHospital(evalModal.hospitalId)?.name} &nbsp;·&nbsp; <strong>📅</strong> {evalModal.date} &nbsp;·&nbsp; <strong>🕐</strong> {evalModal.shiftStart}–{evalModal.shiftEnd}
          </div>

          {/* Calificación con slider */}
          <div style={{marginBottom:22,padding:'16px 18px',background:'#F0F9FF',borderRadius:12,border:'1.5px solid #BAE6FD'}}>
            <label style={{display:'block',fontWeight:700,fontSize:14,color:COLORS.primary,marginBottom:12}}>Calificación General del Desempeño</label>
            <div style={{display:'flex',alignItems:'center',gap:16}}>
              <input type="range" min="0" max="10" step="0.5" value={evalForm.performance}
                onChange={e=>setEvalForm({...evalForm,performance:parseFloat(e.target.value)})} style={{flex:1,accentColor:COLORS.accent}}/>
              <div style={{fontWeight:900,fontSize:32,color:evalForm.performance>=9?'#059669':evalForm.performance>=7?COLORS.accent:evalForm.performance>=5?'#D97706':'#DC2626',minWidth:48,textAlign:'center',lineHeight:1}}>
                {evalForm.performance}
              </div>
            </div>
            <div style={{display:'flex',justifyContent:'space-between',fontSize:10,color:'#94A3B8',marginTop:4}}>
              <span>0 · Insuficiente</span><span>5 · Regular</span><span>7 · Bueno</span><span>10 · Excelente</span>
            </div>
          </div>

          {/* Checklist de conducta */}
          <div style={{marginBottom:18}}>
            <label style={{display:'block',fontWeight:700,fontSize:13,color:'#374151',marginBottom:10}}>Evaluación de Conducta Clínica</label>
            <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:7}}>
              {[['dresscode','👔 Vestimenta adecuada'],['handwash','🧼 Lavado de manos'],['areaKnowledge','🏥 Conoce el área'],['instruments','🔧 Manejo instrumental'],['asepsis','🧪 Técnica aséptica'],['participation','🤝 Participación activa'],['communication','💬 Comunicación'],['hospitalRules','📋 Normas hospitalarias']].map(([key,lbl])=>(
                <label key={key} style={{display:'flex',alignItems:'center',gap:8,padding:'9px 11px',background:evalForm[key]?'#F0FDF4':'#FEF2F2',borderRadius:9,border:`1.5px solid ${evalForm[key]?'#86EFAC':'#FECACA'}`,cursor:'pointer',fontSize:12,fontWeight:600,color:evalForm[key]?'#065F46':'#991B1B',transition:'all 0.15s',userSelect:'none'}}>
                  <input type="checkbox" checked={!!evalForm[key]} onChange={e=>setEvalForm({...evalForm,[key]:e.target.checked})} style={{accentColor:'#059669',width:14,height:14}}/>
                  {lbl}
                </label>
              ))}
            </div>
          </div>

          {/* Observaciones */}
          <div style={{marginBottom:18}}>
            <label style={{display:'block',fontWeight:700,fontSize:13,color:'#374151',marginBottom:6}}>Observaciones Clínicas</label>
            <textarea value={evalForm.comments} onChange={e=>setEvalForm({...evalForm,comments:e.target.value})}
              placeholder="Describe el desempeño clínico del estudiante, áreas de mejora, fortalezas observadas en sala quirúrgica..."
              style={{width:'100%',padding:'10px 12px',border:'1.5px solid #D1D5DB',borderRadius:9,fontSize:13,outline:'none',boxSizing:'border-box',minHeight:90,resize:'vertical',fontFamily:'inherit',color:'#374151'}}/>
          </div>

          <div style={{display:'flex',gap:10}}>
            <Btn color="secondary" onClick={()=>setEvalModal(null)} style={{flex:1}}>Cancelar</Btn>
            <Btn color="success" onClick={submitEval} style={{flex:2}}>✅ Firmar y Guardar Evaluación</Btn>
          </div>
        </Modal>
      )}
    </div>
  );
};

// ── DASHBOARD (Admin / Doctor view — routes students to personal dashboard) ────
const DashboardPage=({state,dispatch,toast,user,setView})=>{
  // Students get their own personalized dashboard
  if(user?.role==='student') return <StudentDashboardPage state={state} dispatch={dispatch} toast={toast} user={user}/>;
  // Doctors get their clinical supervision dashboard
  if(user?.role==='doctor') return <DoctorDashboardPage state={state} dispatch={dispatch} toast={toast} user={user} setView={setView}/>;

  const today=new Date().toISOString().split('T')[0];
  const upcoming=state.assignments.filter(a=>a.date>=today&&a.status==='scheduled');
  const completed=state.assignments.filter(a=>a.status==='completed');
  const pending=state.dayChanges.filter(d=>d.status==='pending');
  const signed=state.checklists.filter(c=>c.signed);
  const attendanceRate=state.checklists.length===0?0:Math.round(state.checklists.filter(c=>c.attendance==='attended').length/state.checklists.length*100);
  const totalCasesLogged=state.checklists.reduce((sum,c)=>sum+(c.cases||[]).reduce((s,ca)=>s+ca.count,0),0);

  return(
    <div style={{padding:28}}>
      <div style={{display:'flex',gap:16,flexWrap:'wrap',marginBottom:24}}>
        <StatCard label="Estudiantes Activos" value={state.students.length} icon="students" color="#2E75B6" sub="En el programa"/>
        <StatCard label="Prácticas Programadas" value={upcoming.length} icon="calendar" color="#D97706" sub="Próximas fechas"/>
        <StatCard label="Checklists Firmados" value={signed.length} icon="checklist" color="#7C3AED" sub={`de ${state.assignments.filter(a=>a.status==='completed').length} completadas`}/>
        <StatCard label="Casos Registrados" value={totalCasesLogged} icon="reports" color="#059669" sub="En todas las prácticas"/>
        <StatCard label="Cambios Pendientes" value={pending.length} icon="changes" color={pending.length>0?COLORS.danger:'#6B7280'} sub={pending.length>0?"Requieren atención":"Sin pendientes"}/>
        <StatCard label="Asistencia General" value={`${attendanceRate}%`} icon="check" color={attendanceRate>=80?COLORS.success:COLORS.warning}/>
      </div>

      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:20,marginBottom:20}}>
        <Card>
          <h3 style={{margin:'0 0 16px',color:COLORS.primary,fontSize:16,fontWeight:700}}>Próximas Prácticas</h3>
          {upcoming.length===0?<p style={{color:'#9CA3AF',fontSize:14}}>Sin prácticas programadas.</p>:upcoming.slice(0,5).map(a=>{
            const st=state.students.find(s=>s.id===a.studentId);
            const dr=state.doctors.find(d=>d.id===a.doctorId);
            const ho=state.hospitals.find(h=>h.id===a.hospitalId);
            const prog=state.programs?.find(p=>p.id===a.programId);
            return(
              <div key={a.id} style={{display:'flex',alignItems:'center',gap:12,padding:'10px 0',borderBottom:'1px solid #F3F4F6'}}>
                <div style={{width:40,height:40,borderRadius:10,background:COLORS.light,display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}><Icon name="calendar" size={18} color={COLORS.accent}/></div>
                <div style={{flex:1}}>
                  <div style={{fontWeight:600,fontSize:13,color:'#1F2937'}}>{st?.name}</div>
                  <div style={{fontSize:12,color:'#6B7280'}}>{ho?.name} · {a.shift} · {a.date}</div>
                  <div style={{fontSize:11,color:COLORS.accent}}>{prog?.name||''}</div>
                </div>
                <Badge text={a.notified?'Notificado':'Pendiente'} color={a.notified?'green':'yellow'}/>
              </div>
            );
          })}
        </Card>

        <Card>
          <h3 style={{margin:'0 0 16px',color:COLORS.primary,fontSize:16,fontWeight:700}}>Progreso por Programa</h3>
          {(state.programs||[]).filter(p=>p.status==='activo').map(prog=>{
            const stIds=state.students.filter(s=>s.programId===prog.id).map(s=>s.id);
            const cls=state.checklists.filter(c=>state.assignments.find(a=>a.id===c.assignmentId&&stIds.includes(a.studentId)));
            const totalCases=cls.reduce((s,c)=>(c.cases||[]).reduce((ss,ca)=>ss+ca.count,0)+s,0);
            const totalHours=cls.reduce((s,c)=>s+(c.totalHours||0),0);
            const reqCases=prog.requiredCases*stIds.length;
            const reqHours=prog.requiredHours*stIds.length;
            return(
              <div key={prog.id} style={{marginBottom:14}}>
                <div style={{fontWeight:600,fontSize:13,marginBottom:6,color:COLORS.primary}}>{prog.name} <span style={{fontWeight:400,color:'#9CA3AF',fontSize:12}}>({stIds.length} est.)</span></div>
                <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:8}}>
                  <div>
                    <div style={{fontSize:11,color:'#6B7280',marginBottom:2}}>Casos: {totalCases}/{reqCases}</div>
                    <ProgressBar value={totalCases} max={reqCases||1} height={6} showLabel={false}/>
                  </div>
                  <div>
                    <div style={{fontSize:11,color:'#6B7280',marginBottom:2}}>Horas: {totalHours.toFixed(1)}/{reqHours}h</div>
                    <ProgressBar value={totalHours} max={reqHours||1} height={6} showLabel={false}/>
                  </div>
                </div>
              </div>
            );
          })}
        </Card>
      </div>

      {pending.length>0&&(
        <div style={{padding:'14px 20px',background:'#FEF3C7',borderRadius:12,border:'1.5px solid #F59E0B',display:'flex',alignItems:'center',gap:12}}>
          <Icon name="alerts" size={22} color={COLORS.warning}/>
          <span style={{fontWeight:700,color:'#92400E'}}>⚠ {pending.length} solicitud(es) de cambio de día pendiente(s).</span>
          <span style={{color:'#B45309',fontSize:13,marginLeft:4}}>Ve a "Cambios de Día" para aprobar.</span>
        </div>
      )}
    </div>
  );
};

// ── STUDENTS ──────────────────────────────────────────────────────────────────
const StudentsPage=({state,dispatch,toast})=>{
  const [search,setSearch]=React.useState('');
  const [modal,setModal]=React.useState(null);
  const [tab,setTab]=React.useState('basic'); // 'basic' | 'academic' | 'resources' | 'grades'
  const [gradeForm,setGradeForm]=React.useState({subject:'',grade:'',date:''});
  const [form,setForm]=React.useState({name:'',code:'',email:'',phone:'',cohort:'',programId:'',status:'active',paymentStatus:'al_día',username:'',password:'',
    driveLink:'',videoLink:'',questionBankLink:'',vrLink:'',
    nextClassDate:'',nextClassTime:'',nextClassModule:'',
    totalClasses:'',completedClasses:'',requiredHoursOverride:'',completedHoursOverride:'',
    grades:[]});
  const filtered=state.students.filter(s=>s.name.toLowerCase().includes(search.toLowerCase())||s.code.includes(search));

  const save=()=>{
    if(!form.name||!form.code){toast('Nombre y código son requeridos','error');return;}
    if(modal==='new') dispatch({type:'ADD_STUDENT',payload:{...form,id:'st-'+Date.now(),progress:0,pendingCert:false}});
    else dispatch({type:'EDIT_STUDENT',payload:form});
    toast(modal==='new'?'Estudiante agregado':'Estudiante actualizado');setModal(null);
  };
  const del=s=>{if(confirm(`¿Eliminar a ${s.name}?`)){dispatch({type:'DEL_STUDENT',payload:s.id});toast('Eliminado','info');}};

  const payColor={al_día:'green',atrasado:'red',pendiente:'yellow'};
  const headers=['Código','Nombre','Programa','Teléfono','Pago','Progreso','Cert.','Acciones'];
  const rows=filtered.map(s=>{
    const prog=state.programs?.find(p=>p.id===s.programId);
    return[
      <span style={{fontWeight:600,color:COLORS.accent}}>{s.code}</span>,
      <div><div style={{fontWeight:600}}>{s.name}</div>{s.email&&<div style={{fontSize:11,color:'#9CA3AF'}}>{s.email}</div>}</div>,
      <span style={{fontSize:12}}>{prog?.name||s.cohort}</span>,
      s.phone,
      <Badge text={s.paymentStatus||'al_día'} color={payColor[s.paymentStatus]||'gray'}/>,
      <div style={{minWidth:80}}>
        <div style={{fontSize:11,color:'#6B7280',marginBottom:2}}>{s.progress||0}%</div>
        <div style={{height:6,background:'#F3F4F6',borderRadius:999}}>
          <div style={{height:'100%',width:`${s.progress||0}%`,background:s.progress>=80?COLORS.success:COLORS.accent,borderRadius:999}}/>
        </div>
      </div>,
      s.pendingCert?<Badge text="✓ Listo" color="green"/>:<span style={{color:'#D1D5DB',fontSize:12}}>—</span>,
      <div style={{display:'flex',gap:6}}>
        <Btn size="sm" color="secondary" onClick={()=>{setForm({driveLink:'',videoLink:'',questionBankLink:'',vrLink:'',nextClassDate:'',nextClassTime:'',nextClassModule:'',totalClasses:'',completedClasses:'',requiredHoursOverride:'',completedHoursOverride:'',grades:[],...s,username:s.username||'',password:s.password||''});setTab('basic');setModal('edit');}}><Icon name="edit" size={13}/></Btn>
        <Btn size="sm" color="danger" onClick={()=>del(s)}><Icon name="trash" size={13}/></Btn>
      </div>
    ];
  });

  return(
    <div style={{padding:28}}>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:20}}>
        <div style={{position:'relative',width:300}}>
          <div style={{position:'absolute',left:10,top:'50%',transform:'translateY(-50%)'}}><Icon name="search" size={16} color="#9CA3AF"/></div>
          <input placeholder="Buscar estudiante..." value={search} onChange={e=>setSearch(e.target.value)} style={{paddingLeft:36,padding:'8px 12px 8px 36px',border:'1.5px solid #D1D5DB',borderRadius:8,fontSize:14,width:'100%',boxSizing:'border-box'}}/>
        </div>
        <Btn onClick={()=>{setForm({name:'',code:'',email:'',phone:'',cohort:'',programId:'',status:'active',paymentStatus:'al_día',username:'',password:'',driveLink:'',videoLink:'',questionBankLink:'',vrLink:'',nextClassDate:'',nextClassTime:'',nextClassModule:'',totalClasses:'',completedClasses:'',requiredHoursOverride:'',completedHoursOverride:'',grades:[]});setTab('basic');setModal('new');}}><Icon name="plus" size={16}/>Nuevo Estudiante</Btn>
      </div>
      <Card style={{padding:0}}><Table headers={headers} rows={rows} emptyMsg="No se encontraron estudiantes"/></Card>
      {modal&&(
        <Modal title={modal==='new'?'Nuevo Estudiante':'Editar Estudiante — '+form.name} onClose={()=>setModal(null)} width={620}>
          {/* ── TABS ── */}
          <div style={{display:'flex',gap:4,marginBottom:20,borderBottom:'2px solid #F1F5F9',paddingBottom:0}}>
            {[['basic','📋 Datos Básicos'],['academic','📊 Datos Académicos'],['resources','⚡ Recursos'],['grades','📝 Evaluaciones']].map(([t,label])=>(
              <button key={t} onClick={()=>setTab(t)} style={{padding:'8px 14px',border:'none',background:'none',fontSize:12,fontWeight:tab===t?700:500,
                color:tab===t?COLORS.accent:'#64748B',borderBottom:`3px solid ${tab===t?COLORS.accent:'transparent'}`,
                marginBottom:-2,cursor:'pointer',borderRadius:'4px 4px 0 0',whiteSpace:'nowrap'}}>
                {label}
              </button>
            ))}
          </div>

          {/* ── TAB: Datos Básicos ── */}
          {tab==='basic'&&(
            <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:12}}>
              <Input label="Nombre completo" value={form.name} onChange={v=>setForm({...form,name:v})} required/>
              <Input label="Código GPA" value={form.code} onChange={v=>setForm({...form,code:v})} required/>
              <Input label="Correo" value={form.email||''} onChange={v=>setForm({...form,email:v})} type="email"/>
              <Input label="WhatsApp" value={form.phone||''} onChange={v=>setForm({...form,phone:v})}/>
              <Select label="Programa" value={form.programId||''} onChange={v=>setForm({...form,programId:v})} options={(state.programs||[]).map(p=>({value:p.id,label:p.name}))}/>
              <Select label="Estado de Pago" value={form.paymentStatus||'al_día'} onChange={v=>setForm({...form,paymentStatus:v})} options={[{value:'al_día',label:'Al día'},{value:'atrasado',label:'Atrasado'},{value:'pendiente',label:'Pendiente'}]}/>
              <Input label="Usuario (login)" value={form.username||''} onChange={v=>setForm({...form,username:v})} placeholder="ej: maria.garcia"/>
              <Input label="Contraseña" value={form.password||''} onChange={v=>setForm({...form,password:v})} placeholder="ej: Est2026!"/>
            </div>
          )}

          {/* ── TAB: Datos Académicos ── */}
          {tab==='academic'&&(
            <div>
              <div style={{padding:'10px 14px',background:'#EEF6FF',borderRadius:8,marginBottom:16,fontSize:12,color:COLORS.primary}}>
                ℹ️ Estos datos aparecen en el dashboard personal del estudiante. Si se dejan vacíos, el sistema usará los valores calculados automáticamente.
              </div>
              <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:12}}>
                <Input label="Próxima clase — Fecha" value={form.nextClassDate||''} onChange={v=>setForm({...form,nextClassDate:v})} type="date"/>
                <Input label="Próxima clase — Horario" value={form.nextClassTime||''} onChange={v=>setForm({...form,nextClassTime:v})} placeholder="ej: 07:00–13:00"/>
                <div style={{gridColumn:'span 2'}}><Input label="Próxima clase — Módulo / Tema" value={form.nextClassModule||''} onChange={v=>setForm({...form,nextClassModule:v})} placeholder="ej: TC de Cráneo — Protocolo Avanzado"/></div>
                <Input label="Total de clases del programa" value={form.totalClasses||''} onChange={v=>setForm({...form,totalClasses:v})} type="number" placeholder="ej: 20"/>
                <Input label="Clases completadas" value={form.completedClasses||''} onChange={v=>setForm({...form,completedClasses:v})} type="number" placeholder="ej: 5"/>
                <Input label="Horas clínicas requeridas" value={form.requiredHoursOverride||''} onChange={v=>setForm({...form,requiredHoursOverride:v})} type="number" placeholder="ej: 40 (usa la del programa si vacío)"/>
                <Input label="Horas clínicas completadas" value={form.completedHoursOverride||''} onChange={v=>setForm({...form,completedHoursOverride:v})} type="number" placeholder="ej: 18.5 (auto si vacío)"/>
              </div>
            </div>
          )}

          {/* ── TAB: Recursos del Dashboard ── */}
          {tab==='resources'&&(
            <div>
              <div style={{padding:'10px 14px',background:'#FFF7ED',borderRadius:8,marginBottom:16,fontSize:12,color:'#92400E'}}>
                🔗 Agrega los enlaces que aparecerán en el dashboard del estudiante. Deja vacío si aún no aplica.
              </div>
              <div style={{display:'flex',flexDirection:'column',gap:12}}>
                <div style={{display:'flex',alignItems:'center',gap:10,padding:'12px 14px',background:'#F8FAFC',borderRadius:8}}>
                  <span style={{fontSize:20}}>📂</span>
                  <div style={{flex:1}}><Input label="Google Drive — Material académico" value={form.driveLink||''} onChange={v=>setForm({...form,driveLink:v})} placeholder="https://drive.google.com/..."/></div>
                </div>
                <div style={{display:'flex',alignItems:'center',gap:10,padding:'12px 14px',background:'#F8FAFC',borderRadius:8}}>
                  <span style={{fontSize:20}}>🎬</span>
                  <div style={{flex:1}}><Input label="Videos del programa" value={form.videoLink||''} onChange={v=>setForm({...form,videoLink:v})} placeholder="https://youtube.com/playlist?..."/></div>
                </div>
                <div style={{display:'flex',alignItems:'center',gap:10,padding:'12px 14px',background:'#F8FAFC',borderRadius:8}}>
                  <span style={{fontSize:20}}>❓</span>
                  <div style={{flex:1}}><Input label="Banco de preguntas" value={form.questionBankLink||''} onChange={v=>setForm({...form,questionBankLink:v})} placeholder="https://forms.gle/..."/></div>
                </div>
                <div style={{display:'flex',alignItems:'center',gap:10,padding:'12px 14px',background:'#F8FAFC',borderRadius:8}}>
                  <span style={{fontSize:20}}>🥽</span>
                  <div style={{flex:1}}><Input label="VR Anatomy" value={form.vrLink||''} onChange={v=>setForm({...form,vrLink:v})} placeholder="https://vranatomyapp.com/..."/></div>
                </div>
              </div>
            </div>
          )}

          {/* ── TAB: Evaluaciones ── */}
          {tab==='grades'&&(
            <div>
              <div style={{padding:'10px 14px',background:'#ECFDF5',borderRadius:8,marginBottom:14,fontSize:12,color:'#065F46'}}>
                📝 Agrega evaluaciones, notas de práctica o exámenes. Estas aparecen en el dashboard del estudiante.
              </div>
              {/* Add grade form */}
              <div style={{display:'grid',gridTemplateColumns:'1fr auto auto auto',gap:8,marginBottom:14,alignItems:'flex-end'}}>
                <Input label="Nombre / Descripción" value={gradeForm.subject} onChange={v=>setGradeForm({...gradeForm,subject:v})} placeholder="ej: Práctica 3 — Sutura intradérmica"/>
                <Input label="Nota (0-10)" value={gradeForm.grade} onChange={v=>setGradeForm({...gradeForm,grade:v})} type="number" placeholder="9"/>
                <Input label="Fecha" value={gradeForm.date} onChange={v=>setGradeForm({...gradeForm,date:v})} type="date"/>
                <Btn onClick={()=>{
                  if(!gradeForm.subject||gradeForm.grade===''){toast('Nombre y nota requeridos','error');return;}
                  setForm({...form,grades:[...(form.grades||[]),{...gradeForm,grade:parseFloat(gradeForm.grade)}]});
                  setGradeForm({subject:'',grade:'',date:''});
                  toast('Evaluación agregada');
                }} style={{marginBottom:2}}><Icon name="plus" size={14}/>Agregar</Btn>
              </div>
              {/* Grades list */}
              {(form.grades||[]).length===0?(
                <div style={{textAlign:'center',padding:'20px',color:'#9CA3AF',fontSize:13}}>Sin evaluaciones agregadas aún.</div>
              ):(
                <div style={{maxHeight:200,overflowY:'auto'}}>
                  {(form.grades||[]).map((g,i)=>{
                    const gc=Number(g.grade);const gcol=gc>=8?COLORS.success:gc>=6?COLORS.warning:COLORS.danger;
                    return(
                      <div key={i} style={{display:'flex',alignItems:'center',gap:10,padding:'8px 12px',background:i%2===0?'white':'#F8FAFC',borderRadius:8,marginBottom:4}}>
                        <span style={{flex:1,fontSize:13,color:'#374151',fontWeight:500}}>{g.subject}</span>
                        {g.date&&<span style={{fontSize:11,color:'#9CA3AF'}}>{g.date}</span>}
                        <span style={{fontWeight:800,fontSize:14,color:gcol,background:`${gcol}15`,padding:'3px 10px',borderRadius:6}}>{gc}/10</span>
                        <button onClick={()=>setForm({...form,grades:(form.grades||[]).filter((_,j)=>j!==i)})} style={{border:'none',background:'none',cursor:'pointer',color:'#EF4444',fontSize:16,lineHeight:1,padding:'0 4px'}}>×</button>
                      </div>
                    );
                  })}
                </div>
              )}
            </div>
          )}

          <div style={{display:'flex',gap:10,justifyContent:'flex-end',marginTop:20,paddingTop:16,borderTop:'1px solid #F1F5F9'}}>
            <Btn color="secondary" onClick={()=>setModal(null)}>Cancelar</Btn>
            <Btn onClick={save}><Icon name="check" size={15}/>Guardar Estudiante</Btn>
          </div>
        </Modal>
      )}
    </div>
  );
};

// ── DOCTORS ───────────────────────────────────────────────────────────────────
const DoctorsPage=({state,dispatch,toast})=>{
  const [modal,setModal]=React.useState(null);
  const [search,setSearch]=React.useState('');
  const [form,setForm]=React.useState({name:'',specialty:'',license:'',email:'',phone:'',username:'',password:'',status:'active'});
  const save=()=>{
    if(!form.name){toast('Nombre es requerido','error');return;}
    if(modal==='new') dispatch({type:'ADD_DOCTOR',payload:{...form,id:'d'+Date.now(),hospitals:[]}});
    else dispatch({type:'EDIT_DOCTOR',payload:form});
    toast(modal==='new'?'Doctor agregado':'Doctor actualizado');setModal(null);
  };
  const del=d=>{
    const hasPending=state.assignments.some(a=>a.doctorId===d.id&&a.status==='scheduled');
    if(hasPending){toast('No se puede eliminar: tiene prácticas programadas','error');return;}
    if(confirm(`¿Eliminar al Dr(a). ${d.name}?`)){dispatch({type:'DEL_DOCTOR',payload:d.id});toast('Doctor eliminado','info');}
  };
  const filtered=state.doctors.filter(d=>d.name.toLowerCase().includes(search.toLowerCase())||d.specialty?.toLowerCase().includes(search.toLowerCase())||(d.license||'').toLowerCase().includes(search.toLowerCase()));
  const pending=d=>state.assignments.filter(a=>a.doctorId===d.id&&a.status==='scheduled').filter(a=>!state.checklists.find(c=>c.assignmentId===a.id)).length;
  const headers=['Doctor','Especialidad','Licencia','Teléfono','Usuario','Pendientes','Estado','Acciones'];
  const rows=filtered.map(d=>[
    <div><div style={{fontWeight:600}}>{d.name}</div>{d.email&&<div style={{fontSize:11,color:'#9CA3AF'}}>{d.email}</div>}</div>,
    <span style={{fontSize:12}}>{d.specialty}</span>,
    <span style={{fontSize:12,fontFamily:'monospace'}}>{d.license}</span>,
    <span style={{fontSize:12}}>{d.phone}</span>,
    <span style={{fontSize:12,color:COLORS.accent,fontFamily:'monospace'}}>{d.username||'—'}</span>,
    <Badge text={`${pending(d)} pend.`} color={pending(d)>0?'yellow':'green'}/>,
    <Badge text={d.status==='active'?'Activo':'Inactivo'} color={d.status==='active'?'green':'gray'}/>,
    <div style={{display:'flex',gap:5}}>
      <Btn size="sm" color="secondary" onClick={()=>{setForm({...d,email:d.email||'',phone:d.phone||'',username:d.username||'',password:d.password||''});setModal('edit');}}><Icon name="edit" size={13}/></Btn>
      <Btn size="sm" color="danger" onClick={()=>del(d)}><Icon name="trash" size={13}/></Btn>
    </div>
  ]);
  return(
    <div style={{padding:28}}>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:16}}>
        <div style={{position:'relative',width:300}}>
          <div style={{position:'absolute',left:10,top:'50%',transform:'translateY(-50%)'}}><Icon name="search" size={16} color="#9CA3AF"/></div>
          <input placeholder="Buscar doctor..." value={search} onChange={e=>setSearch(e.target.value)} style={{paddingLeft:36,padding:'8px 12px 8px 36px',border:'1.5px solid #D1D5DB',borderRadius:8,fontSize:14,width:'100%',boxSizing:'border-box'}}/>
        </div>
        <Btn onClick={()=>{setForm({name:'',specialty:'',license:'',email:'',phone:'',username:'',password:'',status:'active'});setModal('new');}}><Icon name="plus" size={16}/>Nuevo Doctor</Btn>
      </div>
      <Card style={{padding:0}}><Table headers={headers} rows={rows} emptyMsg="No se encontraron doctores"/></Card>
      {modal&&(
        <Modal title={modal==='new'?'Nuevo Doctor':'Editar Doctor'} onClose={()=>setModal(null)} width={520}>
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:12}}>
            <div style={{gridColumn:'span 2'}}><Input label="Nombre completo" value={form.name} onChange={v=>setForm({...form,name:v})} required/></div>
            <Input label="Especialidad" value={form.specialty||''} onChange={v=>setForm({...form,specialty:v})}/>
            <Input label="N° Licencia / ID" value={form.license||''} onChange={v=>setForm({...form,license:v})}/>
            <Input label="Correo" value={form.email||''} onChange={v=>setForm({...form,email:v})} type="email"/>
            <Input label="WhatsApp" value={form.phone||''} onChange={v=>setForm({...form,phone:v})}/>
            <Input label="Usuario (login)" value={form.username||''} onChange={v=>setForm({...form,username:v})}/>
            <Input label="Contraseña" value={form.password||''} onChange={v=>setForm({...form,password:v})} placeholder="Ej: GPA#2026"/>
            <Select label="Estado" value={form.status||'active'} onChange={v=>setForm({...form,status:v})} options={[{value:'active',label:'Activo'},{value:'inactive',label:'Inactivo'}]}/>
          </div>
          <div style={{display:'flex',gap:10,justifyContent:'flex-end',marginTop:8}}>
            <Btn color="secondary" onClick={()=>setModal(null)}>Cancelar</Btn>
            <Btn onClick={save}><Icon name="check" size={15}/>Guardar</Btn>
          </div>
        </Modal>
      )}
    </div>
  );
};

// ── HOSPITALS ─────────────────────────────────────────────────────────────────
const HospitalsPage=({state,dispatch,toast})=>{
  const [modal,setModal]=React.useState(null);       // null | 'new' | 'edit' | 'areas'
  const [form,setForm]=React.useState({name:'',city:'',address:'',contact:'',phone:''});
  const [areaForm,setAreaForm]=React.useState({name:'',capacity:4,shifts:[]});
  const [shiftForm,setShiftForm]=React.useState({name:'Mañana',start:'07:00',end:'13:00'});

  const save=()=>{
    if(!form.name||!form.city){toast('Nombre y ciudad requeridos','error');return;}
    if(modal==='new') dispatch({type:'ADD_HOSPITAL',payload:{...form,id:'h'+Date.now(),areas:[]}});
    else dispatch({type:'EDIT_HOSPITAL',payload:form});
    toast(modal==='new'?'Hospital registrado':'Hospital actualizado');setModal(null);
  };

  const delHospital=h=>{
    const used=state.assignments.some(a=>a.hospitalId===h.id&&a.status==='scheduled');
    if(used){toast('No se puede eliminar: tiene prácticas activas','error');return;}
    if(confirm(`¿Eliminar "${h.name}"? Esta acción no se puede deshacer.`)){
      dispatch({type:'DEL_HOSPITAL',payload:h.id});
      toast('Hospital eliminado','info');
    }
  };

  const openAreas=h=>{setForm({...h});setAreaForm({name:'',capacity:4,shifts:[]});setShiftForm({name:'Mañana',start:'07:00',end:'13:00'});setModal('areas');};

  const addShiftToAreaForm=()=>{
    if(!shiftForm.name||!shiftForm.start||!shiftForm.end){toast('Completa nombre, inicio y fin','error');return;}
    setAreaForm(f=>({...f,shifts:[...f.shifts,{...shiftForm}]}));
    setShiftForm({name:'',start:'',end:''});
  };
  const removeShiftFromAreaForm=idx=>setAreaForm(f=>({...f,shifts:f.shifts.filter((_,i)=>i!==idx)}));

  const addAreaToHospital=()=>{
    if(!areaForm.name){toast('Nombre del área requerido','error');return;}
    const newArea={...areaForm,id:'a'+Date.now(),capacity:parseInt(areaForm.capacity)||4};
    const updated={...form,areas:[...(form.areas||[]),newArea]};
    setForm(updated);
    dispatch({type:'EDIT_HOSPITAL',payload:updated});
    toast('Área agregada');
    setAreaForm({name:'',capacity:4,shifts:[]});setShiftForm({name:'Mañana',start:'07:00',end:'13:00'});
  };

  const removeAreaFromHospital=(h,areaId)=>{
    if(!confirm('¿Eliminar esta área?')) return;
    const updated={...h,areas:h.areas.filter(a=>a.id!==areaId)};
    dispatch({type:'EDIT_HOSPITAL',payload:updated});
    setForm(updated);
    toast('Área eliminada','info');
  };

  const visibleHospitals=state.hospitals;

  return(
    <div style={{padding:28}}>
      <div style={{display:'flex',justifyContent:'flex-end',marginBottom:16}}>
        <Btn onClick={()=>{setForm({name:'',city:'',address:'',contact:'',phone:''});setModal('new');}}><Icon name="plus" size={16}/>Nuevo Hospital</Btn>
      </div>
      <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(340px,1fr))',gap:16}}>
        {visibleHospitals.map(h=>(
          <Card key={h.id}>
            <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:12}}>
              <div style={{flex:1}}>
                <h4 style={{margin:'0 0 2px',color:COLORS.primary,fontSize:15,fontWeight:700}}>{h.name}</h4>
                <div style={{fontSize:12,color:'#6B7280'}}>{h.city} — {h.address}</div>
                {h.phone&&<div style={{fontSize:11,color:'#9CA3AF',marginTop:2}}>☎ {h.phone}</div>}
              </div>
              <div style={{display:'flex',gap:5,flexShrink:0}}>
                <Btn size="sm" color="secondary" onClick={()=>openAreas(h)} title="Gestionar áreas"><Icon name="hospitals" size={13}/></Btn>
                <Btn size="sm" color="secondary" onClick={()=>{setForm({...h});setModal('edit');}}><Icon name="edit" size={13}/></Btn>
                <Btn size="sm" color="danger" onClick={()=>delHospital(h)}><Icon name="trash" size={13}/></Btn>
              </div>
            </div>
            {(h.areas||[]).length===0&&<div style={{fontSize:12,color:'#9CA3AF',fontStyle:'italic'}}>Sin áreas registradas.</div>}
            {(h.areas||[]).map(a=>(
              <div key={a.id} style={{padding:'10px 12px',background:COLORS.light,borderRadius:8,marginBottom:8}}>
                <div style={{fontWeight:600,fontSize:13,color:COLORS.primary,marginBottom:4}}>{a.name} <span style={{color:'#6B7280',fontWeight:400}}>· cupo: {a.capacity}</span></div>
                <div style={{display:'flex',flexWrap:'wrap',gap:4}}>
                  {(a.shifts||[]).map((s,i)=><Badge key={i} text={`${s.name} ${s.start}-${s.end}`} color="blue"/>)}
                </div>
              </div>
            ))}
          </Card>
        ))}
      </div>

      {/* Hospital form modal */}
      {(modal==='new'||modal==='edit')&&(
        <Modal title={modal==='new'?'Nuevo Hospital':'Editar Hospital'} onClose={()=>setModal(null)}>
          <Input label="Nombre" value={form.name} onChange={v=>setForm({...form,name:v})} required/>
          <Input label="Ciudad" value={form.city||''} onChange={v=>setForm({...form,city:v})} required/>
          <Input label="Dirección" value={form.address||''} onChange={v=>setForm({...form,address:v})}/>
          <Input label="Contacto" value={form.contact||''} onChange={v=>setForm({...form,contact:v})}/>
          <Input label="Teléfono" value={form.phone||''} onChange={v=>setForm({...form,phone:v})}/>
          <div style={{display:'flex',gap:10,justifyContent:'flex-end'}}>
            <Btn color="secondary" onClick={()=>setModal(null)}>Cancelar</Btn>
            <Btn onClick={save}><Icon name="check" size={15}/>Guardar</Btn>
          </div>
        </Modal>
      )}

      {/* Areas management modal */}
      {modal==='areas'&&(
        <Modal title={`Áreas — ${form.name}`} onClose={()=>setModal(null)} width={580}>
          {/* Existing areas */}
          <div style={{marginBottom:16}}>
            <div style={{fontWeight:700,fontSize:13,color:COLORS.primary,marginBottom:8}}>Áreas registradas</div>
            {(form.areas||[]).length===0&&<div style={{fontSize:13,color:'#9CA3AF',fontStyle:'italic'}}>Sin áreas aún.</div>}
            {(form.areas||[]).map(a=>(
              <div key={a.id} style={{display:'flex',alignItems:'center',gap:8,padding:'8px 10px',background:COLORS.light,borderRadius:8,marginBottom:6}}>
                <div style={{flex:1}}>
                  <div style={{fontWeight:600,fontSize:13}}>{a.name} <span style={{color:'#6B7280',fontWeight:400,fontSize:12}}>· cupo {a.capacity}</span></div>
                  <div style={{display:'flex',gap:4,flexWrap:'wrap',marginTop:3}}>
                    {(a.shifts||[]).map((s,i)=><Badge key={i} text={`${s.name} ${s.start}-${s.end}`} color="blue"/>)}
                  </div>
                </div>
                <Btn size="sm" color="danger" onClick={()=>removeAreaFromHospital(state.hospitals.find(h=>h.id===form.id),a.id)}><Icon name="trash" size={12}/></Btn>
              </div>
            ))}
          </div>
          {/* Add new area */}
          <div style={{borderTop:'1.5px solid #E5E7EB',paddingTop:14}}>
            <div style={{fontWeight:700,fontSize:13,color:COLORS.primary,marginBottom:8}}>Agregar nueva área</div>
            <div style={{display:'grid',gridTemplateColumns:'1fr auto',gap:10,marginBottom:8}}>
              <Input label="Nombre del área" value={areaForm.name} onChange={v=>setAreaForm({...areaForm,name:v})}/>
              <Input label="Cupo máx." value={areaForm.capacity} onChange={v=>setAreaForm({...areaForm,capacity:v})} type="number"/>
            </div>
            {/* Shifts for the new area */}
            <div style={{marginBottom:8}}>
              <div style={{fontSize:12,fontWeight:600,color:'#374151',marginBottom:4}}>Tandas del área:</div>
              {areaForm.shifts.map((s,i)=>(
                <div key={i} style={{display:'flex',alignItems:'center',gap:6,marginBottom:4}}>
                  <Badge text={`${s.name} ${s.start}-${s.end}`} color="blue"/>
                  <button onClick={()=>removeShiftFromAreaForm(i)} style={{border:'none',background:'none',cursor:'pointer',color:'#EF4444',fontSize:16,lineHeight:1}}>×</button>
                </div>
              ))}
              <div style={{display:'flex',gap:8,alignItems:'flex-end',marginTop:6}}>
                <Input label="Nombre tanda" value={shiftForm.name} onChange={v=>setShiftForm({...shiftForm,name:v})}/>
                <Input label="Inicio" value={shiftForm.start} onChange={v=>setShiftForm({...shiftForm,start:v})} type="time"/>
                <Input label="Fin" value={shiftForm.end} onChange={v=>setShiftForm({...shiftForm,end:v})} type="time"/>
                <Btn size="sm" color="secondary" onClick={addShiftToAreaForm} style={{marginBottom:2}}>+ Tanda</Btn>
              </div>
            </div>
            <Btn onClick={addAreaToHospital}><Icon name="plus" size={15}/>Guardar Área</Btn>
          </div>
        </Modal>
      )}
    </div>
  );
};

// ── ASSIGNMENTS ───────────────────────────────────────────────────────────────
const AssignmentsPage=({state,dispatch,toast,user})=>{
  const [modal,setModal]=React.useState(false);
  const [filter,setFilter]=React.useState('all');
  const [form,setForm]=React.useState({studentId:'',doctorId:'',hospitalId:'',areaId:'',programId:'',date:'',shift:''});
  const [areas,setAreas]=React.useState([]);
  const [shifts,setShifts]=React.useState([]);
  const list=user.role==='doctor'?state.assignments.filter(a=>a.doctorId===user.id):state.assignments;
  const filtered=filter==='all'?list:list.filter(a=>a.status===filter);
  React.useEffect(()=>{const h=state.hospitals.find(h=>h.id===form.hospitalId);setAreas(h?.areas||[]);setForm(f=>({...f,areaId:'',shift:''}));},[form.hospitalId]);
  React.useEffect(()=>{const h=state.hospitals.find(h=>h.id===form.hospitalId);const a=h?.areas?.find(a=>a.id===form.areaId);setShifts(a?.shifts||[]);setForm(f=>({...f,shift:''}));},[form.areaId]);
  const checkCap=()=>{const h=state.hospitals.find(h=>h.id===form.hospitalId);const a=h?.areas?.find(a=>a.id===form.areaId);if(!a)return true;const taken=state.assignments.filter(as=>as.hospitalId===form.hospitalId&&as.areaId===form.areaId&&as.date===form.date&&as.shift===form.shift&&as.status!=='cancelled').length;return taken<a.capacity;};
  const checkDup=()=>state.assignments.some(a=>a.studentId===form.studentId&&a.date===form.date&&a.status!=='cancelled');
  const save=()=>{
    if(!form.studentId||!form.doctorId||!form.hospitalId||!form.areaId||!form.date||!form.shift){toast('Completa todos los campos','error');return;}
    if(checkDup()){toast('⚠ El estudiante ya tiene práctica ese día','error');return;}
    if(!checkCap()){toast('⚠ Cupo lleno','error');return;}
    const id='as'+Date.now();
    dispatch({type:'ADD_ASSIGNMENT',payload:{...form,id,status:'scheduled',token:'tok_'+id,notified:false,shiftStart:shifts.find(s=>s.name===form.shift)?.start||'',shiftEnd:shifts.find(s=>s.name===form.shift)?.end||''}});
    toast('✅ Asignación creada');setModal(false);
  };
  const sendNotif=a=>{const dr=state.doctors.find(d=>d.id===a.doctorId);dispatch({type:'NOTIFY_ASSIGNMENT',payload:a.id});dispatch({type:'ADD_NOTIFICATION',payload:{id:'n'+Date.now(),recipient:dr?.name,channel:dr?.phone?'whatsapp':'email',type:'practice_reminder',status:'sent',sentAt:new Date().toISOString(),summary:`Lista para práctica ${a.date}`}});toast(`📨 Notificación enviada a ${dr?.name}`);};
  const cancel=a=>{if(confirm('¿Cancelar esta práctica?')){dispatch({type:'CANCEL_ASSIGNMENT',payload:a.id});toast('Práctica cancelada','info');}};
  const complete=a=>{if(confirm('¿Marcar como completada?')){dispatch({type:'COMPLETE_ASSIGNMENT',payload:a.id});toast('✅ Práctica completada');}};
  const countByStatus=(s)=>list.filter(a=>a.status===s).length;
  const headers=['Estudiante','Doctor','Hospital · Área','Programa','Fecha','Estado','Checklist','Acciones'];
  const rows=filtered.map(a=>{
    const st=state.students.find(s=>s.id===a.studentId);
    const dr=state.doctors.find(d=>d.id===a.doctorId);
    const ho=state.hospitals.find(h=>h.id===a.hospitalId);
    const prog=state.programs?.find(p=>p.id===a.programId);
    const cl=state.checklists.find(c=>c.assignmentId===a.id);
    return[
      <div><div style={{fontWeight:600,fontSize:13}}>{st?.name}</div><div style={{fontSize:11,color:'#9CA3AF'}}>{st?.code}</div></div>,
      <div style={{fontSize:13}}>{dr?.name}</div>,
      <div><div style={{fontSize:12,fontWeight:500}}>{ho?.name}</div><div style={{fontSize:11,color:'#9CA3AF'}}>{a.shift}{a.shiftStart?` ${a.shiftStart}-${a.shiftEnd}`:''}</div></div>,
      <span style={{fontSize:12,color:COLORS.accent}}>{prog?.name||'—'}</span>,
      <span style={{fontWeight:600}}>{a.date}</span>,
      <Badge text={a.status==='scheduled'?'Programada':a.status==='completed'?'Completada':'Cancelada'} color={a.status==='scheduled'?'blue':a.status==='completed'?'green':'gray'}/>,
      cl?<Badge text={cl.signed?'✓ Firmado':'En proceso'} color={cl.signed?'green':'yellow'}/>:<Badge text="Sin llenar" color="gray"/>,
      <div style={{display:'flex',gap:4,flexWrap:'wrap'}}>
        {!a.notified&&a.status==='scheduled'&&<Btn size="sm" title="Notificar" onClick={()=>sendNotif(a)}><Icon name="send" size={12}/></Btn>}
        {a.status==='scheduled'&&<Btn size="sm" color="success" title="Marcar completa" onClick={()=>complete(a)}>✓</Btn>}
        {a.status==='scheduled'&&<Btn size="sm" color="danger" title="Cancelar" onClick={()=>cancel(a)}>✕</Btn>}
      </div>
    ];
  });
  return(
    <div style={{padding:28}}>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:16}}>
        <div style={{display:'flex',gap:8}}>
          {[['all','Todas',list.length],['scheduled','Programadas',countByStatus('scheduled')],['completed','Completadas',countByStatus('completed')],['cancelled','Canceladas',countByStatus('cancelled')]].map(([f,label,cnt])=>(
            <button key={f} onClick={()=>setFilter(f)} style={{padding:'6px 14px',borderRadius:8,border:`2px solid ${filter===f?COLORS.accent:'#D1D5DB'}`,background:filter===f?COLORS.accent:'white',color:filter===f?'white':'#374151',fontWeight:600,fontSize:13,cursor:'pointer',display:'flex',gap:6,alignItems:'center'}}>
              {label}<span style={{background:filter===f?'rgba(255,255,255,0.3)':'#E5E7EB',borderRadius:999,padding:'0 6px',fontSize:11}}>{cnt}</span>
            </button>
          ))}
        </div>
        {user.role==='admin'&&<Btn onClick={()=>setModal(true)}><Icon name="plus" size={16}/>Nueva Asignación</Btn>}
      </div>
      <Card style={{padding:0}}><Table headers={headers} rows={rows} emptyMsg="No hay asignaciones"/></Card>
      {modal&&(
        <Modal title="Nueva Asignación" onClose={()=>setModal(false)} width={560}>
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:12}}>
            <Select label="Estudiante" value={form.studentId} onChange={v=>setForm({...form,studentId:v})} required options={state.students.filter(s=>s.status==='active').map(s=>({value:s.id,label:`${s.code} - ${s.name}`}))}/>
            <Select label="Programa" value={form.programId} onChange={v=>setForm({...form,programId:v})} options={(state.programs||[]).map(p=>({value:p.id,label:p.name}))}/>
            <Select label="Doctor Supervisor" value={form.doctorId} onChange={v=>setForm({...form,doctorId:v})} required options={state.doctors.filter(d=>d.status==='active').map(d=>({value:d.id,label:d.name}))}/>
            <Select label="Hospital" value={form.hospitalId} onChange={v=>setForm({...form,hospitalId:v})} required options={state.hospitals.map(h=>({value:h.id,label:h.name}))}/>
            <Select label="Área" value={form.areaId} onChange={v=>setForm({...form,areaId:v})} required options={areas.map(a=>({value:a.id,label:`${a.name} (cupo: ${a.capacity})`}))}/>
            <Select label="Tanda" value={form.shift} onChange={v=>setForm({...form,shift:v})} required options={shifts.map(s=>({value:s.name,label:`${s.name} (${s.start}-${s.end})`}))}/>
            <div style={{gridColumn:'span 2'}}><Input label="Fecha" value={form.date} onChange={v=>setForm({...form,date:v})} type="date" required/></div>
          </div>
          {form.studentId&&form.date&&checkDup()&&<div style={{padding:'8px 12px',background:'#FEE2E2',borderRadius:8,fontSize:13,color:'#991B1B',marginBottom:12}}>⚠ Este estudiante ya tiene práctica el {form.date}.</div>}
          <div style={{display:'flex',gap:10,justifyContent:'flex-end'}}>
            <Btn color="secondary" onClick={()=>setModal(false)}>Cancelar</Btn>
            <Btn onClick={save}><Icon name="check" size={15}/>Crear</Btn>
          </div>
        </Modal>
      )}
    </div>
  );
};

// ── CALENDAR ──────────────────────────────────────────────────────────────────
const CalendarPage=({state,user})=>{
  const [viewDate,setViewDate]=React.useState(new Date(2026,4,1));
  const [selected,setSelected]=React.useState(null);
  const year=viewDate.getFullYear(),month=viewDate.getMonth();
  const firstDay=new Date(year,month,1).getDay();
  const daysInMonth=new Date(year,month+1,0).getDate();
  const MONTHS=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
  const DAYS=['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
  const HOC={h1:'#2E75B6',h2:'#1D6B3B',h3:'#D97706'};
  const dayList=d=>{
    const ds=`${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    let list=state.assignments.filter(a=>a.date===ds&&a.status!=='cancelled');
    if(user.role==='doctor') list=list.filter(a=>a.doctorId===user.id);
    if(user.role==='student') list=list.filter(a=>a.studentId===user.id);
    return list;
  };
  return(
    <div style={{padding:28}}>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:20}}>
        <button onClick={()=>setViewDate(new Date(year,month-1,1))} style={{padding:'6px 14px',border:'1.5px solid #D1D5DB',borderRadius:8,background:'white',cursor:'pointer',fontSize:18}}>‹</button>
        <h3 style={{margin:0,color:COLORS.primary,fontSize:22,fontWeight:700}}>{MONTHS[month]} {year}</h3>
        <button onClick={()=>setViewDate(new Date(year,month+1,1))} style={{padding:'6px 14px',border:'1.5px solid #D1D5DB',borderRadius:8,background:'white',cursor:'pointer',fontSize:18}}>›</button>
      </div>
      <Card style={{padding:0}}>
        <div style={{display:'grid',gridTemplateColumns:'repeat(7,1fr)',borderBottom:'2px solid #E5E7EB'}}>
          {DAYS.map(d=><div key={d} style={{padding:'10px 0',textAlign:'center',fontWeight:700,color:'#6B7280',fontSize:13}}>{d}</div>)}
        </div>
        <div style={{display:'grid',gridTemplateColumns:'repeat(7,1fr)'}}>
          {Array(firstDay).fill(null).map((_,i)=><div key={'e'+i} style={{minHeight:80,background:'#FAFAFA',borderRight:'1px solid #F3F4F6',borderBottom:'1px solid #F3F4F6'}}/>)}
          {Array(daysInMonth).fill(null).map((_,i)=>{
            const d=i+1,alist=dayList(d);
            const ds=`${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
            const isToday=ds===new Date().toISOString().split('T')[0];
            return(
              <div key={d} onClick={()=>setSelected(alist.length>0?ds:null)} style={{minHeight:80,padding:'6px 8px',borderRight:'1px solid #F3F4F6',borderBottom:'1px solid #F3F4F6',cursor:alist.length>0?'pointer':'default',background:selected===ds?'#EBF5FB':'white'}}>
                <div style={{width:24,height:24,borderRadius:'50%',background:isToday?COLORS.accent:'transparent',display:'flex',alignItems:'center',justifyContent:'center',marginBottom:3}}>
                  <span style={{fontSize:13,fontWeight:isToday?700:400,color:isToday?'white':'#374151'}}>{d}</span>
                </div>
                {alist.slice(0,2).map(a=>{const st=state.students.find(s=>s.id===a.studentId);return<div key={a.id} style={{padding:'1px 5px',borderRadius:4,background:HOC[a.hospitalId]||COLORS.accent,color:'white',fontSize:10,fontWeight:600,marginBottom:2,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{st?.name?.split(' ')[0]}</div>;})}
                {alist.length>2&&<div style={{fontSize:10,color:'#6B7280'}}>+{alist.length-2}</div>}
              </div>
            );
          })}
        </div>
      </Card>
      {selected&&(()=>{
        const list=state.assignments.filter(a=>a.date===selected&&a.status!=='cancelled');
        return(
          <Card style={{marginTop:20}}>
            <h4 style={{margin:'0 0 14px',color:COLORS.primary}}>Prácticas del {selected}</h4>
            <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(280px,1fr))',gap:12}}>
              {list.map(a=>{
                const st=state.students.find(s=>s.id===a.studentId);
                const dr=state.doctors.find(d=>d.id===a.doctorId);
                const ho=state.hospitals.find(h=>h.id===a.hospitalId);
                const cl=state.checklists.find(c=>c.assignmentId===a.id);
                return(
                  <div key={a.id} style={{padding:'12px 14px',borderRadius:10,border:`2px solid ${HOC[a.hospitalId]||COLORS.accent}`,background:`${HOC[a.hospitalId]||COLORS.accent}0D`}}>
                    <div style={{fontWeight:700,fontSize:14,color:HOC[a.hospitalId]||COLORS.accent}}>{ho?.name}</div>
                    <div style={{fontWeight:600,fontSize:13,marginTop:4}}>{st?.name}</div>
                    <div style={{fontSize:12,color:'#6B7280'}}>{dr?.name} · {a.shift}</div>
                    <div style={{marginTop:6}}>{cl?<Badge text={cl.signed?'✓ Firmado':'Pendiente'} color={cl.signed?'green':'yellow'}/>:<Badge text="Sin checklist" color="gray"/>}</div>
                  </div>
                );
              })}
            </div>
          </Card>
        );
      })()}
    </div>
  );
};

// ── DAY CHANGES ───────────────────────────────────────────────────────────────
const ChangesPage=({state,dispatch,toast,user})=>{
  const [modal,setModal]=React.useState(false);
  const [form,setForm]=React.useState({studentId:'',originalAssignmentId:'',newDate:'',newShift:'',reason:''});
  const myAssignments=user.role==='student'?state.assignments.filter(a=>a.studentId===user.id&&a.status==='scheduled'):state.assignments.filter(a=>a.status==='scheduled');
  const approve=dc=>{dispatch({type:'APPROVE_CHANGE',payload:dc.id});const st=state.students.find(s=>s.id===dc.studentId);toast(`✅ Cambio aprobado para ${st?.name}`);};
  const reject=dc=>{const reason=prompt('Motivo del rechazo:','Sin cupo disponible');if(reason===null)return;dispatch({type:'REJECT_CHANGE',payload:{id:dc.id,reason}});toast('Rechazada','info');};
  const submit=()=>{
    if(!form.originalAssignmentId||!form.newDate||!form.newShift){toast('Completa todos los campos','error');return;}
    dispatch({type:'ADD_DAY_CHANGE',payload:{...form,studentId:form.studentId||user.id,id:'dc'+Date.now(),status:'pending',requestedAt:new Date().toISOString()}});
    toast('📋 Solicitud enviada');setModal(false);
  };
  const SL={pending:'yellow',approved:'green',rejected:'red'};
  const LL={pending:'Pendiente',approved:'Aprobado',rejected:'Rechazado'};
  const headers=['Estudiante','Original','Solicita','Motivo','Estado','Fecha','Acciones'];
  const rows=state.dayChanges.map(dc=>{
    const st=state.students.find(s=>s.id===dc.studentId);
    const orig=state.assignments.find(a=>a.id===dc.originalAssignmentId);
    const ho=orig?state.hospitals.find(h=>h.id===orig.hospitalId):null;
    return[
      <span style={{fontWeight:600}}>{st?.name}</span>,
      <div style={{fontSize:12}}><div>{orig?.date} · {orig?.shift}</div><div style={{color:'#9CA3AF'}}>{ho?.name}</div></div>,
      <div style={{fontSize:12}}><div style={{fontWeight:600}}>{dc.newDate}</div><div>{dc.newShift}</div></div>,
      <span style={{fontSize:12,color:'#6B7280'}}>{dc.reason||'—'}</span>,
      <Badge text={LL[dc.status]||dc.status} color={SL[dc.status]||'gray'}/>,
      <span style={{fontSize:12,color:'#9CA3AF'}}>{dc.requestedAt?.split('T')[0]}</span>,
      dc.status==='pending'&&user.role==='admin'?(
        <div style={{display:'flex',gap:5}}>
          <Btn size="sm" color="success" onClick={()=>approve(dc)}><Icon name="check" size={13}/>Aprobar</Btn>
          <Btn size="sm" color="danger" onClick={()=>reject(dc)}><Icon name="x" size={13}/>Rechazar</Btn>
        </div>
      ):null
    ];
  });
  return(
    <div style={{padding:28}}>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:16}}>
        {state.dayChanges.filter(d=>d.status==='pending').length>0&&(
          <div style={{padding:'8px 14px',background:'#FEF3C7',borderRadius:8,border:'1.5px solid #F59E0B',fontSize:13,fontWeight:600,color:'#92400E'}}>
            ⚠ {state.dayChanges.filter(d=>d.status==='pending').length} solicitud(es) pendiente(s)
          </div>
        )}
        <div/>
        <Btn onClick={()=>setModal(true)}><Icon name="plus" size={16}/>Solicitar Cambio</Btn>
      </div>
      <Card style={{padding:0}}><Table headers={headers} rows={rows} emptyMsg="No hay solicitudes"/></Card>
      {modal&&(
